# Registre des sources — règles budgétaires (budget), sécurité routière (transports), tabac et alcool (sante).
# Fichiers : model/regles/budget/regles_budgetaires.yaml, model/regles/transports/securite_routiere.yaml,
# model/regles/sante/tabac_alcool.yaml. Consultées le 2026-10-13.
# NB : EUR-Lex et Légifrance bloquent les outils automatisés (protection anti-robots). Les URL Légifrance
# éventuellement citées ont été relevées dans des pages officielles ou des résultats de recherche (cf. note).
# Copies locales des documents téléchargés : system/cache/regles-complements/.
sources:
  # ---------------------------------------------------------------- Budget : Constitution
  - id: rc-cc-constitution-1958
    type: texte_officiel
    editeur: "Conseil constitutionnel"
    titre: "Texte intégral de la Constitution du 4 octobre 1958 en vigueur"
    url: "https://www.conseil-constitutionnel.fr/le-bloc-de-constitutionnalite/texte-integral-de-la-constitution-du-4-octobre-1958-en-vigueur"
    auteurs: []
    date_publication: ""
    consulte_le: "2026-10-13"
    note: "Articles 34, 40, 47 et 47-1 lus dans la version en vigueur."

  # ---------------------------------------------------------------- Budget : règles européennes
  - id: rc-consilium-decision-pde-france-2024
    type: texte_officiel
    editeur: "Conseil de l'Union européenne"
    titre: "Décision du Conseil sur l'existence d'un déficit excessif en France (doc. 12166/24, dossier 2024/0169(NLE))"
    url: "https://data.consilium.europa.eu/doc/document/ST-12166-2024-INIT/fr/pdf"
    auteurs: []
    date_publication: "2024-07-23"
    consulte_le: "2026-10-13"
    note: "Texte de l'acte transmis pour adoption ; adopté le 26 juillet 2024 comme décision (UE) 2024/2122 (JO L du 1er août 2024, ELI https://eur-lex.europa.eu/eli/dec/2024/2122/oj, référence relevée dans la recommandation du Conseil du 21/01/2025). Cite le protocole n° 12 et la « valeur de référence de 3 % du PIB prévue par le TFUE »."

  - id: rc-conseil-rec-pde-france-2025
    type: texte_officiel
    editeur: "Conseil de l'Union européenne (publié par la Commission européenne, DG ECFIN)"
    titre: "Council Recommendation with a view to bringing an end to the situation of an excessive deficit in France (doc. 5033/1/25 REV 1)"
    url: "https://economy-finance.ec.europa.eu/document/download/d70549fa-ab20-439a-a5d5-4391bd3f963e_en?filename=ecofin_5033_fr.pdf"
    auteurs: []
    date_publication: "2025-01-21"
    consulte_le: "2026-10-13"
    note: "Version du 17 janvier 2025 (mention LIMITE) adoptée par le Conseil le 21 janvier 2025 selon la page de la Commission. Fixe l'échéance de correction (2029), les plafonds de croissance des dépenses nettes (annexe I), rappelle la valeur de référence de 60 % pour la dette et l'ajustement structurel minimal de 0,5 % du PIB."

  - id: rc-conseil-rec-psmt-france-2025
    type: texte_officiel
    editeur: "Conseil de l'Union européenne (Journal officiel de l'Union européenne, série C)"
    titre: "Council Recommendation of 21 January 2025 endorsing the national medium-term fiscal-structural plan of France (C/2025/659)"
    url: "https://economy-finance.ec.europa.eu/document/download/f8be355b-dd72-4726-b81e-fea6e416fc1b_en?filename=MTFSP_2025_FR.pdf"
    auteurs: []
    date_publication: "2025-02-10"
    consulte_le: "2026-10-13"
    note: "JO C du 10.2.2025, ELI http://data.europa.eu/eli/C/2025/659/oj. Annexe I : taux de croissance maximaux des dépenses nettes 2025-2029 ; période d'ajustement de 7 ans (2025-2031)."

  - id: rc-ce-pde-france
    type: rapport_institutionnel
    editeur: "Commission européenne (DG ECFIN)"
    titre: "Excessive deficit procedures – France (étapes de la procédure en cours)"
    url: "https://economy-finance.ec.europa.eu/economic-governance-framework/stability-and-growth-pact/corrective-arm-excessive-deficit-procedure/excessive-deficit-procedures-overview/france_en"
    auteurs: []
    date_publication: ""
    consulte_le: "2026-10-13"
    note: "Liste les étapes : rapport 126(3) du 19/06/2024, décision 126(6) du 26/07/2024, recommandation 126(7) du 21/01/2025, rapports d'action de la France des 30/04/2025, 25/11/2025 et 07/05/2026. Aucune abrogation mentionnée."

  # ---------------------------------------------------------------- Budget : programmation et lois financières
  - id: rc-an-ta186-lpfp-2023-2027
    type: texte_officiel
    editeur: "Assemblée nationale"
    titre: "Projet de loi de programmation des finances publiques pour les années 2023 à 2027 — texte définitif (texte adopté n° 186)"
    url: "https://www.assemblee-nationale.fr/dyn/opendata/PRJLANR5L16BTA0186.html"
    auteurs: []
    date_publication: "2023-11-15"
    consulte_le: "2026-10-13"
    note: "Texte considéré comme adopté définitivement (art. 49, al. 3) le 15 novembre 2023, promulgué comme loi n° 2023-1195 du 18 décembre 2023 (JO n° 293 du 19 décembre 2023) après la décision n° 2023-857 DC du 14 décembre 2023 (conforme). Articles 2, 3, 5, 18 et rapport annexé lus."

  - id: rc-senat-dossier-lpfp-2023-2027
    type: texte_officiel
    editeur: "Sénat"
    titre: "Dossier législatif : Programmation des finances publiques pour les années 2023 à 2027"
    url: "https://www.senat.fr/dossier-legislatif/pjl22-071.html"
    auteurs: []
    date_publication: ""
    consulte_le: "2026-10-13"
    note: "Donne la référence de la loi promulguée (loi n° 2023-1195 du 18 décembre 2023, JO n° 293 du 19 décembre 2023) et la décision n° 2023-857 DC du 14 décembre 2023."

  - id: rc-an-plf-2027
    type: texte_officiel
    editeur: "Assemblée nationale"
    titre: "Projet de loi de finances pour 2027 (n° 3210)"
    url: "https://www.assemblee-nationale.fr/dyn/opendata/PRJLANR5L17B3210.html"
    auteurs: []
    date_publication: "2026-10-01"
    consulte_le: "2026-10-13"
    note: "Projet non voté au 13/10/2026. Article liminaire : solde effectif -5,1 % (2025), -5,4 % (2026, cible LFI 2026 révisée de -5,0 %), -5,0 % (2027) ; dette 115,7 / 119,3 / 121,7 % du PIB ; comparaison avec la LPFP 2023-2027, toujours citée comme référence (norme de dépense, charte de budgétisation)."

  # ---------------------------------------------------------------- Budget : comité d'alerte de l'ONDAM
  - id: rc-secu-comite-alerte
    type: rapport_institutionnel
    editeur: "Direction de la sécurité sociale (securite-sociale.fr)"
    titre: "Les avis du comité d'alerte"
    url: "https://www.securite-sociale.fr/la-secu-en-detail/comptes-de-la-securite-sociale/les-avis-du-comite-dalerte"
    auteurs: []
    date_publication: ""
    consulte_le: "2026-10-13"
    note: "Présente le comité (créé par la loi du 13 août 2004), l'historique du seuil (0,75 % initialement, 0,7 % en 2011, 0,6 % en 2012, 0,5 % à partir de 2013 ; plafond légal de 1 %) et la liste des avis 2025-2026."

  - id: rc-comite-alerte-avis-2026-1
    type: rapport_institutionnel
    editeur: "Comité d'alerte sur l'évolution des dépenses d'assurance maladie"
    titre: "Avis du Comité d'alerte n° 2026-1 sur le respect de l'objectif national de dépenses d'assurance maladie (ONDAM)"
    url: "https://www.securite-sociale.fr/files/live/sites/SSFR/files/medias/DSS/2025/Projet%20d'avis%2020.4.2026_.pdf"
    auteurs: []
    date_publication: "2026-04-20"
    consulte_le: "2026-10-13"
    note: "Cite le seuil de 0,5 % « fixé par l'article D. 114-4-0-17 du code de la sécurité sociale » et rappelle l'alerte de l'avis n° 2 du 18 juin 2025. Le nom du fichier porte la mention « Projet d'avis »."

  - id: rc-comite-alerte-avis-2026-2
    type: rapport_institutionnel
    editeur: "Comité d'alerte sur l'évolution des dépenses d'assurance maladie"
    titre: "Avis du Comité d'alerte n° 2026-2 sur le respect de l'objectif national de dépenses d'assurance maladie (ONDAM)"
    url: "https://www.securite-sociale.fr/files/live/sites/SSFR/files/medias/COMITE_D-ALERTE/2026/Avis%20n%202%2025.6.2026.pdf"
    auteurs: []
    date_publication: "2026-06-25"
    consulte_le: "2026-10-13"
    note: "Cite l'article L114-4-1 (seuil « qui ne peut excéder 1 % ») et l'article D. 114-4-0-7 (seuil de 0,5 %, près de 1,4 Md€ en 2026) ; pas d'alerte en 2026 sous réserve d'annulation des 1,1 Md€ de mises en réserve."

  # ---------------------------------------------------------------- Transports
  - id: rc-sp-f19460
