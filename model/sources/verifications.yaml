    auteurs: []
    date_publication: "2026-09-23"
    consulte_le: "2026-10-13"
    note: "Tome II : l'article 17 de la proposition de loi (non adoptée au 13/10/2026) vise à supprimer la clause des articles 222-23-1 et 222-29-2 du code pénal qui impose « une condition d'écart d'âge d'au moins cinq ans » ; le rapporteur rappelle que les faits incestueux n'y sont pas soumis. Copie locale : system/cache/verifications/an-rapport-3190/."
  - id: verif-cc-2023-1058-qpc
    type: texte_officiel
    editeur: "Conseil constitutionnel"
    titre: "Décision n° 2023-1058 QPC du 21 juillet 2023 — M. Roméo N."
    url: "https://www.conseil-constitutionnel.fr/decision/2023/20231058QPC.htm"
    auteurs: []
    date_publication: "2023-07-21"
    consulte_le: "2026-10-13"
    note: "Déclare conforme le premier alinéa de l'article 222-23-1 du code pénal (viol sur mineur de quinze ans « lorsque la différence d'âge entre le majeur et le mineur est d'au moins cinq ans »)."
  - id: verif-senat-tas24-160
    type: texte_officiel
    editeur: "Sénat"
    titre: "Texte adopté n° 160 (2024-2025) — Proposition de loi créant l'homicide routier et visant à lutter contre la violence routière (adoption définitive le 1er juillet 2025, devenue la loi n° 2025-622 du 9 juillet 2025)"
    url: "https://www.senat.fr/leg/tas24-160.html"
    auteurs: []
    date_publication: "2025-07-01"
    consulte_le: "2026-10-13"
    note: "Art. 6 (code de la route, art. L413-1) : délit puni de trois mois d'emprisonnement et 3 750 € ; action publique éteinte par le versement d'une amende forfaitaire de 300 € (minorée 250 €, majorée 600 €) ; entrée en vigueur à une date fixée par décret, au plus tard le 31 décembre 2025."
  # ------------------------------------------------------------------ Droit civil
  - id: verif-senat-qe-15-22513
    type: texte_officiel
    editeur: "Sénat (réponse du ministère de la justice, JO Sénat)"
    titre: "Question écrite n° 22513 (15e législature) : Délai de prescription pour l'action en garantie de vice caché — réponse publiée au JO Sénat le 17 mars 2022, p. 1453"
