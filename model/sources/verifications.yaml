  - id: verif-cnav-circ-2026-29
    type: texte_officiel
    editeur: "Caisse nationale d'assurance vieillesse (Cnav)"
    titre: "Circulaire Cnav n° 2026-29 du 4 septembre 2026 — Retraite anticipée pour carrière longue à compter du 1er septembre 2026"
