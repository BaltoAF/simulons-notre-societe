  # ------------------------------------------------------------------ Nationalité, immigration
  - id: verif-an-ta315-retention-2026
    type: texte_officiel
    editeur: "Assemblée nationale"
    titre: "Texte adopté n° 315 (17e législature) — Proposition de loi visant à renforcer la sécurité, la rétention administrative et la prévention des risques d'attentat (lecture définitive, 16 juin 2026)"
    url: "https://www.assemblee-nationale.fr/dyn/opendata/PIONANR5L17BTA0315.html"
    auteurs: []
    date_publication: "2026-06-16"
    consulte_le: "2026-10-13"
    note: "Art. 10, 1° (CESEDA, art. L741-7, II) : durée cumulée des périodes de rétention pour une même mesure d'éloignement limitée à trois cent soixante jours (cinq cent quarante jours en cas de prolongation au titre de l'art. L742-6) ; cinq placements au plus ; délai de quarante-huit heures entre deux placements. Aucune disposition d'entrée en vigueur différée dans le texte."
  - id: verif-an-dossier-retention-2026
