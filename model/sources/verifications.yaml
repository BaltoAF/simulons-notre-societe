    date_publication: "2026-09-04"
    consulte_le: "2026-10-13"
    note: "Remplace la circulaire n° 2026-17 du 12 juin 2026. Début d'activité avant 20 ans : nés en 1964 60 ans 6 mois (170 trim.) ; 1er janv.-31 mars 1965 60 ans 9 mois (170) ; 1er avril-30 nov. 1965 60 ans 9 mois (171) ; déc. 1965 60 ans 8 mois (171) ; 1966-1969 : 2 ans 6 mois avant l'âge légal (1966 : 60 ans 9 mois ; 1967 : 61 ans ; 1968 : 61 ans 3 mois ; 1969 : 61 ans 6 mois ; 172 trim.) ; 1970 61 ans 9 mois (172). Copie locale : system/cache/verifications/cnav-2026-29/."
  # ------------------------------------------------------------------ Santé
  - id: verif-ccss-octobre-2026
    type: rapport_institutionnel
    editeur: "Commission des comptes de la sécurité sociale (Direction de la sécurité sociale)"
