  # ─────────────────────────────── Travail ───────────────────────────────
  - id: cpl-groupe-experts-smic-2025
    type: rapport_institutionnel
    editeur: "Groupe d'experts sur le Smic (publié par la DG Trésor)"
    titre: "Salaire minimum interprofessionnel de croissance – Rapport du Groupe d'experts, 25 novembre 2025"
    url: "https://www.tresor.economie.gouv.fr/Articles/284b121f-b187-4280-b327-05f18064c3fa/files/1d1d1848-48bb-40a9-a14f-585b8072e716"
    auteurs: ["Stéphane Carcillo", "Erwan Gautier", "Maria Guadalupe", "Claire Lelarge", "Franck Malherbet"]
    date_publication: "2025-11-25"
    consulte_le: "2026-10-13"
    note: "Lien depuis https://www.tresor.economie.gouv.fr/Articles/2018/12/21/rapport-annuel-du-groupe-d-experts-smic (copie : system/cache/complements/groupe-experts-smic-rapport-2025.pdf). Chapitre 1, analyse Dares (enquête Acemo) : « Au 1er novembre 2024, 2,2 millions de salariés des entreprises du secteur privé hors agriculture ont été directement concernés par la revalorisation du Smic horaire anticipée sur celle du 1er janvier 2025 [...], soit 12,4 % des salariés sur ce champ ». Champ : ensemble des salariés sauf apprentis, stagiaires, intérimaires ; secteurs hors agriculture, administration, particuliers employeurs, activités extraterritoriales ; France hors Mayotte. Le site de la Dares (source primaire) refusait l'accès automatisé le 13/10/2026."

  - id: cpl-unedic-montant-t1-2026
    type: rapport_institutionnel
    editeur: "Unédic"
    titre: "Le montant d'indemnisation chômage au 1er trimestre 2026 (Indicateurs de l'Assurance chômage, chiffres clés)"
    url: "https://www.unedic.org/publications/le-montant-dindemnisation-chomage-au-1er-trimestre-2026"
    auteurs: []
    date_publication: "2026-09-24"
    consulte_le: "2026-10-13"
    note: "PDF : https://s3.eusc-de-east-1.amazonaws.eu/unedic-eks-prod-cms/2026/09/23/le-montant-d-indemnisation-chomage-au-t1-2026_uid_6ab3e10cb12cd.pdf (copie : system/cache/complements/unedic-montant-indemnisation-t1-2026.pdf). « Au 1er trimestre 2026, le montant moyen d'allocation mensuelle nette versée aux allocataires de l'Assurance chômage est de 1 055 € » ; 2,6 millions de personnes indemnisées. Source FNA, données brutes ; montant net tenant compte des périodes réellement indemnisées (différent du montant brut théorique publié par France Travail)."

  - id: cpl-unedic-durees-indemnisation-2025
    type: rapport_institutionnel
    editeur: "Unédic"
    titre: "Le point sur les durées d'indemnisation et la consommation des droits"
    url: "https://www.unedic.org/publications/le-point-sur-les-durees-d-indemnisation-et-la-consommation-des-droits"
    auteurs: ["Odile Muller"]
    date_publication: "2025-06-13"
    consulte_le: "2026-10-13"
    note: "PDF : https://s3.eusc-de-east-1.amazonaws.eu/unedic-eks-prod-cms/2025/06/13/Le-point-sur-les-durees-d-indemnisation-et-la-consommation-des-droits_uid_684c15c5b6ed7.pdf (copie : system/cache/complements/unedic-durees-indemnisation-2025-06.pdf). « En 2023, 2,6 millions de droits ont été interrompus. [...] En moyenne, 327 allocations journalières ont été versées au cours de ces droits, ce qui correspond à 11 mois d'indemnisation. » Durée potentielle moyenne : 564 jours (19 mois) ; taux de consommation moyen 60 %. Champ des graphiques : droits ARE ou ASP interrompus au moins 6 mois en 2023. Publication la plus récente sur ce sujet trouvée au 13/10/2026."

  # ─────────────────────────────── Sécurité routière, tabac ───────────────────────────────
  - id: cpl-onisr-bilan-2025
    type: statistique_publique
    editeur: "Observatoire national interministériel de la sécurité routière (ONISR)"
    titre: "Bilan 2025 de la sécurité routière"
    url: "https://www.onisr.securite-routiere.gouv.fr/etat-de-linsecurite-routiere/bilans-annuels-de-la-securite-routiere/bilan-2025-de-la-securite-routiere"
    auteurs: []
    date_publication: "2026-05-29"
    consulte_le: "2026-10-13"
    note: "Page publiée le 29/05/2026, mise à jour le 02/10/2026 (rapport complet du 15/09/2026). « En France métropolitaine, 3 263 personnes sont décédées en 2025, soit 70 tués de plus qu'en 2024 (+ 2,2 %). » ; 252 décès outre-mer ; « 3 515 personnes sont décédées en 2025 sur les routes de France métropolitaine ou d'outre-mer ». Chiffres définitifs (fiche « Chiffres clés 2025 définitifs », copie : system/cache/complements/onisr-chiffres-cles-2025-definitifs.pdf)."

  - id: cpl-ofdt-tabac-2025
    type: statistique_publique
    editeur: "Observatoire français des drogues et des tendances addictives (OFDT)"
    titre: "Tabagisme et arrêt du tabac en 2025 (Notes, bilan annuel)"
    url: "https://www.ofdt.fr/publication/2026/tabagisme-et-arret-du-tabac-en-2025-2681"
    auteurs: []
    date_publication: "2026-05-27"
    consulte_le: "2026-10-13"
    note: "PDF : https://www.ofdt.fr/sites/ofdt/files/2026-05/note-bilan-tabac-2026.pdf (copie : system/cache/complements/ofdt-note-bilan-tabac-2026.pdf). « Les ventes de cigarettes sont de 23 326 tonnes en 2025 et celles de tabac à rouler de 4 438 tonnes » (- 8,7 % pour les cigarettes entre 2024 et 2025) ; ventes totales de tabac dans le réseau des buralistes de France continentale : 30 165 tonnes ; chiffre d'affaires global du tabac : 18,4 Md€ en 2025 (19,3 Md€ en 2024). L'OFDT retient un poids moyen de 1 g de tabac par cigarette."
