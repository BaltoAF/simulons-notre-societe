  - id: cpl-senat-avis-145-t6-plf2026
    type: rapport_institutionnel
    editeur: "Sénat – Commission des lois"
    titre: "Avis n° 145 (2025-2026), tome VI : Projet de loi de finances pour 2026 – Administration pénitentiaire (rapporteur Louis Vogel)"
