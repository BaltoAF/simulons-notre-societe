  # ─────────────────────────────── Fiscalité du patrimoine ───────────────────────────────
  - id: cpl-dgfip-stat-45-ifi-2025
    type: statistique_publique
    editeur: "DGFiP – Département des études et statistiques fiscales"
    titre: "L'impôt sur la fortune immobilière en 2025 (DGFiP Statistiques n° 45)"
    url: "https://www.impots.gouv.fr/dgfip-statistiques-limpot-sur-la-fortune-immobiliere-en-2025"
