# Leviers pour réduire les émissions (« compenser » une réforme qui en ajoute) : coûts par tonne évitée et potentiels,
# relus par l'agent de recherche le 2026-10-31 (pages imprimées des rapports France Stratégie).
sources:
  - id: fs-couts-abattement-logement-2022
    type: rapport_institutionnel
    editeur: "France Stratégie"
    titre: "Les coûts d'abattement – Partie 5 – Logement"
    url: "https://www.strategie-plan.gouv.fr/files/files/Publications/Rapport/fs-2022-rapport-couts-abattement_logement-novembre.pdf"
    auteurs: []
    date_publication: "2022-11-30"
    consulte_le: "2026-10-31"
    note: "Coût socio-économique de la tonne de CO2 évitée (coûts sur 30 ans). Rénovation du parc avec électrification : 160 €/t pour environ 50 % de réduction des émissions, 250 €/t (coût marginal) pour environ 80 % en visant l'étiquette B, 150 €/t en visant C, 420 €/t en visant A (p. 93). Logement au fioul rénové vers B avec électrification : médianes de 20 à 140 €/t selon l'étiquette de départ ; gaz : 10 à 210 €/t (p. 28)."
  - id: fs-couts-abattement-synthese-2023
    type: rapport_institutionnel
    editeur: "France Stratégie"
    titre: "Les coûts d'abattement en France – Note de synthèse"
    url: "https://www.strategie-plan.gouv.fr/files/files/Publications/Rapport/fs-2023-note_de_synthese-les_couts_abattement_en_france-mai_2023.pdf"
    auteurs: []
    date_publication: "2023-05-01"
    consulte_le: "2026-10-31"
    note: "Voiture électrique à la place d'une voiture thermique : 200 à 270 €/t pour une citadine en 2030 (hypothèse favorable de baisse du prix du véhicule), 110 à 190 €/t pour une berline en 2040 (p. 8). Valeur de l'action pour le climat : 250 €2018/t en 2030, 500 en 2040 (p. 3). L'agriculture « reste à étudier » (p. 1)."
  - id: inra-ademe-agriculture-ges-2013
    type: rapport_institutionnel
    editeur: "INRA, pour l'Ademe et les ministères de l'Agriculture et de l'Écologie"
    titre: "Quelle contribution de l'agriculture française à la réduction des émissions de gaz à effet de serre ? (partie II)"
    url: "https://www.inrae.fr/sites/default/files/pdf/fca5a7a52c8f363553b99654d5bae121.pdf"
    auteurs: []
    date_publication: "2013-07-01"
    consulte_le: "2026-10-31"
    note: "Réduction des engrais azotés minéraux : 4,6 à 5,3 MtCO2e par an d'atténuation en 2030 (tableau 28, p. 110), pour un coût de -62,7 à -54,7 € par tonne pour l'agriculteur (un gain), qui n'est pas un coût socio-économique. Étude ancienne."
  - id: cgdd-efese-sequestration-2019
    type: rapport_institutionnel
    editeur: "Commissariat général au développement durable (CGDD)"
    titre: "EFESE – La séquestration de carbone par les écosystèmes en France"
    url: "https://www.notre-environnement.gouv.fr/IMG/pdf/thc3a9ma20-26b15.pdf"
    auteurs: []
    date_publication: "2019-03-01"
    consulte_le: "2026-10-31"
    note: "Puits moyen de la forêt métropolitaine : 5,06 tCO2e par hectare et par an (17,2 millions d'hectares, 87 MtCO2e par an ; données vers 2015), tableau 1, p. 27."
  - id: maa-renouvellement-forestier-2024
    type: rapport_institutionnel
    editeur: "Ministère de l'Agriculture et de la Souveraineté alimentaire"
    titre: "Bilan du dispositif d'aide au renouvellement forestier (2021-2023)"
    url: "https://agriculture.gouv.fr/telecharger/144511"
    auteurs: []
    date_publication: "2024-08-01"
    consulte_le: "2026-10-31"
    note: "203 M€ d'aides engagées pour 46 628 hectares renouvelés en 2021-2023, soit environ 4 350 € par hectare (calcul). Le puits forestier « a diminué d'un tiers en une décennie » (p. 2)."
  - id: citepa-residentiel-2026
    type: statistique_publique
    editeur: "Citepa"
    titre: "Analyse de l'évolution des émissions de GES du secteur résidentiel"
    url: "https://www.citepa.org/wp-content/uploads/2026/06/Analyse_Evolution_Emission_GES_Residentiel_VF.pdf"
    auteurs: []
    date_publication: "2026-06-01"
    consulte_le: "2026-10-31"
    note: "Logement (chauffage, eau chaude, cuisson) : 31,9 MtCO2e en 2024 (31,3 estimé pour 2025), dont gaz 19,6, fioul 7,9, gaz en bouteille 1,8 (p. 7 et 12)."
  - id: mte-prix-produits-petroliers-2026
    type: statistique_publique
    editeur: "Ministère de la Transition écologique (DGEC)"
    titre: "Prix des produits pétroliers : prix HTT et TTC depuis janvier 2020 (fichier hebdomadaire, onglet « Combustibles »)"
    url: "https://www.ecologie.gouv.fr/sites/default/files/documents/Prix%20HTT%20et%20TTC%20depuis%20janvier%202020_0.xlsx"
    auteurs: []
    date_publication: "2026-10"
    consulte_le: "2026-11-01"
    note: "Page : https://www.ecologie.gouv.fr/politiques-publiques/prix-produits-petroliers. Onglet « Combustibles », bloc « MOYENNES ANNUELLES » publié dans le fichier : fioul domestique (livraisons de 2 000 à 4 999 litres), 1,1325 € par litre TTC en 2025 (0,7883 € hors taxes) ; 1,2004 € en 2024 ; 1,4821 € en 2022. Date de publication : mise à jour hebdomadaire, version téléchargée le 01/11/2026."
  - id: sdes-prix-gaz-naturel-2025
    type: statistique_publique
    editeur: "SDES (service des données et études statistiques du ministère de la Transition écologique)"
    titre: "Prix du gaz naturel en France et dans l'Union européenne en 2025"
    url: "https://www.statistiques.developpement-durable.gouv.fr/prix-du-gaz-naturel-en-france-et-dans-lunion-europeenne-en-2025"
    auteurs: []
    date_publication: "2026-07-23"
    consulte_le: "2026-11-01"
    note: "« En 2025, le prix moyen toutes taxes comprises du gaz naturel facturé aux ménages français s'élève à 141,4 €/MWh PCS (pouvoir calorifique supérieur), en hausse de 8,6 % sur un an. Les taxes payées par les ménages représentent 29 % du prix. »"
  - id: insee-g2009-08-clerc-marcus
    type: document_de_travail
    editeur: "Insee (document de travail G 2009/08)"
    titre: "Élasticités-prix des consommations énergétiques des ménages"
    url: "https://www.insee.fr/fr/statistiques/1380837"
    auteurs: ["Marie Clerc", "Vincent Marcus"]
    date_publication: "2009-09"
    consulte_le: "2026-11-01"
    note: "Tableau 1 (séries temporelles 1978-2008) : fioul, élasticité-prix -0,14 à court terme et -0,20 à long terme (à consommation d'énergie domestique donnée) ; énergie domestique dans son ensemble, -0,06 à court terme et -0,17 à long terme ; carburants -0,19 et -0,40."
  - id: insee-bdf-2017-tf106
    type: statistique_publique
    editeur: "Insee (Insee Résultats)"
    titre: "Les dépenses des ménages en France en 2017 – Enquête Budget de famille, tableau TF106 : dépense annuelle moyenne par ménage selon le décile de niveau de vie"
    url: "https://www.insee.fr/fr/statistiques/4648335"
    auteurs: []
    date_publication: "2020-09-15"
    consulte_le: "2026-11-02"
    note: "Fichier https://www.insee.fr/fr/statistiques/fichier/4648335/bdf2017fe_csv.zip, tf106.csv (NOMENCLATURE ; DECUC ; CONSO en euros par an). Carburants et lubrifiants (0722) : 622 € (1er décile), 754, 868, 1 006, 1 174, 1 196, 1 333, 1 288, 1 462, 1 375 € (10e décile) ; ensemble 1 108 €. Gaz et combustibles liquéfiés (0452) : 159 à 386 €, ensemble 253 €. Combustibles liquides (0453) : 73 à 157 €, ensemble 121 €. Consommation totale (champ comptabilité nationale) : 16 123 € (1er décile) à 48 353 € (10e décile)."
  - id: insee-bdm-prix-moyens-detail
    type: statistique_publique
    editeur: "Insee (Banque de données macroéconomiques)"
    titre: "Prix moyens annuels de vente au détail en métropole : gazole (010533883), SP95 (010533882), fioul domestique 1 000 litres livrés (000442765)"
    url: "https://www.insee.fr/fr/statistiques/serie/010533883"
    auteurs: []
    date_publication: "2026"
    consulte_le: "2026-11-02"
    note: "Valeurs 2017 lues dans les séries (accès SDMX https://bdm.insee.fr/series/sdmx/data/SERIES_BDM/<idbank>) : gazole 1,23 € le litre (1,64 € en 2025) ; SP95 1,38 € (1,74 € en 2025) ; fioul domestique 755,53 € les 1 000 litres (1 154,39 € en 2025). Moyennes mensuelles 2017 du gazole (série 000442588) : de 1,17 € (juillet) à 1,28 € (décembre)."
  - id: sdes-prix-gaz-naturel-2018
    type: statistique_publique
    editeur: "SDES (ministère de la Transition écologique), Datalab Essentiel n° 186"
    titre: "Prix du gaz naturel en France et dans l'Union européenne en 2018"
    url: "https://www.statistiques.developpement-durable.gouv.fr/sites/default/files/2019-09/datalab-essentiel-186-prix-du-gaz-naturel-en-2018-septembre2019_1.pdf"
    auteurs: []
    date_publication: "2019-09"
    consulte_le: "2026-11-02"
    note: "« Le prix moyen du gaz naturel sur le marché résidentiel en France s'élève à 76 €/MWh PCS, en progression de 7,7 % par rapport à 2017 », hausse liée à la suppression du tarif spécial de solidarité et à la hausse de la taxe intérieure (5,88 → 8,45 €/MWh PCS au 1er janvier 2018)."
