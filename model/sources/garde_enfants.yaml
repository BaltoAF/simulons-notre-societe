# Registre des sources — garde des jeunes enfants : complément de libre choix du mode de garde (CMG) réformé au
# 1er septembre 2025, et crédit d'impôt pour frais de garde. Consultées le 2026-10-31.
sources:
  - id: jorf-decret-2025-515-cmg
    type: texte_officiel
    editeur: "Journal officiel (Légifrance)"
    titre: "Décret n° 2025-515 du 30 mai 2025 relatif au complément de libre choix du mode de garde"
    url: "https://www.legifrance.gouv.fr/jorf/id/JORFTEXT000051714530"
    auteurs: []
    date_publication: "2025-05-31"
    consulte_le: "2026-10-31"
    note: "Réécrit l'art. D. 531-18 du code de la sécurité sociale (gardes à partir du 1er septembre 2025) : CMG = « coût mensuel de la garde * (1-(revenu mensuel de la famille* taux d'effort applicable/ coût horaire de référence)) ». Taux d'effort assistante maternelle : 0,0619 % (1 enfant), 0,0516 % (2), 0,0413 % (3), 0,0310 % (4 à 7), 0,0206 % (8 à 10) ; garde à domicile : le double. Coût horaire de référence 4,85 € (assistante maternelle), plafond horaire 8 € ; ressources plafonnées à 8 500 € par mois ; âge porté à 12 ans pour les parents isolés (D. 531-18-1)."
  - id: urssaf-reevaluation-cmg-2026
    type: texte_officiel
    editeur: "Urssaf (Pajemploi)"
    titre: "Réévaluation du coût médian et du plafond horaire du CMG au 1er avril 2026"
    url: "https://www.urssaf.fr/accueil/actualites/actualite-reevaluation-cmg.html"
    auteurs: []
    date_publication: "2026-04-01"
    consulte_le: "2026-10-31"
    note: "À compter du 1er avril 2026 : coût horaire de référence de l'assistante maternelle 4,91 € (+1,24 %), plafond horaire 8,09 € ; garde à domicile 10,50 € et 15,18 €. Revalorisation annuelle selon le SMIC. Page lue par extrait (connexion directe refusée)."
  - id: caf-bareme-eaje-2026
    type: texte_officiel
    editeur: "Caisse nationale des allocations familiales"
    titre: "Barèmes de participation des familles 2026 (accueil du jeune enfant)"
    url: "https://www.caf.fr/sites/default/files/medias/661/Espace-Partenaires/Documents-Partenaires/2026-Baremes-Participation-Famille-Eaje.pdf"
    auteurs: []
    date_publication: "2026-01-01"
    consulte_le: "2026-10-31"
    note: "Plancher de ressources « 814,62 € au 1er janvier 2026 » ; plafond « maintenu à 8 500 € ». Les mêmes bornes s'appliquent au CMG (art. D. 531-18 CSS)."
  - id: caf-faq-reforme-cmg
    type: rapport_institutionnel
    editeur: "Caisse nationale des allocations familiales"
    titre: "Réforme du CMG : la foire aux questions"
    url: "https://www.caf.fr/allocataires/actualites/actualites-nationales/reforme-du-cmg-la-foire-aux-questions"
    auteurs: []
    date_publication: "2025-09-01"
    consulte_le: "2026-10-31"
    note: "Plus de reste à charge minimum de 15 %, plus de différence selon l'âge avant 6 ans, chaque heure financée ; cotisations sociales de l'assistante maternelle prises en charge à 100 %. Ressources : 1/12 de l'assiette N-2 des prestations familiales (revenus 2024 en 2026)."
