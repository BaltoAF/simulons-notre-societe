sources:
  # ---------------------------------------------------------------------------
  # DEMOGRAPHIE - MENAGES (Insee)
  # ---------------------------------------------------------------------------
  - id: insee-ip2087-bilan-demographique-2025
    type: statistique_publique
    editeur: "Insee"
    titre: "Bilan démographique 2025 - Insee Première n° 2087"
    url: "https://www.insee.fr/fr/statistiques/8719824"
    auteurs: ["Hélène Thélot"]
    date_publication: "2026-01-13"
    consulte_le: "2026-10-13"
    note: "Données téléchargées : https://www.insee.fr/fr/statistiques/fichier/8719824/ip2087.xlsx (figure 6b : répartition par grand groupe d'âges). Population au 1er janvier 2026 provisoire."

  - id: insee-pop3-population-age-detaille-2026
    type: statistique_publique
    editeur: "Insee"
    titre: "Bilan démographique 2025 - Chiffres détaillés, tableau POP3 : population au 1er janvier par sexe et âge détaillé"
    url: "https://www.insee.fr/fr/statistiques/8721185?sommaire=8721209"
    auteurs: []
    date_publication: "2026-01-13"
    consulte_le: "2026-10-13"
    note: "Fichier : https://www.insee.fr/fr/statistiques/fichier/8721185/3_Pop1janv_age.xlsx (onglet 2026, estimation provisoire arrêtée fin 2025). Les effectifs par tranche d'âge des métriques sont des sommes des âges détaillés calculées par le Système."

  - id: insee-rp2023-menages-structure-familiale
    type: statistique_publique
    editeur: "Insee"
    titre: "Ménages selon la structure familiale - Données annuelles de 1990 à 2023 (recensement de la population)"
    url: "https://www.insee.fr/fr/statistiques/2381514"
    auteurs: []
    date_publication: "2026-06-25"
    consulte_le: "2026-10-13"
    note: "Fichier : https://www.insee.fr/fr/statistiques/fichier/2381514/demo-couple-menage-struct.xlsx. Champ : France hors Mayotte, population des ménages. Source RP2023, exploitation complémentaire."

  - id: insee-rp2023-taille-menages
    type: statistique_publique
    editeur: "Insee"
    titre: "Taille des ménages - Données annuelles de 1968 à 2023 (recensement de la population)"
    url: "https://www.insee.fr/fr/statistiques/2381486"
    auteurs: []
    date_publication: "2026-06-25"
    consulte_le: "2026-10-13"
    note: "Fichier : https://www.insee.fr/fr/statistiques/fichier/2381486/demo-couple-taille-menage.xlsx. Champ : France hors Mayotte, population des ménages. RP2023, exploitation principale."

  - id: insee-rp2023-familles-enfants-mineurs
    type: statistique_publique
    editeur: "Insee"
    titre: "Familles selon le nombre d'enfants mineurs - Données annuelles de 1990 à 2023 (recensement de la population)"
    url: "https://www.insee.fr/fr/statistiques/2381506"
    auteurs: []
    date_publication: "2026-06-25"
    consulte_le: "2026-10-13"
    note: "Fichier : https://www.insee.fr/fr/statistiques/fichier/2381506/demo-couple-famille-nbr-enf.xlsx. Champ : France hors Mayotte, familles avec au moins un enfant de 0 à 17 ans."

  # ---------------------------------------------------------------------------
  # REVENUS - NIVEAU DE VIE - SALAIRES (Insee)
  # ---------------------------------------------------------------------------
  - id: insee-ip2117-niveau-vie-pauvrete-2024
    type: statistique_publique
    editeur: "Insee"
    titre: "Niveau de vie et pauvreté en 2024 - Insee Première n° 2117"
    url: "https://www.insee.fr/fr/statistiques/9019316"
    auteurs: []
    date_publication: "2026-07-09"
    consulte_le: "2026-10-13"
    note: "Fichier : https://www.insee.fr/fr/statistiques/fichier/9019316/ip2117.xlsx. Source : enquête Revenus fiscaux et sociaux (ERFS) 2024. Champ : France métropolitaine, personnes en logement ordinaire, ménage à revenu déclaré positif ou nul dont la personne de référence n'est pas étudiante (63,8 millions de personnes)."

  - id: insee-distribution-niveaux-vie-2024
    type: statistique_publique
    editeur: "Insee"
    titre: "Distribution des niveaux de vie - Données annuelles de 1996 à 2024"
    url: "https://www.insee.fr/fr/statistiques/2416808"
    auteurs: []
    date_publication: "2026-07-09"
    consulte_le: "2026-10-13"
    note: "Fichier : https://www.insee.fr/fr/statistiques/fichier/2416808/reve-niv-vie-decile-individu.xlsx (déciles D1 à D9 en euros 2024). Même champ que l'Insee Première n° 2117."

  - id: insee-niveau-vie-moyen-decile-2024
    type: statistique_publique
    editeur: "Insee"
    titre: "Niveau de vie moyen par décile - Données annuelles de 1996 à 2024"
    url: "https://www.insee.fr/fr/statistiques/2417897"
    auteurs: []
    date_publication: "2026-07-09"
    consulte_le: "2026-10-13"
    note: "Fichier : https://www.insee.fr/fr/statistiques/fichier/2417897/reve-niv-vie-decile.xlsx. Même champ que l'Insee Première n° 2117."

  - id: insee-ip2079-salaires-prive-2024
    type: statistique_publique
    editeur: "Insee"
    titre: "Les salaires dans le secteur privé en 2024 - Insee Première n° 2079"
    url: "https://www.insee.fr/fr/statistiques/8657156"
    auteurs: []
    date_publication: "2025-10-23"
    consulte_le: "2026-10-13"
    note: "Fichier : https://www.insee.fr/fr/statistiques/fichier/8657156/ip2079.xlsx (base Tous salariés 2024). Champ : France, salariés du privé y compris alternants, stagiaires et contrats aidés, hors agriculture et particuliers employeurs. Dernière édition disponible au 13/10/2026 (l'édition sur 2025 n'était pas trouvée)."

  - id: insee-ip2114-non-salaries-2024
    type: statistique_publique
    editeur: "Insee"
    titre: "Les revenus d'activité des non-salariés en 2024 - Insee Première n° 2114"
    url: "https://www.insee.fr/fr/statistiques/9013403"
    auteurs: []
    date_publication: "2026-06-30"
    consulte_le: "2026-10-13"
    note: "Fichier : https://www.insee.fr/fr/statistiques/fichier/9013403/IP2114.xlsx (bases Non-salariés). Revenus mensuels moyens, déficits mis à 0."

  # ---------------------------------------------------------------------------
  # EMPLOI
  # ---------------------------------------------------------------------------
  - id: insee-ir214-emploi-salarie-t2-2026
    type: statistique_publique
    editeur: "Insee"
    titre: "Au deuxième trimestre 2026, l'emploi salarié est quasi stable (-0,1 %) - Informations rapides n° 214"
    url: "https://www.insee.fr/fr/statistiques/9039152"
    auteurs: []
    date_publication: "2026-08-28"
    consulte_le: "2026-10-13"
    note: "Niveaux CVS en fin de trimestre, France hors Mayotte. L'estimation de l'emploi non salarié du dernier trimestre est expérimentale."

  - id: insee-eec-2025-statut-activite-ptot01
    type: statistique_publique
    editeur: "Insee"
    titre: "Activité, emploi et chômage en 2025 et en séries longues - Tableau PTOT01 : statut d'activité au sens du BIT selon le sexe et l'âge"
    url: "https://www.insee.fr/fr/statistiques/9012129?sommaire=8977323"
    auteurs: []
    date_publication: "2026-07-02"
    consulte_le: "2026-10-13"
    note: "Fichier : https://www.insee.fr/fr/statistiques/fichier/9012129/EEC_PTOT01.xlsx (enquête Emploi en continu 2025, moyenne annuelle). Champ : France, personnes de 15 ans ou plus vivant en logement ordinaire."

  - id: insee-ip2096-marche-travail-2025
    type: statistique_publique
    editeur: "Insee"
    titre: "Une photographie du marché du travail en 2025 - Insee Première n° 2096"
    url: "https://www.insee.fr/fr/statistiques/8901327"
    auteurs: []
    date_publication: "2026-03-25"
    consulte_le: "2026-10-13"
    note: "Fichier : https://www.insee.fr/fr/statistiques/fichier/8901327/ip2096.xlsx (enquête Emploi 2025). Champ : France, personnes en logement ordinaire."

  - id: drees-effectifs-retraites-2024
    type: statistique_publique
    editeur: "DREES"
    titre: "Effectifs de retraités et montants des pensions versées : mise à disposition des données 2024"
    url: "https://drees.solidarites-sante.gouv.fr/communique-de-presse-jeux-de-donnees/jeux-de-donnees/effectifs-de-retraites-et-montants-des"
    auteurs: []
    date_publication: "2026-05-26"
    consulte_le: "2026-10-13"
    note: "Effectifs au 31 décembre 2024 (EACR, EIR, modèle ANCETRE). Données : https://data.drees.solidarites-sante.gouv.fr/explore/dataset/donnes_eacr/information/"

  # ---------------------------------------------------------------------------
  # LOGEMENT
  # ---------------------------------------------------------------------------
  - id: insee-sdes-statut-occupation-2026
    type: statistique_publique
    editeur: "Insee-SDES"
    titre: "Statut d'occupation des résidences principales - Données annuelles de 1982 à 2026"
    url: "https://www.insee.fr/fr/statistiques/2415555"
    auteurs: []
    date_publication: "2026-09-30"
    consulte_le: "2026-10-13"
    note: "Fichier : https://www.insee.fr/fr/statistiques/fichier/2415555/cond-logt-statut-occup.xlsx. Estimations annuelles du parc de logements au 1er janvier, France hors Mayotte ; 2024 à 2026 provisoires."

  - id: sdes-datalab-loyers-parc-social-apl-2026
    type: statistique_publique
    editeur: "SDES (ministère de la Transition écologique)"
    titre: "Les loyers du parc social au regard des loyers plafonds des APL - Datalab Essentiel"
    url: "https://www.statistiques.developpement-durable.gouv.fr/media/9309/download?inline"
    auteurs: ["Benoit Mathieu"]
    date_publication: ""
    consulte_le: "2026-10-13"
    note: "Publication datée « mai 2026 » (jour exact non indiqué). Loyers mensuels moyens principaux (hors charges, surloyers, taxes) en 2020, France métropolitaine, d'après l'enquête nationale logement 2020 - dernière enquête logement disponible."

  - id: sdes-rpls-2025
    type: statistique_publique
    editeur: "SDES (ministère de la Transition écologique)"
    titre: "5,4 millions de logements locatifs sociaux en France au 1er janvier 2025 (répertoire RPLS)"
    url: "https://www.statistiques.developpement-durable.gouv.fr/54-millions-de-logements-locatifs-sociaux-en-france-au-1er-janvier-2025"
    auteurs: []
    date_publication: "2026-01-20"
    consulte_le: "2026-10-13"
    note: "Loyer moyen au m² du parc locatif social conventionné au 1er janvier 2025."

  # ---------------------------------------------------------------------------
  # IMPOT SUR LE REVENU (DGFiP)
  # ---------------------------------------------------------------------------
  - id: dgfip-ircom-2025-revenus-2024
    type: statistique_publique
    editeur: "DGFiP - Département des études et statistiques fiscales (data.gouv.fr)"
    titre: "Impôt sur les revenus de 2024 déclarés en 2025 par collectivité territoriale (IRCOM 2025) - fichier national"
    url: "https://www.data.gouv.fr/datasets/limpot-sur-le-revenu-par-collectivite-territoriale-ircom"
    auteurs: []
    date_publication: "2026-05-26"
    consulte_le: "2026-10-13"
    note: "Archive : https://static.data.gouv.fr/resources/limpot-sur-le-revenu-par-collectivite-territoriale-ircom/20260526-131537/ircom-2025-revenus-2024.zip, fichier national/national.xls (montants en milliers d'euros, convertis en euros). Impôt net : impôt émis par voie de rôle, hors prélèvement forfaitaire obligatoire, hors prélèvements libératoires et hors impôt sur les plus-values immobilières. Champ : France entière y compris non-résidents (298 023 foyers)."

  - id: dgfip-ir-deciles-rfr-par-part-2024
    type: statistique_publique
    editeur: "DGFiP"
    titre: "Impôt sur le revenu - Répartition de l'impôt moyen par déciles de RFR par part (revenus 2024)"
    url: "https://www.impots.gouv.fr/sites/default/files/media/9_statistiques/0_etudes_et_stats/1_statistiques/1_impots_particuliers/ir/nid_25518_ir_deciles_rfr_par_part.xlsx"
    auteurs: []
    date_publication: "2026-04-07"
    consulte_le: "2026-10-13"
    note: "Tableau listé sur https://www.impots.gouv.fr/impot-sur-le-revenu (mis à jour le 07/04/2026). Onglet a2024 : données issues de la 6e émission des revenus 2024 ; bornes et montants en milliers d'euros arrondis (convertis en euros)."

  - id: dgfip-ir-taux-marginal-2024
    type: statistique_publique
    editeur: "DGFiP"
    titre: "Impôt sur le revenu - Nombre de foyers et montant de l'impôt net par taux marginal de taxation du barème (revenus 2024)"
    url: "https://www.impots.gouv.fr/sites/default/files/media/9_statistiques/0_etudes_et_stats/1_statistiques/1_impots_particuliers/ir/nid_25519_ir_taux_marginal.xlsx"
    auteurs: []
    date_publication: "2026-04-07"
    consulte_le: "2026-10-13"
    note: "Seuls les foyers soumis au barème progressif sont comptés (41 426 564) ; 209 000 foyers, essentiellement non-résidents, imposés à taux fixe sont exclus. Impôt émis par voie de rôle après crédits d'impôt hors PFO."

  # ---------------------------------------------------------------------------
  # PRESTATIONS (DREES, CNAF)
  # ---------------------------------------------------------------------------
  - id: drees-minima-sociaux-rsa-prime-activite-2024
    type: statistique_publique
    editeur: "DREES (data.drees)"
    titre: "Minima sociaux, RSA et prime d'activité - données nationales par dispositif, données de dépenses et données nationales RSA/prime d'activité"
    url: "https://data.drees.solidarites-sante.gouv.fr/explore/dataset/336_minima-sociaux-rsa-et-prime-d-activite/information/"
    auteurs: []
    date_publication: "2025-12-04"
    consulte_le: "2026-10-13"
    note: "Pièces jointes utilisées : minima-sociaux-données-nationales par dispositif.xlsx (allocataires au 31/12, France), minima-sociaux-données de dépenses par dispositif.xlsx (dépenses en millions d'euros constants 2024, donc courants pour 2024), RSA et prime d'activité-données nationales.xlsx. Sources : CNAF, MSA, CNAV, FSV, Caisse des dépôts, etc."

  - id: drees-suivi-mensuel-prestations-solidarite-aout-2026
    type: statistique_publique
    editeur: "DREES (data.drees)"
    titre: "Données mensuelles sur les prestations de solidarité - édition d'août 2026"
    url: "https://data.drees.solidarites-sante.gouv.fr/explore/dataset/donnees-mensuelles-sur-les-prestations-de-solidarite/information/"
    auteurs: []
    date_publication: "2026-09-02"
    consulte_le: "2026-10-13"
    note: "Pièce jointe : Données mensuelles prestations de solidarité_Août26.xlsx, tableau 1. RSA et prime d'activité : champ CNAF + MSA, France ; aides au logement et AAH : champ Caf seulement. Données de février à juin 2026 provisoires ; décembre 2025 définitif (sauf ASS)."

  - id: drees-panorama-minima-sociaux-2025
    type: statistique_publique
    editeur: "DREES"
    titre: "Minima sociaux et prestations de solidarité - Ménages aux revenus modestes et redistribution - édition 2025 (Panoramas de la DREES)"
    url: "https://drees.solidarites-sante.gouv.fr/publications-communique-de-presse/panoramas-de-la-drees/251204-minima-sociaux-et-prestations-de-solidarite"
    auteurs: ["J. Blasco", "P.-Y. Cabannes", "O. Echegu (dir.)"]
    date_publication: "2025-12-04"
    consulte_le: "2026-10-13"
    note: "Fichiers de données utilisés : fiche 34 « Les aides au logement » (graphique 2, allocataires tous régimes au 31/12, données définitives FR6) et fiche 35 « La complémentaire santé solidaire (C2S) » (graphique 1, sources CNAM, MSA, calculs DSS). Fichiers .xlsx hébergés sous https://drees.solidarites-sante.gouv.fr/sites/default/files/2025-12/."

  - id: cnaf-depenses-tous-regimes-national
    type: statistique_publique
    editeur: "CNAF (data.caf.fr)"
    titre: "Dépenses tous régimes [National] - prestations familiales et sociales gérées par la branche Famille"
    url: "https://data.caf.fr/explore/dataset/dep_tr_nat/information/"
    auteurs: []
    date_publication: "2025-11-21"
    consulte_le: "2026-10-13"
    note: "Dépenses annuelles en millions d'euros (converties en euros), colonne « tous régimes, France entière ». RSA : hors départements où il est recentralisé dans les comptes de l'Etat (Guyane, Mayotte, La Réunion, Seine-Saint-Denis, Pyrénées-Orientales)."

  - id: cnaf-allocataires-par-prestation-national
    type: statistique_publique
    editeur: "CNAF (data.caf.fr)"
    titre: "Toutes prestations - Répartition des allocataires selon la prestation [National]"
    url: "https://data.caf.fr/explore/dataset/s_ben_nat/information/"
    auteurs: []
    date_publication: "2026-10-09"
    consulte_le: "2026-10-13"
    note: "Foyers allocataires mensuels des Caf (régime général), France, depuis 2016. Mois le plus récent disponible : janvier 2026."

  # ---------------------------------------------------------------------------
  # AGREGATS DE PRELEVEMENTS
  # ---------------------------------------------------------------------------
  - id: ccss-octobre-2026
    type: rapport_institutionnel
    editeur: "Commission des comptes de la Sécurité sociale (DSS)"
    titre: "Les comptes de la Sécurité sociale - Résultats 2025, prévisions 2026 et 2027 - rapport d'octobre 2026"
    url: "https://www.securite-sociale.fr/files/live/sites/SSFR/files/medias/CCSS/2026/CCSS-octobre-2026_assemble_VDEF.pdf"
    auteurs: []
    date_publication: ""
    consulte_le: "2026-10-13"
    note: "Rapport daté « octobre 2026 » (jour exact non lu). Synthèse, tableau 5 (recettes des régimes obligatoires de base et du FSV) ; fiche 1.3, tableau 5 (rendement de la CSG par attributaire) ; fiche 5.6, encadré 1 (ressources de la CADES)."

  - id: urssaf-masse-salariale-prive-trimestrielle
    type: statistique_publique
    editeur: "Urssaf Caisse nationale (open.urssaf.fr)"
    titre: "Masse salariale trimestrielle du secteur privé (y compris estimation précoce), France entière"
    url: "https://open.urssaf.fr/explore/dataset/masse-salariale-du-secteur-prive-france-entiere/information/"
    auteurs: []
    date_publication: "2026-08-28"
    consulte_le: "2026-10-13"
    note: "Masse salariale = assiette déplafonnée des cotisations, secteur privé, régime général, France entière. Séries labellisées par l'Autorité de la statistique publique. Le total annuel des métriques est la somme des quatre trimestres bruts (estimation à T+60 jours) calculée par le Système."
