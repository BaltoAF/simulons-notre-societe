# Registre des sources des indicateurs de bien-être et de « nouvelles richesses » (model/metriques/bien_etre.yaml).
# Fichiers téléchargés conservés dans system/cache/bien-etre/. Légifrance et interieur.gouv.fr (Interstats/SSMSI)
# n'ont pas pu être lus (vérification anti-robot) : les valeurs proviennent des autres pages citées.
sources:
  # ---------------------------------------------------------------------------
  # NOUVEAUX INDICATEURS DE RICHESSE (loi n° 2015-411)
  # ---------------------------------------------------------------------------
  - id: be-jorf-loi-2015-411
    type: texte_officiel
    editeur: "Légifrance (DILA)"
    titre: "Loi n° 2015-411 du 13 avril 2015 visant à la prise en compte des nouveaux indicateurs de richesse dans la définition des politiques publiques"
    url: "https://www.legifrance.gouv.fr/affichTexte.do?cidTexte=JORFTEXT000030478182&categorieLien=id"
    auteurs: []
    date_publication: ""
    consulte_le: "2026-10-13"
    note: "URL reprise du lien figurant sur la page Insee « Indicateurs de richesse nationale » ; contenu non consulté par l'agent (Légifrance protégé par une vérification anti-robot). Intitulé et contenu de l'article unique lus dans la question écrite au Sénat (id be-senat-qe-2022-nir) : rapport annuel du Gouvernement au Parlement présentant l'évolution de nouveaux indicateurs de richesse et une évaluation qualitative ou quantitative de l'impact des principales réformes engagées."

  - id: be-senat-qe-2022-nir
    type: rapport_institutionnel
    editeur: "Sénat"
    titre: "Question écrite de M. Éric Kerrouche (Landes - SER) publiée le 07/07/2022 et réponse du Premier ministre - nouveaux indicateurs de richesse"
    url: "https://www.senat.fr/questions/base/2022/qSEQ220700525.html"
    auteurs: []
    date_publication: "2022-10-06"
    consulte_le: "2026-10-13"
    note: "Date = publication de la réponse. Cite la loi n° 2015-411 (« visant à la prise en compte des nouveaux indicateurs de richesse dans la définition des politiques publiques ») : rapport remis « avant le 1er juin de chaque année » avec une évaluation de l'impact des principales réformes. Réponse : la dernière édition du tableau de bord des 10 indicateurs avait été publiée sur insee.fr le 7 décembre 2021."

  - id: be-insee-nir-2025
    type: statistique_publique
    editeur: "Insee"
    titre: "Les nouveaux indicateurs de richesse - Indicateurs statistiques - Chiffres détaillés - Édition 2025"
    url: "https://www.insee.fr/fr/statistiques/fichier/3281778/NIR2025.pdf"
    auteurs: []
    date_publication: "2026-07-17"
    consulte_le: "2026-10-13"
    note: "Page « Indicateurs de richesse nationale » : https://www.insee.fr/fr/statistiques/3281778 (parue le 17/07/2026). Valeurs lues dans le texte du PDF (les graphiques ne donnent pas de valeurs) : taux d'emploi 2024 68,8 % ; DIRD/PIB 2,18 % en 2023 et 2024 (estimation) ; dette publique 98,2 % (2019), 109,5 % (2023), 112,6 % (2024), SNF 91,1 / 92,3 / 90,7 %, ménages 61,5 / 61,7 / 59,6 % ; EVSI 2024 63,7 ans (H) et 64,1 ans (F) ; satisfaction 7,2/10 ; S80/S20 2023 4,5 ; privation 12,7 % début 2024 ; sorties précoces 2024 7,9 % ; empreinte carbone 2024 563 Mt, 8,2 t/hab (9,5 t en 2019, 12,7 t en 2008) ; artificialisation (Teruti) 5,8 % (1983), 6,8 % (1993), 7,7 % (2003), 8,8 % (2013), 9,5 % (2023) du territoire métropolitain (étiquettes de la figure 1). Sources européennes : Eurostat, extractions de décembre 2025."

  - id: be-insee-nir-emploi-2024
    type: statistique_publique
    editeur: "Insee"
    titre: "Indicateurs de richesse nationale - Taux d'emploi : fichier de données de l'édition 2024 (Tableau 1, taux d'emploi des 15-64 ans par sexe depuis 1975)"
    url: "https://www.insee.fr/fr/statistiques/3281596?sommaire=3281778"
    auteurs: []
    date_publication: ""
    consulte_le: "2026-10-13"
    note: "Fichier « 01_Taux_emploi_2024_rapport(version juin 2024).xlsx » toujours proposé sur la page (parue le 17/07/2026) ; données 1975-2023, France hors Mayotte, enquête Emploi. Cohérent avec l'édition 2025 (68,4 % en 2023, 64,7 % en 2015)."

  - id: be-insee-nir-recherche-2024
    type: statistique_publique
    editeur: "Insee / MESRE-SIES"
    titre: "Indicateurs de richesse nationale - Dépenses de recherche : fichier de données de l'édition 2024 (Tableau 1, DIRD/PIB France et UE-27)"
    url: "https://www.insee.fr/fr/statistiques/3281637?sommaire=3281778"
    auteurs: []
    date_publication: ""
    consulte_le: "2026-10-13"
    note: "Fichier « Effort-recherche_tableaux_2024.xlsx » ; données 1990-2022 (2023 alors estimé à 2,19 %, remplacé par 2,18 % de l'édition 2025). Cohérent avec l'édition 2025 pour 2015 (2,23 %) et 2022 (2,22 %)."

  - id: be-insee-nir-evsi-2024
    type: statistique_publique
    editeur: "Insee / DREES"
    titre: "Indicateurs de richesse nationale - Espérance de vie en bonne santé : fichier de données de l'édition 2024 (Tableau 1)"
    url: "https://www.insee.fr/fr/statistiques/3281641?sommaire=3281778"
    auteurs: []
    date_publication: "2024-12-01"
    consulte_le: "2026-10-13"
    note: "Fichier « 04_Esperance_vie_bonne_sante_Rapport2024.xlsx », « mis à jour décembre 2024 » (date approchée au 1er du mois) : espérance de vie sans incapacité à la naissance 2004-2023 par sexe (DREES, méthode Ehemu, enquête SRCV). Cohérent avec l'édition 2025 (2015 : 62,7 / 64,5 ans ; 2023 : 63,6 / 64,2 ans)."

  # ---------------------------------------------------------------------------
  # SATISFACTION DANS LA VIE, INÉGALITÉS, PRIVATION (Insee)
  # ---------------------------------------------------------------------------
  - id: be-insee-srcv-satisfaction-2025
    type: statistique_publique
    editeur: "Insee"
    titre: "Satisfaction dans la vie de 2010 à 2025 - Insee Résultats (notes moyennes de satisfaction, France métropolitaine)"
    url: "https://www.insee.fr/fr/statistiques/9051795?sommaire=9051904"
    auteurs: []
    date_publication: "2026-09-29"
    consulte_le: "2026-10-13"
    note: "Fichier https://www.insee.fr/fr/statistiques/fichier/9051795/srcv_satisfaction_fm.xlsx (créé le 28/09/2026), onglets « sexe » (total), « niveau de vie » (déciles) et « emploi » (statut déclaré). Source : SRCV-Silc 2010 à 2025 ; champ : 16 ans ou plus, France métropolitaine. Synthèse « La confiance envers autrui diminue en 2025 » (https://www.insee.fr/fr/statistiques/9051895?sommaire=9051904) : note moyenne 7,2 début 2025, 6,5 pour les 10 % les moins aisés, 7,9 pour les 10 % les plus aisés."

  - id: be-insee-ip2117-inegalites
    type: statistique_publique
    editeur: "Insee"
    titre: "Niveau de vie et pauvreté en 2024 - Insee Première n° 2117 (figure 2, indicateurs d'inégalités de 1996 à 2024)"
    url: "https://www.insee.fr/fr/statistiques/9019316"
    auteurs: []
    date_publication: "2026-07-09"
    consulte_le: "2026-10-13"
    note: "Fichier https://www.insee.fr/fr/statistiques/fichier/9019316/ip2117.xlsx, figure 2 : ratio (100-S80)/S20 rétropolé, 4,62 en 2024, 4,53 en 2023 ; avant redistribution 8,37 en 2024. Champ : France métropolitaine (ERFS). Même publication que l'id insee-ip2117-niveau-vie-pauvrete-2024 du registre population."

  - id: be-insee-focus-380-privation
    type: statistique_publique
    editeur: "Insee"
    titre: "Privation matérielle et sociale en 2025 - Insee Focus n° 380"
    url: "https://www.insee.fr/fr/statistiques/8967255"
    auteurs: ["François Gleizes", "Julie Solard"]
    date_publication: "2026-04-15"
    consulte_le: "2026-10-13"
    note: "Figure 1 : taux de privation matérielle et sociale 2013-2025, France métropolitaine (11,7 ; 12,9 ; 11,8 ; 12,1 ; 11,4 ; 11,9 ; 12,4 ; 12,3 ; 10,5 ; 12,9 ; 13,1 ; 12,7 ; 13,1) et France hors Mayotte 2022-2025 (13,4 ; 13,6 ; 13,0 ; 13,5). Début 2025 : 9,0 millions de personnes ; données 2025 provisoires. Fichier : https://www.insee.fr/fr/statistiques/fichier/8967255/IF380.xlsx."

  # ---------------------------------------------------------------------------
  # SANTÉ ET VIE
  # ---------------------------------------------------------------------------
  - id: be-spf-beh-2021-pollution-mortalite
    type: rapport_institutionnel
    editeur: "Santé publique France - Bulletin épidémiologique hebdomadaire n° 13"
    titre: "Impact de la pollution de l'air ambiant sur la mortalité en France métropolitaine : réduction en lien avec le confinement du printemps 2020 et nouvelles données sur le poids total pour la période 2016-2019"
    url: "https://beh.santepubliquefrance.fr/beh/2021/13/2021_13_2.html"
    auteurs: ["Lucie Adélaïde", "Sylvia Medina", "Vérène Wagner", "Perrine de Crouy-Chanel", "Elsa Real", "Augustin Colette", "Florian Couvidat", "Bertrand Bessagnet", "Maxime Alter", "Amélie Durou", "Sabine Host", "Marion Hulin", "Magali Corso", "Mathilde Pascal"]
    date_publication: "2021-09-07"
    consulte_le: "2026-10-13"
    note: "Évaluation quantitative d'impact sur la santé (EQIS), 30 ans ou plus, exposition à long terme, 2016-2019 : 39 541 décès/an attribuables aux PM2,5 [IC 95 % 14 160 ; 61 690], 7 % de la mortalité, 7,6 mois d'espérance de vie ; 6 790 décès/an pour le NO2 [2 400 ; 10 763], 1 %, 1,6 mois. Rappel de l'estimation publiée en 2016 : 48 000 décès/an attribuables aux PM2,5 pour 2007-2008 (scénarios et risques relatifs identiques)."

  - id: be-spf-actu-2025-pollution
    type: rapport_institutionnel
    editeur: "Santé publique France"
    titre: "La pollution de l'air : des progrès pour notre santé nécessaires et possibles"
    url: "https://www.santepubliquefrance.fr/les-actualites/la-pollution-de-lair-des-progres-pour-notre-sante-necessaires-et-possibles"
    auteurs: []
    date_publication: "2025-10-13"
    consulte_le: "2026-10-13"
    note: "Actualité confirmant que « près de 40 000 décès » attribuables chaque année aux PM2,5 (30 ans ou plus) reste le chiffre de référence de l'agence en octobre 2025."

  - id: be-insee-odd3-suicide
    type: statistique_publique
    editeur: "Insee (données CépiDc-Inserm)"
    titre: "Indicateurs pour le suivi national des objectifs de développement durable - Objectif n° 3 Santé et bien-être : décès pour cause de suicide"
    url: "https://www.insee.fr/fr/statistiques/2654944?sommaire=2654964"
    auteurs: []
    date_publication: "2026-05-27"
    consulte_le: "2026-10-13"
    note: "Taux standardisés de décès par suicide pour 100 000 habitants (ensemble / femmes / hommes) : 2018 14,1 / 6,3 / 22,0 ; 2019 13,9 / 6,1 / 21,7 ; 2020 14,1 / 6,4 / 21,8 ; 2021 13,9 / 6,2 / 21,7 ; 2022 14,2 / 6,4 / 22,1 ; 2023 13,0 / 6,1 / 21,0. Champ : France ; source : CépiDc-Inserm, certificats de décès."

  - id: be-eurostat-suicides-nombre
    type: statistique_publique
    editeur: "Eurostat"
    titre: "Causes de décès - nombres absolus par pays de résidence et d'occurrence (hlth_cd_aro) : suicides, France"
    url: "https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data/hlth_cd_aro?geo=FR&icd10=X60-X84_Y870&sex=T&age=TOTAL&resid=TOT_IN&lang=fr"
    auteurs: []
    date_publication: "2026-09-24"
    consulte_le: "2026-10-13"
    note: "Date = mise à jour du jeu de données. Tous les décès déclarés en France, CIM-10 X60-X84 et Y87.0, sexes réunis : 9 145 (2015) … 8 905 (2023), 8 784 (2024). Le taux standardisé Eurostat (hlth_cd_asdr2, standard européen) vaut 13,0 pour 100 000 en 2023."

  # ---------------------------------------------------------------------------
  # SÉCURITÉ RESSENTIE
  # ---------------------------------------------------------------------------
  - id: be-insee-cc-insecurite-vrs-2024
    type: statistique_publique
    editeur: "Insee (données SSMSI)"
    titre: "Sentiment d'insécurité selon l'âge et le sexe - Données annuelles de 2022 à 2024 - Chiffres-clés"
    url: "https://www.insee.fr/fr/statistiques/2526402"
    auteurs: []
    date_publication: "2025-12-19"
    consulte_le: "2026-10-13"
    note: "Fichier https://www.insee.fr/fr/statistiques/fichier/2526402/cond-sec-just-insecur.xlsx : part des personnes éprouvant souvent ou de temps en temps un sentiment d'insécurité au domicile (figure 1), dans le quartier ou le village (figure 2), renonçant à sortir seules pour des raisons de sécurité (figure 3), par sexe et tranche d'âge. Source : SSMSI, enquêtes Vécu et ressenti en matière de sécurité (VRS) 2022 à 2024. Champ : France métropolitaine, Guadeloupe, Martinique, La Réunion, 18 ans ou plus. Pas de total tous âges publié dans ce fichier."

  # ---------------------------------------------------------------------------
  # OCDE - COMMENT VA LA VIE ?
  # ---------------------------------------------------------------------------
  - id: be-ocde-hows-life-2026
    type: rapport_institutionnel
    editeur: "OCDE"
    titre: "How's Life? Well-being Database - Current well-being (DSD_HSL@DF_HSL_CWB, version 1.1), France"
    url: "https://sdmx.oecd.org/public/rest/data/OECD.WISE.WDP,DSD_HSL@DF_HSL_CWB,1.1/FRA.........?format=csvfilewithlabels"
    auteurs: []
    date_publication: ""
    consulte_le: "2026-10-13"
    note: "Extraction CSV du 13/10/2026 (copie dans system/cache/bien-etre/oecd_hsl_cwb_FRA.csv). Mesures utilisées (total sexes, âges, diplômes) : 2_7 Long hours in paid work (5,89 % en 2025) ; 10_2_DEP Not feeling safe at night (26,30 % sur 2023-2025) ; 7_1_DEP Lack of social support (12,24 %) ; 7_4 Feeling lonely (7,14 % en 2018, 10,77 % en 2022) ; 1_5 Difficulty making ends meet (21,7 % en 2025, ruptures 2020 et 2022). Définitions : id be-ocde-hows-life-definitions-2026."

  - id: be-ocde-hows-life-definitions-2026
    type: rapport_institutionnel
    editeur: "OCDE"
    titre: "OECD How's Life? Well-being Database: Definitions and Metadata"
    url: "https://www.oecd.org/content/dam/oecd/en/topics/policy-sub-issues/measuring-well-being-and-progress/oecd-well-being-database-definitions.pdf"
    auteurs: []
    date_publication: "2026-06-01"
    consulte_le: "2026-10-13"
    note: "« Latest updated: June 2026 » (date approchée au 1er du mois). Horaires très longs : salariés de 15 ans ou plus travaillant habituellement 50 heures ou plus par semaine (source OECD Labour Force Statistics) ; soutien social et sentiment de sécurité la nuit : Gallup World Poll, environ 1 000 personnes par an, moyennes sur 3 ans ; solitude : EU-SILC, personnes se sentant seules tout le temps ou la plupart du temps au cours des 4 dernières semaines."
