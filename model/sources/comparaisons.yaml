# Séries longues et comparaisons européennes pour « Les grandes questions » (la dette « explose » ? les retraites « coûtent
# trop cher » ?) : Insee, Eurostat. Relues par l'agent de recherche le 2026-10-31.
sources:
  - id: insee-dette-apu-2830192
    type: statistique_publique
    editeur: "Insee"
    titre: "Dette des administrations publiques au sens de Maastricht par sous-secteur"
    url: "https://www.insee.fr/fr/statistiques/2830192"
    auteurs: []
    date_publication: "2026-08-28"
    consulte_le: "2026-10-31"
    note: "Fichier https://www.insee.fr/fr/statistiques/fichier/2830192/econ-fin-pub-dette-adm-pub.xlsx, onglet « Figure 2 », 1978-2025, comptes nationaux base 2020 (mêmes valeurs que les chiffres-clés pour 2019 : 98,2 % et 2025 : 115,7 %). Dette en % du PIB au 31 décembre : 21,3 % (1980), 36,8 % (1990), 59,7 % (2000), 65,5 % (2007)."
  - id: eurostat-gov-10a-main
    type: statistique_publique
    editeur: "Eurostat"
    titre: "Principaux agrégats des administrations publiques (gov_10a_main) — intérêts payés (D41PAY), administrations publiques (S13)"
    url: "https://ec.europa.eu/eurostat/databrowser/view/gov_10a_main/default/table?lang=fr"
    auteurs: []
    date_publication: "2026-10-21"
    consulte_le: "2026-10-31"
    note: "France, intérêts payés par l'ensemble des administrations publiques, en % du PIB : 3,6 % (1996, 45,5 Md€), 3,0 % (2000, 43,6 Md€), 2,7 % (2007, 52,1 Md€), 1,5 % (2019, 36,9 Md€), 2,2 % (2025, 65,7 Md€). Eurostat compte la correction Sifim, l'Insee non (64,7 Md€ en 2025) : environ 1 Md€ d'écart."
  - id: eurostat-tps00103
    type: statistique_publique
    editeur: "Eurostat"
    titre: "Dépenses de pension en pourcentage du PIB (tps00103)"
    url: "https://ec.europa.eu/eurostat/databrowser/view/tps00103/default/table?lang=fr"
    auteurs: []
    date_publication: "2026-10-26"
    consulte_le: "2026-10-31"
    note: "Année 2024. France 14,98 % ; Union européenne à 27 : 12,57 % (provisoire) ; Italie 15,85 % ; Espagne 13,19 % ; Allemagne 11,67 % (provisoire). Champ large, harmonisé entre pays : retraites, mais aussi pensions d'invalidité et préretraites (d'où 15 % pour la France contre 14,1 % au COR)."
  - id: eurostat-gov-10a-taxag
    type: statistique_publique
    editeur: "Eurostat"
    titre: "Principaux agrégats fiscaux des administrations publiques (gov_10a_taxag) — impôts et cotisations sociales en % du PIB"
    url: "https://ec.europa.eu/eurostat/databrowser/view/gov_10a_taxag/default/table?lang=fr"
    auteurs: []
    date_publication: "2026-10-28"
    consulte_le: "2026-10-31"
    note: "Indicateur D2_D5_D91_D61_M_D995 (impôts et cotisations sociales, y compris cotisations imputées, nets des montants non recouvrables), secteur S13_S212 (administrations publiques et institutions de l'UE), en % du PIB. 2025 (2024) : France 46,0 % (45,1) ; UE-27 40,7 (40,2) ; Allemagne 41,4 (40,3) ; Italie 43,0 (42,3) ; Espagne 38,1 (37,2) ; Belgique 44,7 (45,2) ; Danemark 45,1 (45,5) ; Suède 41,2 (41,8). France 1re des 27 en 2025, 3e en 2024. L'Insee, qui ne compte pas les cotisations imputées et déduit les crédits d'impôt, donne 43,6 % pour 2025."
  - id: eurostat-gov-10a-main-te
    type: statistique_publique
    editeur: "Eurostat"
    titre: "Principaux agrégats des administrations publiques (gov_10a_main) — dépenses publiques totales (TE) en % du PIB"
    url: "https://ec.europa.eu/eurostat/databrowser/view/gov_10a_main/default/table?lang=fr"
    auteurs: []
    date_publication: "2026-10-21"
    consulte_le: "2026-10-31"
    note: "Dépenses totales des administrations publiques (TE, secteur S13), en % du PIB. 2025 (2024) : France 57,3 % (57,0) ; Finlande 57,5 (57,9) ; UE-27 49,4 (48,9) ; Allemagne 50,1 (49,0) ; Italie 51,1 (50,3) ; Espagne 45,3 (45,4) ; Belgique 54,4 (54,1) ; Danemark 47,2 (46,5) ; Suède 49,3 (50,0). France 2e des 27 en 2025 et 2024, derrière la Finlande ; 1re en 2023 (56,8 %)."
  - id: eurostat-une-rt-a
    type: statistique_publique
    editeur: "Eurostat"
    titre: "Chômage par sexe et par âge, moyennes annuelles (une_rt_a)"
    url: "https://ec.europa.eu/eurostat/databrowser/view/une_rt_a/default/table?lang=fr"
    auteurs: []
    date_publication: "2026-10-26"
    consulte_le: "2026-10-31"
    note: "Taux de chômage des 15-74 ans, en % de la population active (unit PC_ACT, age Y15-74, sex T). 2025 (2024) : France 7,7 (7,4), signalée « définition différente » ; UE-27 6,0 (6,0) ; Allemagne 3,8 (3,5) ; Italie 6,1 (6,5) ; Espagne 10,5 (11,4) ; Pays-Bas 3,9 (3,7) ; Suède 8,8 (8,4) ; Pologne 3,1 (2,9). France 5e des 27 en 2025 (1 = le plus élevé)."
  - id: eurostat-hlth-sha11-hf
    type: statistique_publique
    editeur: "Eurostat"
    titre: "Dépenses de santé par régime de financement (hlth_sha11_hf)"
    url: "https://ec.europa.eu/eurostat/databrowser/view/hlth_sha11_hf/default/table?lang=fr"
    auteurs: []
    date_publication: "2026-10-23"
    consulte_le: "2026-10-31"
    note: "Dépense courante de santé, tous financeurs (TOT_HF), en % du PIB. 2024 (2023) : France 11,33 (11,33) ; UE-27 10,16 (9,94) ; Allemagne 12,21 (11,64) ; Italie 8,46 (8,37) ; Espagne 9,25 (9,22) ; Pays-Bas 10,10 (10,04) ; Suède 11,16 (11,24) ; Pologne 7,84 (7,14). France 3e des 27 en 2024, derrière l'Allemagne et l'Autriche (11,71). 2025 encore partielle."
  - id: eurostat-gov-10a-exp-education
    type: statistique_publique
    editeur: "Eurostat"
    titre: "Dépenses des administrations publiques par fonction (gov_10a_exp) — enseignement (COFOG 09)"
    url: "https://ec.europa.eu/eurostat/databrowser/view/gov_10a_exp/default/table?lang=fr"
    auteurs: []
    date_publication: "2026-10-21"
    consulte_le: "2026-10-31"
    note: "Dépenses publiques d'enseignement (cofog99 GF09, TE, S13), en % du PIB : argent public seulement (pas les familles ni les entreprises). 2024 (2023) : France 5,1 provisoire (5,0) ; UE-27 4,7 (4,7) ; Allemagne 4,5 (4,5) ; Italie 4,0 (3,9) ; Espagne 4,1 (4,2) ; Pays-Bas 5,1 (5,1) ; Suède 7,2 (7,3) ; Pologne 5,6 (4,9). France 11e des 27 en 2024, ex aequo avec les Pays-Bas et la Slovaquie."
  - id: eurostat-sdg-13-10
    type: statistique_publique
    editeur: "Eurostat"
    titre: "Émissions de gaz à effet de serre (sdg_13_10), tonnes d'équivalent CO2 par habitant"
    url: "https://ec.europa.eu/eurostat/databrowser/view/sdg_13_10/default/table?lang=fr"
    auteurs: []
    date_publication: "2026-04-22"
    consulte_le: "2026-10-31"
    note: "Émissions sur le territoire, hors forêts et sols (UTCATF) et hors transports internationaux (src_crf TOTX4_MEMO, unit T_HAB). 2024 (2023) : France 5,3 (5,5) ; Allemagne 7,8 (8,0) ; Italie 6,2 (6,4) ; Espagne 5,5 (5,6) ; Pays-Bas 7,8 (8,0) ; Suède 4,5 (4,2) ; Pologne 9,3 (9,5). France 22e des 27 en 2024 (1 = le plus élevé). Pas de moyenne européenne publiée sur ce champ. Ne compte pas les émissions des produits importés (empreinte carbone)."
  - id: dgfip-stat-41-ir-2024
    type: statistique_publique
    editeur: "Direction générale des finances publiques (DGFiP)"
    titre: "L'impôt sur le revenu 2024 a été plus dynamique que les revenus (DGFiP Statistiques n° 41)"
    url: "https://www.impots.gouv.fr/sites/default/files/media/9_statistiques/0_etudes_et_stats/0_publications/dgfip_statistiques/2025/num41_11/dgfip_stat_41.pdf"
    auteurs: []
    date_publication: "2025-11-01"
    consulte_le: "2026-10-31"
    note: "Revenus 2024, données provisoires (fichier POTE). 19,6 millions de foyers sur 41,5 millions paient un impôt net (47 %) ; impôt net total 92 Md€. Le dernier dixième de revenu fiscal de référence par part paie « près des trois quarts de l'impôt sur le revenu » (74 % d'après le tableau 4 : impôt moyen de 16 395 € pour environ 4,15 millions de foyers)."
  - id: ipp-note-92-milliardaires
    type: rapport_institutionnel
    editeur: "Institut des politiques publiques (IPP)"
    titre: "Quels impôts les milliardaires paient-ils ? (Notes IPP n° 92, Bach, Bozio, Guillouzouic, Malgouyres)"
    url: "https://www.ipp.eu/actualites/quels-impots-les-milliardaires-paient-ils/"
    auteurs: ["Laurent Bach", "Antoine Bozio", "Arthur Guillouzouic", "Clément Malgouyres"]
    date_publication: "2023-06-07"
    consulte_le: "2026-10-31"
    note: "Données 2016, ménages les plus aisés seulement (à partir des 10 % du haut), hors TVA et impôts de production. Taux global d'imposition (impôts personnels et impôt sur les sociétés) rapporté au revenu économique : 46 % pour les 0,1 % les plus riches, 26 % pour les 0,0002 % (75 foyers milliardaires), dont une grande part des revenus reste dans leurs sociétés. Note : https://www.ipp.eu/wp-content/uploads/2023/06/Note_IPP_Billionaires-version-actualisee.pdf"
  - id: insee-patrimoine-brut-2024
    type: statistique_publique
    editeur: "Insee"
    titre: "Répartition de la masse totale de patrimoine brut entre les ménages"
    url: "https://www.insee.fr/fr/statistiques/2502915"
    auteurs: []
    date_publication: "2026-04-07"
    consulte_le: "2026-10-31"
    note: "Début 2024. Les 10 % de ménages les mieux dotés détiennent 47,9 % du patrimoine brut (avant déduction des dettes), les 1 % 15,4 %, les 50 % les mieux dotés 92,8 % (donc 7,2 % pour la moitié la moins dotée). Voir aussi Insee Focus n° 371 (9 décembre 2025) : « la moitié la mieux dotée possède 93 % » ; Gini du patrimoine brut 0,652."
  - id: eurostat-ilc-di12
    type: statistique_publique
    editeur: "Eurostat"
    titre: "Coefficient de Gini du revenu disponible équivalent (ilc_di12)"
    url: "https://ec.europa.eu/eurostat/databrowser/view/ilc_di12/default/table?lang=fr"
    auteurs: []
    date_publication: "2026-10-20"
    consulte_le: "2026-10-31"
    note: "Échelle 0-100, enquête 2025 (revenus 2024). France 30,4 ; UE-27 29,2 ; Allemagne 30,1 ; Italie 31,0 ; Espagne 30,8 ; Suède 28,6 ; Pologne 24,9. France 11e des 27 (1 = le plus inégal ; Bulgarie 37,7). L'Insee, sur la France métropolitaine et sa propre enquête, donne 0,302 pour les mêmes revenus."
