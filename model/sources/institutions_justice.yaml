- id: lemondedudroit-viol-application-temps-2026
  type: presse
  editeur: Le Monde du Droit
  titre: 'Viol et agressions sexuelles : application dans le temps de la loi de 2025'
  url: https://www.lemondedudroit.fr/judiciaire/326-droit-penal/104958-viol-et-agressions-sexuelles-application-dans-le-temps-de-la-loi-de-2025.html
  auteurs: []
  date_publication: '2026-07-02'
  consulte_le: '2026-10-13'
  note: 'Rend compte de Cass. crim., 1er juillet 2026, n° 26-82.275 : la loi n° 2025-1057 du 6 novembre 2025 (définition fondée sur le non-consentement) ne s''applique qu''aux faits commis à partir du 8
    novembre 2025.'
- id: banquedesterritoires-homicide-routier-2025
  type: presse
  editeur: Banque des Territoires (Caisse des Dépôts) – Localtis
  titre: 'Création de l''homicide routier : la loi entre en vigueur'
  url: https://www.banquedesterritoires.fr/creation-de-lhomicide-routier-la-loi-entre-en-vigueur
  auteurs:
  - Philie Marcangelo-Leos
  date_publication: '2025-07-15'
  consulte_le: '2026-10-13'
  note: 'Référence : loi n° 2025-622 du 9 juillet 2025 créant l''homicide routier, JO du 10 juillet 2025. Quantums maintenus (7 ans / 100 000 €), 10 ans / 150 000 € en cas de pluralité de circonstances.'
