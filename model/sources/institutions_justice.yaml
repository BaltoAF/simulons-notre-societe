- id: justice-circulaire-afd-vol-2023
  type: texte_officiel
  editeur: Ministère de la Justice (DACG)
  titre: Circulaire relative à la verbalisation du vol et de la vente à la sauvette par amende forfaitaire (JUSD2318687C)
  url: https://www.justice.gouv.fr/sites/default/files/2023-07/JUSD2318687C.pdf
  auteurs: []
  date_publication: '2023-07-06'
  consulte_le: '2026-10-13'
  note: Généralisation de l'AFD vol (chose ≤ 300 €) sur tout le territoire à compter du 11 juillet 2023, après expérimentation à compter du 1er mars 2023.
- id: justice-circulaire-afd-vol-2023-annexe
  type: texte_officiel
  editeur: Ministère de la Justice (DACG)
  titre: AFD vol d'une chose dont la valeur n'excède pas 300 euros et vente à la sauvette – Doctrine d'emploi (annexe JUSD2318687C)
  url: https://www.justice.gouv.fr/sites/default/files/2023-07/JUSD2318687C-annexe.pdf
  auteurs: []
  date_publication: '2023-07-05'
  consulte_le: '2026-10-13'
  note: 'Cite l''art. 311-3 (vol : 3 ans et 45 000 €) et l''art. 311-3-1 (AFD de 300 €, minorée 250 €, majorée 600 €, chose ≤ 300 €).'
