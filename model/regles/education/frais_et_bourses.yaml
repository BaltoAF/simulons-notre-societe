domaine: education
theme: "Frais d'inscription universitaires et bourses"
regles:
  # ---------------------------------------------------------------------------
  # DROITS D'INSCRIPTION (établissements publics, année universitaire 2026-2027)
  # ---------------------------------------------------------------------------
  - id: education.universite.droits_inscription_licence
    titre: "Université publique : droits d'inscription annuels en licence (taux normal)"
    explication: "Montant payé chaque année par un étudiant inscrit en licence (ou licence professionnelle) dans une université publique, hors boursiers qui en sont exonérés."
    type: nombre
    unite: euros
    bornes: [0, 5000]
    valeurs:
      - depuis: "2026-09-01"
        valeur: 178
        sources: [sp-f36520-droits-inscription, sp-actu-a17481-frais-universite-2026]
        article: "Arrêté du 19 avril 2019 relatif aux droits d'inscription dans les établissements publics d'enseignement supérieur"
    tags: [enseignement_superieur, frais, universite]
    a_verifier: false
    note: "Montant pour l'année universitaire 2026-2027. Taux réduit : 118 €. Montants indexés chaque année sur l'indice des prix hors tabac (service-public)."

  - id: education.universite.droits_inscription_master
    titre: "Université publique : droits d'inscription annuels en master (taux normal)"
    explication: "Montant payé chaque année par un étudiant inscrit en master dans une université publique (hors boursiers)."
    type: nombre
    unite: euros
    bornes: [0, 6000]
    valeurs:
      - depuis: "2026-09-01"
        valeur: 255
        sources: [sp-f36520-droits-inscription, sp-actu-a17481-frais-universite-2026]
        article: "Arrêté du 19 avril 2019"
    tags: [enseignement_superieur, frais, universite]
    a_verifier: false
    note: "Année universitaire 2026-2027. Taux réduit : 167 €."

  - id: education.universite.droits_inscription_doctorat
    titre: "Université publique : droits d'inscription annuels en doctorat (taux normal)"
    explication: "Montant annuel pour une inscription en doctorat ou en habilitation à diriger des recherches. Il est identique pour les étudiants étrangers."
    type: nombre
    unite: euros
    bornes: [0, 6000]
    valeurs:
      - depuis: "2026-09-01"
        valeur: 398
        sources: [sp-f36520-droits-inscription, sp-actu-a17481-frais-universite-2026]
        article: "Arrêté du 19 avril 2019"
    tags: [enseignement_superieur, frais, universite, recherche]
    a_verifier: false
    note: "Année universitaire 2026-2027. Taux réduit : 265 €."

  - id: education.universite.cvec
    titre: "Contribution de vie étudiante et de campus (CVEC)"
    explication: "Contribution annuelle due par les étudiants en formation initiale, qui finance la vie de campus (santé, culture, sport). Les boursiers en sont exonérés."
    type: nombre
    unite: euros
    bornes: [0, 300]
    valeurs:
      - depuis: "2026-09-01"
        valeur: 105
        sources: [sp-f36520-droits-inscription, sp-actu-a17481-frais-universite-2026]
    tags: [enseignement_superieur, frais, vie_etudiante]
    a_verifier: false
    note: "Montant pour la rentrée 2026-2027."

  - id: education.universite.droits_differencies_licence_extra_europeens
    titre: "Étudiants extra-européens : droits d'inscription annuels en licence"
    explication: "Montant des droits « différenciés » applicables aux étudiants non ressortissants de l'Union européenne ou de l'Espace économique européen inscrits en licence, sauf exonération par l'université."
    type: nombre
    unite: euros
    bornes: [0, 20000]
    valeurs:
      - depuis: "2026-09-01"
        valeur: 2902
        sources: [sp-actu-a18927-droits-differencies, sp-actu-a17481-frais-universite-2026]
        article: "Arrêté du 19 avril 2019 relatif aux droits d'inscription (droits différenciés)"
    tags: [enseignement_superieur, frais, etudiants_etrangers]
    a_verifier: false
    note: "Année 2026-2027 ; taux réduit 1 934 €. Les universités peuvent exonérer une partie de ces étudiants (plafond d'exonération : voir règle dédiée)."

  - id: education.universite.droits_differencies_master_extra_europeens
    titre: "Étudiants extra-européens : droits d'inscription annuels en master"
    explication: "Montant des droits différenciés applicables aux étudiants extra-européens inscrits en master, sauf exonération."
    type: nombre
    unite: euros
    bornes: [0, 25000]
    valeurs:
      - depuis: "2026-09-01"
        valeur: 3950
        sources: [sp-actu-a18927-droits-differencies, sp-actu-a17481-frais-universite-2026]
        article: "Arrêté du 19 avril 2019 relatif aux droits d'inscription (droits différenciés)"
    tags: [enseignement_superieur, frais, etudiants_etrangers]
    a_verifier: false
    note: "Année 2026-2027 ; taux réduit 2 633 €."

  - id: education.universite.droits_differencies_applicables_doctorat
    titre: "Étudiants extra-européens : droits différenciés appliqués au doctorat"
    explication: "Indique si les doctorants extra-européens paient des droits majorés. Ce n'est pas le cas : ils paient le tarif national du doctorat."
    type: booleen
    unite: ""
    valeurs:
      - depuis: "2026-09-01"
        valeur: false
        sources: [sp-actu-a17481-frais-universite-2026]
    tags: [enseignement_superieur, frais, etudiants_etrangers, recherche]
    a_verifier: false
    note: "« Les droits d'inscriptions différenciés ne s'appliquent pas aux doctorats » (service-public, 21/08/2026). Date de début de la règle non vérifiée : la date indiquée est la rentrée 2026."

  - id: education.universite.plafond_exoneration_etudiants_etrangers
    titre: "Part maximale d'étudiants étrangers qu'une université peut exonérer des droits différenciés"
    explication: "Les universités ne peuvent plus exonérer librement les étudiants extra-européens : la part exonérée est plafonnée, avec une trajectoire de baisse."
    type: nombre
    unite: pourcent
    bornes: [0, 100]
    valeurs:
      - depuis: "2026-05-21"
        valeur: 30
        sources: [sp-actu-a18927-droits-differencies]
        article: "Décret n° 2026-385 du 19 mai 2026 (entrée en vigueur le 21 mai 2026)"
    tags: [enseignement_superieur, frais, etudiants_etrangers, reforme_2026]
    a_verifier: false
    note: "30 % pour 2026-2027, puis 25 % en 2027-2028 et 20 % à terme (service-public). Certains étudiants (accords avec un établissement étranger) sont hors plafond."

