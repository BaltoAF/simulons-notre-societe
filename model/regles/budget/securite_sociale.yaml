    explication: "Plafond de dépenses voté pour l'assurance maladie, maternité, invalidité et décès en 2026."
    type: nombre
    unite: milliards_euros
    bornes: [0, 400]
    valeurs:
      - depuis: "2026-01-01"
        valeur: 271.4
        sources: [jo-loi-2025-1403-lfss-2026, an-ta199-lfss-2026, an-plfss-2027-n3211]
        article: "Loi n° 2025-1403 du 30 décembre 2025, art. 108"
    tags: [budget, securite_sociale, maladie]
    a_verifier: false
    note: "Le tableau d'équilibre de l'article 47 de la même loi indique 271,3 Md€ de dépenses pour la branche maladie (écart d'arrondi entre deux articles de la loi). Le PLFSS 2027 propose de rectifier les dépenses 2026 à 271,0 Md€ et prévoit 277,1 Md€ en 2027."
