# Budget de la Sécurité sociale — loi de financement de la sécurité sociale (LFSS) pour 2026.
# Loi n° 2025-1403 du 30 décembre 2025 (JO du 31 décembre 2025), après la décision n° 2025-899 DC
# du 30 décembre 2025 (censure partielle, sans effet sur les articles d'équilibre, l'ONDAM et les objectifs de dépenses).
# Champ : ensemble des régimes obligatoires de base de sécurité sociale (ROBSS). Unité : milliards d'euros.
# Les rectifications proposées par le PLFSS 2027 (projet n° 3211 déposé le 1er octobre 2026, non voté) sont indiquées en note.
domaine: budget
theme: "Sécurité sociale (LFSS 2026)"
