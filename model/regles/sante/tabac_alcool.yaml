  - id: sante.alcool.accise_bieres
    titre: "Accise sur les bières de plus de 2,8 % (par hectolitre et par degré)"
    explication: "La taxe sur la bière dépend de son degré : 8,24 € par hectolitre et par degré d'alcool en 2026. Pour une bière à 5 %, cela fait environ 41 € par hectolitre, soit environ 10 centimes par demi (25 cl)."
    type: nombre
    unite: euros_par_hectolitre_degre
    bornes: [0, 50]
    valeurs:
      - depuis: "2025-01-01"
        valeur: 8.10
        sources: [rc-douane-droits-alcools]
      - depuis: "2026-01-01"
        valeur: 8.24
        sources: [rc-douane-droits-alcools, rc-douane-da-25-060]
    tags: [alcool, fiscalite, accise, biere]
    a_verifier: false
    note: "Bières de 2,8 % vol. ou moins et petites brasseries (200 000 hl/an ou moins) : 4,12 €/hl/degré en 2026 (4,05 € en 2025). Les exemples chiffrés de l'explication sont des calculs (8,24 × 5 = 41,2 €/hl)."

  - id: sante.alcool.accise_produits_intermediaires
    titre: "Accise sur les produits intermédiaires (porto, vermouth… par hectolitre)"
    explication: "Les « produits intermédiaires » (vins doux, apéritifs à base de vin comme le porto ou le vermouth) sont taxés 209,53 € par hectolitre en 2026 ; les vins doux naturels et vins de liqueur d'appellation bénéficient d'un tarif réduit de 52,39 €."
    type: nombre
    unite: euros_par_hectolitre
    bornes: [0, 1000]
    valeurs:
      - depuis: "2025-01-01"
        valeur: 205.93
        sources: [rc-douane-droits-alcools]
      - depuis: "2026-01-01"
        valeur: 209.53
        sources: [rc-douane-droits-alcools, rc-douane-da-25-060]
    tags: [alcool, fiscalite, accise, produits_intermediaires]
    a_verifier: false
    note: "Tarif réduit VDN/VDL AOP : 52,39 €/hl en 2026 ; le montant 2025 lu sur la page (50,6 €/hl) est incohérent avec la hausse plafonnée à 1,75 % et n'est pas repris."

  - id: sante.alcool.accise_alcools_forts
    titre: "Accise sur les alcools forts (par hectolitre d'alcool pur)"
    explication: "Les spiritueux (whisky, vodka, rhum, pastis…) sont taxés 1 932,42 € par hectolitre d'alcool pur en 2026, soit environ 5,40 € pour une bouteille de 70 cl à 40 %. S'y ajoute la cotisation sécurité sociale."
    type: nombre
    unite: euros_par_hectolitre_alcool_pur
    bornes: [0, 5000]
    valeurs:
      - depuis: "2025-01-01"
        valeur: 1899.18
        sources: [rc-douane-droits-alcools]
      - depuis: "2026-01-01"
        valeur: 1932.42
        sources: [rc-douane-droits-alcools, rc-douane-da-25-060]
    tags: [alcool, fiscalite, accise, spiritueux]
    a_verifier: false
    note: "Rhums des départements d'outre-mer : 966,75 €/hlap en 2026 (950,12 € en 2025). L'exemple par bouteille est un calcul (0,7 l × 40 % = 0,28 l d'alcool pur × 19,3242 €/l)."

  - id: sante.alcool.cotisation_securite_sociale_plus_18_degres
    titre: "Cotisation sécurité sociale sur les boissons de plus de 18 % (par hectolitre d'alcool pur)"
    explication: "Les boissons titrant plus de 18 % d'alcool paient en plus une cotisation au profit de la Sécurité sociale : 620,47 € par hectolitre d'alcool pur en 2026, soit environ 1,74 € pour une bouteille de 70 cl à 40 %."
    type: nombre
    unite: euros_par_hectolitre_alcool_pur
    bornes: [0, 3000]
    valeurs:
      - depuis: "2025-01-01"
        valeur: 609.80
        sources: [rc-douane-droits-alcools]
      - depuis: "2026-01-01"
        valeur: 620.47
        sources: [rc-douane-droits-alcools, rc-douane-da-25-060]
        article: "Code de la sécurité sociale, art. L245-9"
    tags: [alcool, fiscalite, securite_sociale, spiritueux]
    a_verifier: false
    note: "Taux plein, applicable aussi aux rhums des DOM (le taux réduit de la cotisation sur les rhums et alcools du cru a été supprimé le 1er janvier 2025). Produits intermédiaires et bières de plus de 18 % : 52,39 €/hl en 2026 (51,49 € en 2025) ; VDN/VDL AOP : 20,97 €/hl (20,61 €). L'exemple par bouteille est un calcul."

  - id: sante.alcool.taxe_premix_autres
    titre: "Taxe « prémix » sur les boissons sucrées alcoolisées (par décilitre d'alcool pur)"
    explication: "Les mélanges sucrés à base d'alcool fort (« prémix ») paient une taxe supplémentaire de 11 € par décilitre d'alcool pur (3 € pour ceux à base de vin ou d'autres boissons fermentées), pour décourager leur consommation par les jeunes."
    type: nombre
    unite: euros_par_decilitre_alcool_pur
    bornes: [0, 50]
