domaine: sante
theme: "Vaccinations obligatoires et congés liés à la naissance"
regles:
  - id: sante.vaccination.nombre_vaccinations_obligatoires_nourrissons
    titre: "Nombre de vaccinations obligatoires pour les nourrissons"
    explication: "Nombre de maladies contre lesquelles la vaccination des jeunes enfants est obligatoire (condition d'entrée en crèche et à l'école, sauf contre-indication médicale)."
    type: nombre
    unite: vaccinations
    bornes: [0, 20]
    valeurs:
      - depuis: "2018-01-01"
        valeur: 11
        sources: [ameli-vaccins-obligatoires, sp-f724-vaccinations]
        article: "Code de la santé publique, art. L3111-1 à L3111-11 (vaccinations obligatoires)"
      - depuis: "2025-01-01"
        valeur: 12
        sources: [ameli-vaccins-obligatoires, sp-f724-vaccinations]
        article: "Code de la santé publique, art. L3111-1 à L3111-11 (vaccinations obligatoires)"
    tags: [vaccination, prevention, enfants]
    a_verifier: true
    note: "Ameli (21/05/2026) : « Jusqu'à fin 2024, 11 vaccins étaient obligatoires » ; depuis 2025, la vaccination contre les méningocoques ACWY remplace celle contre le méningocoque C et celle contre le méningocoque B devient obligatoire. Le total de 12 est un décompte déduit (diphtérie, tétanos, poliomyélite, coqueluche, Haemophilus influenzae b, hépatite B, pneumocoque, rougeole, oreillons, rubéole, méningocoques ACWY, méningocoque B), non affiché tel quel par une source officielle. La date de 2018 pour le passage à 11 n'a pas été lue sur une source officielle (convention)."

  - id: sante.conge_maternite.duree_1er_2e_enfant
    titre: "Congé maternité : durée pour un 1er ou 2e enfant"
    explication: "Durée totale du congé maternité d'une salariée attendant un 1er ou 2e enfant : 6 semaines avant l'accouchement et 10 semaines après."
    type: nombre
    unite: semaines
    bornes: [8, 52]
    valeurs:
