    note: "Date « depuis » = date de vérification de la fiche service-public."

  - id: sante.conge_supplementaire_naissance.duree_max_par_parent
    titre: "Congé supplémentaire de naissance : durée maximale par parent"
    explication: "Nouveau congé indemnisé, cumulable avec les congés maternité et paternité : chaque parent peut prendre 1 ou 2 mois, en une fois ou en deux périodes d'un mois, dans les 9 mois suivant la naissance."
    type: nombre
    unite: mois
    bornes: [0, 12]
    valeurs:
      - depuis: "2026-07-01"
        valeur: 2
        sources: [ameli-conge-supplementaire-naissance, bdt-localtis-lfss-2026]
        article: "Loi n° 2025-1403 du 30 décembre 2025 de financement de la sécurité sociale pour 2026"
    tags: [conge, naissance, famille, reforme_2026]
    a_verifier: false
    note: "Effectif depuis le 1er juillet 2026, pour les enfants nés ou arrivés au foyer à partir du 1er janvier 2026 (ameli). Avant : congé inexistant."

