    tags: [conge, naissance, maternite, famille]
    a_verifier: false
    note: "Date « depuis » = date de vérification de la fiche service-public (01/06/2026) ; règle ancienne, date d'origine non vérifiée. Arrêt minimal obligatoire : 8 semaines dont 6 après l'accouchement."

