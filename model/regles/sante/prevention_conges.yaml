  - id: sante.conge_paternite.duree_totale
    titre: "Congé de paternité et d'accueil de l'enfant : durée totale (naissance unique)"
    explication: "Durée du congé de paternité et d'accueil de l'enfant du second parent (père ou conjoint de la mère) : 4 jours obligatoires pris juste après les 3 jours ouvrables de congé de naissance, puis 21 jours facultatifs."
    type: nombre
    unite: jours
    bornes: [0, 120]
    valeurs:
      - depuis: "2026-06-01"
        valeur: 25
        sources: [sp-f3156-conge-paternite]
        article: "Code du travail, art. L1225-35 et L1225-36"
    tags: [conge, naissance, paternite, famille]
    a_verifier: false
    note: "Service-public : 25 jours calendaires = 4 jours obligatoires + 21 jours facultatifs, auxquels s'ajoutent 3 jours ouvrables de congé de naissance. Partie facultative fractionnable en 2 périodes d'au moins 5 jours, à prendre dans les 6 mois. Date « depuis » = date de vérification de la fiche (01/06/2026) ; date d'entrée en vigueur non vérifiée."

