  # ---------------------------------------------------------------------------
  # PARTICIPATION FORFAITAIRE ET FRANCHISES MÉDICALES
  # ---------------------------------------------------------------------------
  - id: sante.participation_forfaitaire.montant
    titre: "Participation forfaitaire par consultation, acte médical, radiologie ou analyse"
    explication: "Somme laissée à la charge de l'assuré de plus de 18 ans à chaque consultation ou acte de médecin, examen de radiologie ou analyse de biologie. Elle est déduite des remboursements et non remboursable par les complémentaires « responsables »."
    type: nombre
    unite: euros
    bornes: [0, 10]
    valeurs:
      - depuis: "2026-09-29"
        valeur: 2
        sources: [ameli-participation-forfaitaire-2-euros, sp-actu-a17166-plafonds-franchises-2026]
        article: "Code de la sécurité sociale, art. L160-13"
    tags: [reste_a_charge, participation_forfaitaire]
    a_verifier: false
    note: "Date « depuis » = date de la page ameli (29/09/2026) ; la date de passage de 1 € à 2 € n'a pas été lue sur une source officielle. Exonérés : moins de 18 ans, bénéficiaires de la Complémentaire santé solidaire ou de l'AME, femmes enceintes du 6e mois au 12e jour après l'accouchement."

  - id: sante.participation_forfaitaire.plafond_journalier
    titre: "Participation forfaitaire : plafond journalier pour un même professionnel"
    explication: "Montant maximal de participations forfaitaires retenu en une journée pour un même professionnel de santé."
    type: nombre
    unite: euros
    bornes: [0, 20]
    valeurs:
      - depuis: "2026-09-29"
        valeur: 8
        sources: [ameli-participation-forfaitaire-2-euros]
    tags: [reste_a_charge, participation_forfaitaire]
    a_verifier: false
    note: "« dans la limite de 8 € par jour pour un même professionnel de santé » (ameli). Date « depuis » = date de la page."

  - id: sante.participation_forfaitaire.plafond_annuel
    titre: "Participation forfaitaire : plafond annuel par personne"
    explication: "Montant maximal de participations forfaitaires qu'un assuré peut payer sur une année civile."
    type: nombre
    unite: euros
    bornes: [0, 300]
    valeurs:
      - depuis: "2026-10-01"
        valeur: 70
        sources: [sp-actu-a17166-plafonds-franchises-2026, ameli-participation-forfaitaire-2-euros]
        article: "Décret n° 2026-858 du 11 septembre 2026 (JO du 12 septembre 2026)"
    tags: [reste_a_charge, participation_forfaitaire, reforme_2026]
    a_verifier: false
    note: "Relevé de 50 € à 70 € au 1er octobre 2026 (service-public, actualité du 16/09/2026). La valeur antérieure (50 €) n'est pas historisée faute de date de début vérifiée."

  - id: sante.franchise.medicament_par_boite
    titre: "Franchise médicale par boîte de médicament"
    explication: "Somme laissée à la charge de l'assuré pour chaque boîte (ou flacon) de médicament remboursé."
    type: nombre
    unite: euros
    bornes: [0, 5]
    valeurs:
      - depuis: "2026-09-29"
        valeur: 1
        sources: [ameli-franchise-medicale, sp-actu-a17166-plafonds-franchises-2026]
        article: "Code de la sécurité sociale, art. L160-13"
    tags: [reste_a_charge, franchise, medicaments]
    a_verifier: false
    note: "Date « depuis » = date de la page ameli ; la date d'entrée en vigueur du montant de 1 € n'a pas été lue sur une source officielle. Mêmes exonérations que la participation forfaitaire."

  - id: sante.franchise.acte_paramedical
    titre: "Franchise médicale par acte paramédical"
    explication: "Somme laissée à la charge de l'assuré pour chaque acte d'infirmier, de kinésithérapeute, etc."
    type: nombre
    unite: euros
    bornes: [0, 5]
    valeurs:
      - depuis: "2026-09-29"
        valeur: 1
        sources: [ameli-franchise-medicale, sp-actu-a17166-plafonds-franchises-2026]
    tags: [reste_a_charge, franchise, paramedical]
    a_verifier: false
    note: "Plafonnée à 4 € par jour. Date « depuis » = date de la page ameli."

  - id: sante.franchise.transport_sanitaire
    titre: "Franchise médicale par transport sanitaire"
    explication: "Somme laissée à la charge de l'assuré pour chaque transport sanitaire remboursé (ambulance, VSL, taxi conventionné)."
    type: nombre
    unite: euros
    bornes: [0, 20]
    valeurs:
      - depuis: "2026-09-29"
        valeur: 4
        sources: [ameli-franchise-medicale, sp-actu-a17166-plafonds-franchises-2026]
    tags: [reste_a_charge, franchise, transport]
    a_verifier: false
    note: "Plafonnée à 8 € par jour. Date « depuis » = date de la page ameli."

  - id: sante.franchise.plafond_annuel
    titre: "Franchises médicales : plafond annuel par personne"
    explication: "Montant maximal de franchises médicales qu'un assuré peut payer sur une année civile (médicaments, actes paramédicaux et transports confondus)."
    type: nombre
    unite: euros
    bornes: [0, 300]
    valeurs:
      - depuis: "2026-10-01"
        valeur: 70
        sources: [sp-actu-a17166-plafonds-franchises-2026, ameli-franchise-medicale]
        article: "Décret n° 2026-858 du 11 septembre 2026 (JO du 12 septembre 2026)"
    tags: [reste_a_charge, franchise, reforme_2026]
    a_verifier: false
    note: "Relevé de 50 € à 70 € au 1er octobre 2026. Montants unitaires inchangés."

  - id: sante.reste_a_charge.plafond_annuel_cumule_franchises_participations
    titre: "Plafond annuel cumulé des franchises et participations forfaitaires"
    explication: "Somme maximale qu'un assuré non exonéré peut payer en un an au titre des franchises médicales et des participations forfaitaires réunies."
    type: nombre
    unite: euros
    bornes: [0, 600]
    valeurs:
      - depuis: "2026-10-01"
        valeur: 140
        sources: [sp-actu-a17166-plafonds-franchises-2026]
        article: "Décret n° 2026-858 du 11 septembre 2026"
    tags: [reste_a_charge, franchise, participation_forfaitaire, reforme_2026]
    a_verifier: false
    note: "140 € contre 100 € auparavant (2 × 70 € au lieu de 2 × 50 €)."

  - id: sante.reste_a_charge.age_exoneration_franchises
    titre: "Âge en dessous duquel l'assuré est exonéré de franchises et de participations forfaitaires"
    explication: "Les enfants et jeunes de moins de cet âge ne paient ni franchise médicale ni participation forfaitaire."
    type: nombre
    unite: ans
    bornes: [0, 26]
    valeurs:
      - depuis: "2026-09-29"
        valeur: 18
        sources: [ameli-franchise-medicale, ameli-participation-forfaitaire-2-euros]
    tags: [reste_a_charge, exoneration, jeunes]
    a_verifier: false
    note: "Date « depuis » = date des pages ameli ; date d'origine non vérifiée."

  # ---------------------------------------------------------------------------
  # 100 % SANTÉ (OPTIQUE, AUDIOLOGIE)
  # ---------------------------------------------------------------------------
  - id: sante.cent_pour_cent_sante.aide_auditive_prix_limite
    titre: "100 % Santé : prix maximal d'une aide auditive de classe I (par oreille, 20 ans et plus)"
    explication: "Les aides auditives du panier « 100 % Santé » (classe I) sont vendues au plus à ce prix et remboursées intégralement par l'Assurance maladie et la complémentaire responsable."
    type: nombre
    unite: euros
    bornes: [0, 3000]
    valeurs:
      - depuis: "2026-02-20"
        valeur: 950
        sources: [ameli-protheses-auditives]
    tags: [cent_pour_cent_sante, audition, reste_a_charge]
    a_verifier: false
    note: "Date « depuis » = date de la page ameli (20/02/2026) ; date d'entrée en vigueur du plafond non vérifiée. Base de remboursement : 400 € par oreille, remboursée à 60 % par l'Assurance maladie ; renouvellement possible après 4 ans."

  - id: sante.cent_pour_cent_sante.monture_prix_limite
    titre: "100 % Santé : prix maximal d'une monture de lunettes sans reste à charge"
    explication: "Les montures du panier « 100 % Santé » (avec verres de classe A) ne laissent aucun reste à charge si leur prix ne dépasse pas ce montant."
    type: nombre
    unite: euros
    bornes: [0, 200]
    valeurs:
      - depuis: "2026-01-13"
        valeur: 30
        sources: [ameli-lunettes-lentilles]
    tags: [cent_pour_cent_sante, optique, reste_a_charge]
    a_verifier: false
    note: "Date « depuis » = date de la page ameli (13/01/2026) ; date d'entrée en vigueur non vérifiée. Renouvellement des lunettes tous les 2 ans à partir de 16 ans."

