    titre: "Délai minimal de renouvellement d'une aide auditive remboursée"
    explication: "Nombre d'années à respecter entre deux prises en charge d'un appareil auditif."
    type: nombre
    unite: ans
    bornes: [1, 10]
    valeurs:
      - depuis: "2026-02-20"
        valeur: 4
        sources: [ameli-protheses-auditives]
