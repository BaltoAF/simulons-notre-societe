    unite: ans
    bornes: [1, 5]
    valeurs:
      - depuis: "2026-01-13"
        valeur: 2
        sources: [ameli-lunettes-lentilles]
    tags: [optique]
    a_verifier: false
    note: "Date « depuis » = date de la page ameli."
