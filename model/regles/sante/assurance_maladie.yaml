domaine: sante
theme: "Assurance maladie : tarifs, taux de remboursement et restes à charge"
regles:
  # ---------------------------------------------------------------------------
  # TARIF DE CONSULTATION
  # ---------------------------------------------------------------------------
  - id: sante.consultation.generaliste_tarif
    titre: "Consultation chez un médecin généraliste (secteur 1) : tarif conventionnel"
    explication: "Prix d'une consultation de référence chez un médecin généraliste conventionné en secteur 1 (sans dépassement d'honoraires). C'est aussi la base de remboursement de l'Assurance maladie."
    type: nombre
    unite: euros
    bornes: [0, 100]
    valeurs:
      - depuis: "2024-12-22"
        valeur: 30
        sources: [cnam-cp-2024-12-05-convention-medicale, ameli-consultations-metropole]
        article: "Convention médicale 2024-2029 (consultation G)"
    tags: [consultation, medecin_generaliste, tarif]
    a_verifier: false
    note: "Revalorisation à 30 € « à compter du 22 décembre 2024 » (Assurance maladie). Le montant antérieur n'a pas été lu sur une source officielle et n'est pas historisé."

  # ---------------------------------------------------------------------------
  # TAUX DE REMBOURSEMENT (régime général)
  # ---------------------------------------------------------------------------
  - id: sante.remboursement.taux_honoraires_medecins
    titre: "Taux de remboursement des consultations de médecin (généraliste ou spécialiste)"
    explication: "Part du tarif conventionnel remboursée par l'Assurance maladie pour une consultation de médecin dans le parcours de soins. Le reste (ticket modérateur) est en général pris en charge par la complémentaire."
    type: nombre
    unite: pourcent
    bornes: [0, 100]
    valeurs:
      - depuis: "2026-09-30"
        valeur: 70
        sources: [ameli-taux-remboursement, ameli-consultations-metropole]
        article: "Code de la sécurité sociale, art. L160-13 (participation de l'assuré)"
    tags: [remboursement, consultation, ticket_moderateur]
    a_verifier: false
    note: "Date « depuis » = date de mise à jour de la page ameli (30/09/2026), qui ne mentionne aucune modification récente ; date d'origine du taux non vérifiée. Exemple ameli : consultation à 30 € → 21 € moins 2 € de participation forfaitaire = 19 € remboursés. Taux de 80 % pour les bénéficiaires de l'ASPA."

  - id: sante.remboursement.taux_auxiliaires_medicaux
    titre: "Taux de remboursement des actes des auxiliaires médicaux"
    explication: "Part remboursée des actes d'infirmiers, masseurs-kinésithérapeutes, orthophonistes, orthoptistes et pédicures-podologues."
    type: nombre
    unite: pourcent
    bornes: [0, 100]
    valeurs:
      - depuis: "2026-09-30"
        valeur: 60
        sources: [ameli-taux-remboursement]
    tags: [remboursement, paramedical]
    a_verifier: false
    note: "Date « depuis » = date de mise à jour de la page ameli ; date d'origine non vérifiée. Même taux pour les consultations de chirurgien-dentiste, les actes de biologie (B) et l'optique."

  - id: sante.remboursement.taux_medicaments_smr_majeur_important
    titre: "Taux de remboursement des médicaments à service médical rendu majeur ou important"
    explication: "Part du prix remboursée pour les médicaments dont la Haute Autorité de santé juge l'intérêt majeur ou important."
