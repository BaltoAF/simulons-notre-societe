  explication: 'La décote réduit l''impôt des foyers modestes, pour éviter de passer brutalement de 0 à quelques centaines
    d''euros d''impôt. Elle vaut un montant de départ (règles suivantes) moins ce pourcentage de l''impôt calculé : plus il
