    tags: [capital, csg, prelevements_sociaux]
    a_verifier: false
    note: "Taux antérieur : 9,2 %. La hausse finance la branche autonomie, la CNSA et la CADES. S'applique aux revenus du patrimoine à compter de l'imposition des revenus 2025 et aux produits de placement à compter du 1er janvier 2026."
  - id: fiscalite.csg.revenus_capital_taux_derogatoire
    titre: "CSG sur certains revenus du capital : taux maintenu (épargne logement, assurance-vie, foncier)"
    explication: "Taux de CSG resté inchangé pour certains revenus : revenus fonciers, plus-values immobilières, épargne logement, assurance-vie, rentes viagères."
    type: nombre
    unite: pourcent
    bornes: [0, 20]
    valeurs:
