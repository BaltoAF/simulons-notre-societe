# Fiscalité des entreprises, du capital et du patrimoine — valeurs en vigueur au 13 octobre 2026.
# Sources : loi n° 2026-103 du 19 février 2026 de finances pour 2026 (texte définitif AN TA n° 227),
# loi n° 2025-1403 du 30 décembre 2025 de financement de la sécurité sociale pour 2026, BOFiP, impots.gouv.fr,
# service-public.gouv.fr. Les règles d'identifiant « fiscalite.controle.* » sont des contrôles croisés de règles déjà
# présentes dans les fichiers générés depuis OpenFisca (tva.yaml, impot_revenu.yaml) : elles ne doivent pas créer de
# second curseur dans un fork.
domaine: fiscalite
theme: "Entreprises, capital et patrimoine"
regles:
  # ================================================================ Impôt sur les sociétés
  - id: fiscalite.is.taux_normal
    titre: "Impôt sur les sociétés : taux normal"
    explication: "Part des bénéfices d'une société versée à l'État au titre de l'impôt sur les sociétés."
    type: nombre
    unite: pourcent
    bornes: [0, 50]
    valeurs:
      - depuis: "2026-01-01"
        valeur: 25
        sources: [sp-ent-f23575-is]
        article: "Code général des impôts, art. 219"
    tags: [impot_societes, entreprises]
    a_verifier: false
    note: "Valeur vérifiée en vigueur en 2026 (fiche vérifiée le 17 février 2026) ; la date d'entrée en vigueur initiale de ce taux n'a pas été revérifiée ici."
  - id: fiscalite.is.taux_reduit_pme
    titre: "Impôt sur les sociétés : taux réduit des PME"
    explication: "Taux réduit appliqué à la première tranche de bénéfice des petites et moyennes entreprises."
    type: nombre
    unite: pourcent
    bornes: [0, 50]
    valeurs:
      - depuis: "2026-01-01"
        valeur: 15
        sources: [sp-ent-f23575-is]
        article: "Code général des impôts, art. 219, I, b"
    tags: [impot_societes, entreprises, pme]
    a_verifier: false
    note: "Conditions : chiffre d'affaires annuel inférieur ou égal à 10 millions d'euros et capital entièrement libéré, détenu à 75 % au moins par des personnes physiques (ou par une société elle-même détenue à 75 % par des personnes physiques)."
  - id: fiscalite.is.plafond_benefice_taux_reduit
    titre: "Impôt sur les sociétés : plafond de bénéfice taxé au taux réduit PME"
    explication: "Montant de bénéfice jusqu'auquel une PME éligible paie le taux réduit ; au-delà, le taux normal s'applique."
    type: nombre
    unite: euros
    bornes: [0, 200000]
    valeurs:
      - depuis: "2026-01-01"
        valeur: 42500
        sources: [sp-ent-f23575-is]
        article: "Code général des impôts, art. 219, I, b"
    tags: [impot_societes, entreprises, pme]
    a_verifier: false
  - id: fiscalite.is.plafond_ca_taux_reduit
    titre: "Impôt sur les sociétés : chiffre d'affaires maximal pour bénéficier du taux réduit PME"
    explication: "Une société dont le chiffre d'affaires dépasse ce montant ne peut pas bénéficier du taux réduit de 15 %."
    type: nombre
    unite: euros
    bornes: [0, 50000000]
    valeurs:
      - depuis: "2026-01-01"
        valeur: 10000000
        sources: [sp-ent-f23575-is]
        article: "Code général des impôts, art. 219, I, b"
    tags: [impot_societes, entreprises, pme]
    a_verifier: false
  # ---------------------------------------------------------------- Contribution exceptionnelle sur les bénéfices des grandes entreprises
  - id: fiscalite.is.contribution_exceptionnelle.en_vigueur
    titre: "Contribution exceptionnelle sur les bénéfices des grandes entreprises : en vigueur"
    explication: "Surtaxe temporaire de l'impôt sur les sociétés pour les très grandes entreprises, due au titre des deux premiers exercices clos à compter du 31 décembre 2025."
    type: booleen
    valeurs:
      - depuis: "2026-02-21"
        valeur: true
        sources: [an-ta227-lfi-2026, bofip-boi-is-aut-60, bofip-actu-2026-00097]
        article: "Loi n° 2025-127 du 14 février 2025, art. 48, prorogé par la loi n° 2026-103 du 19 février 2026, art. 12"
    tags: [impot_societes, grandes_entreprises, surtaxe]
    a_verifier: false
    note: "Le PLF 2027 (projet n° 3210, art. 15) propose une troisième année au taux de 15,7 % (CA de 1,5 à 3 Md€) et 31,4 % (CA d'au moins 3 Md€), soit une baisse d'environ un tiers ; non adopté au 13 octobre 2026."
  - id: fiscalite.is.contribution_exceptionnelle.taux_ca_moins_3_mds
    titre: "Contribution exceptionnelle des grandes entreprises : taux pour un chiffre d'affaires inférieur à 3 Md€"
    explication: "Pourcentage ajouté à l'impôt sur les sociétés (moyenne de l'IS de l'exercice et de l'exercice précédent) pour les entreprises assujetties dont le chiffre d'affaires est inférieur à 3 milliards d'euros."
    type: nombre
    unite: pourcent
    bornes: [0, 100]
    valeurs:
      - depuis: "2026-02-21"
        valeur: 20.6
        sources: [bofip-boi-is-aut-60]
        article: "Loi n° 2025-127, art. 48, IV, A ; BOI-IS-AUT-60 (version du 12 août 2026)"
    tags: [impot_societes, grandes_entreprises, surtaxe]
    a_verifier: false
    note: "Lissage pour le second exercice entre 1,5 et 1,6 Md€ de chiffre d'affaires : taux = 20,6 % × (CA − 1,5 Md€) / 100 M€."
  - id: fiscalite.is.contribution_exceptionnelle.taux_ca_3_mds_et_plus
    titre: "Contribution exceptionnelle des grandes entreprises : taux pour un chiffre d'affaires d'au moins 3 Md€"
    explication: "Pourcentage ajouté à l'impôt sur les sociétés pour les entreprises réalisant au moins 3 milliards d'euros de chiffre d'affaires."
    type: nombre
    unite: pourcent
    bornes: [0, 100]
    valeurs:
      - depuis: "2026-02-21"
        valeur: 41.2
        sources: [bofip-boi-is-aut-60]
        article: "Loi n° 2025-127, art. 48, IV, B ; BOI-IS-AUT-60 (version du 12 août 2026)"
    tags: [impot_societes, grandes_entreprises, surtaxe]
    a_verifier: false
    note: "Taux progressif entre 3 et 3,1 Md€ de chiffre d'affaires ; taux plein de 41,2 % à partir de 3,1 Md€."
  - id: fiscalite.is.contribution_exceptionnelle.seuil_ca_second_exercice
    titre: "Contribution exceptionnelle des grandes entreprises : seuil de chiffre d'affaires (second exercice)"
    explication: "Chiffre d'affaires à partir duquel une entreprise paie la contribution au titre du second exercice (exercices clos fin 2026 en général)."
    type: nombre
    unite: milliards_euros
    bornes: [0, 10]
    valeurs:
      - depuis: "2026-02-21"
        valeur: 1.5
        sources: [an-ta227-lfi-2026, bofip-boi-is-aut-60]
        article: "Loi n° 2026-103, art. 12 (modifiant l'art. 48 de la loi n° 2025-127)"
    tags: [impot_societes, grandes_entreprises, surtaxe]
    a_verifier: false
    note: "Pour le premier exercice, le seuil est de 1 Md€ (apprécié sur l'exercice ou l'exercice précédent) ; pour le second, 1,5 Md€ apprécié sur le seul exercice concerné."
  - id: fiscalite.is.impot_minimum_mondial.taux
    titre: "Impôt minimum mondial des grands groupes (pilier 2) : taux minimal effectif"
    explication: "Les grands groupes multinationaux doivent payer au moins ce taux d'impôt sur leurs bénéfices dans chaque pays ; sinon un impôt complémentaire est dû."
    type: nombre
    unite: pourcent
    bornes: [0, 50]
    valeurs:
      - depuis: "2023-12-31"
        valeur: 15
        sources: [verif-bofip-boi-img-def, verif-bofip-boi-img, an-ta227-lfi-2026]
        article: "CGI, art. 223 VK, 45° (loi n° 2023-1322 du 29 décembre 2023 de finances pour 2024, art. 33) ; loi n° 2026-103, état A, ligne 1304 « Impôt minimum mondial à 15 % - pilier 2 »"
    tags: [impot_societes, international]
    a_verifier: false
    note: "Vérifié le 2026-10-13 : le BOFiP (BOI-IMG-DEF, § 670) définit le taux minimum d'imposition comme « un taux d'imposition correspondant à 15 % » ; le dispositif s'applique aux exercices ouverts à compter du 31 décembre 2023 (BOI-IMG, § 1). Taux également repris dans l'intitulé de la ligne de recette de la LFI 2026."
  # ---------------------------------------------------------------- Holdings patrimoniales
  - id: fiscalite.holdings.taxe_actifs_non_affectes.taux
    titre: "Taxe sur les actifs non professionnels des sociétés holdings patrimoniales : taux"
    explication: "Nouvelle taxe annuelle sur les biens non affectés à une activité opérationnelle (placements, biens de luxe…) détenus par des holdings patrimoniales contrôlées par une personne physique."
    type: nombre
    unite: pourcent
    bornes: [0, 50]
    valeurs:
      - depuis: "2026-02-21"
        valeur: 20
        sources: [an-ta227-lfi-2026, cc-2026-901-dc]
        article: "Code général des impôts, art. 235 ter C, IV (créé par la loi n° 2026-103, art. 7)"
    tags: [patrimoine, holdings, entreprises]
    a_verifier: false
    note: "Due au titre des exercices clos à compter du 31 décembre 2026 (première application fin 2026). Conditions : actifs d'au moins 5 M€ ; une personne physique détient au moins 50 % des droits ou contrôle la société ; revenus passifs supérieurs à 50 % des produits. Déclarée conforme (décision n° 2026-901 DC)."
  - id: fiscalite.holdings.taxe_actifs_non_affectes.seuil_actifs
    titre: "Taxe sur les holdings patrimoniales : valeur minimale des actifs détenus"
    explication: "Les holdings dont la valeur totale des actifs est inférieure à ce montant ne sont pas concernées."
    type: nombre
    unite: euros
    bornes: [0, 50000000]
    valeurs:
      - depuis: "2026-02-21"
        valeur: 5000000
        sources: [an-ta227-lfi-2026]
        article: "Code général des impôts, art. 235 ter C, I, A, 1° (loi n° 2026-103, art. 7)"
    tags: [patrimoine, holdings, entreprises]
    a_verifier: false
