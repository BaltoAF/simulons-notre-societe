  - id: fiscalite.capital.prelevements_sociaux_taux_global
    titre: "Prélèvements sociaux sur les revenus du capital : taux global (cas général)"
    explication: "Total de la CSG, de la CRDS et du prélèvement de solidarité payé sur les revenus de placements (dividendes, intérêts, plus-values mobilières…)."
    type: nombre
    unite: pourcent
    bornes: [0, 40]
    valeurs:
      - depuis: "2026-01-01"
        valeur: 18.6
        sources: [sp-f2329-prelevements-sociaux, sp-f2613-revenus-epargne, jo-loi-2025-1403-lfss-2026]
        article: "Loi n° 2025-1403, art. 12 (hausse de la CSG de 9,2 % à 10,6 %)"
    tags: [capital, prelevements_sociaux, pfu]
    a_verifier: false
    note: "Hausse de 1,4 point au 1er janvier 2026 (17,2 % auparavant). Restent à 17,2 % (CSG à 9,2 %) : assurance-vie, plan et compte d'épargne logement, plan d'épargne populaire, revenus fonciers et plus-values immobilières. Pour les revenus du patrimoine imposés au barème, la hausse s'applique dès les revenus de 2025."
  - id: fiscalite.capital.pfu_taux_global
    titre: "Prélèvement forfaitaire unique (« flat tax ») : taux global"
    explication: "Taux total payé par défaut sur les dividendes, intérêts et plus-values mobilières : impôt sur le revenu + prélèvements sociaux."
    type: nombre
    unite: pourcent
    bornes: [0, 60]
    valeurs:
      - depuis: "2026-01-01"
        valeur: 31.4
        sources: [sp-f2613-revenus-epargne, sp-f2329-prelevements-sociaux]
        article: "CGI, art. 200 A (12,8 %) + prélèvements sociaux (18,6 %)"
    tags: [capital, pfu]
    a_verifier: false
    note: "Somme des deux composantes vérifiées (12,8 % + 18,6 %) ; le total n'est pas écrit tel quel sur la fiche F2613. Pour les produits restés à 17,2 % de prélèvements sociaux (assurance-vie, épargne logement…), le total est de 30 %."
  - id: fiscalite.csg.revenus_capital_taux
    titre: "CSG sur les revenus du capital : taux de droit commun"
    explication: "Contribution sociale généralisée prélevée sur les revenus du patrimoine et des placements."
    type: nombre
    unite: pourcent
    bornes: [0, 20]
    valeurs:
      - depuis: "2026-01-01"
        valeur: 10.6
