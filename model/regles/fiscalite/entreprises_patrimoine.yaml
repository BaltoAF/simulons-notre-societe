  # ================================================================ Revenus du capital : PFU et prélèvements sociaux
  - id: fiscalite.controle.pfu_taux_ir
    titre: "Contrôle croisé — Prélèvement forfaitaire unique : part impôt sur le revenu"
    explication: "Taux d'impôt sur le revenu appliqué par défaut aux intérêts, dividendes et plus-values mobilières (« flat tax »)."
    type: nombre
