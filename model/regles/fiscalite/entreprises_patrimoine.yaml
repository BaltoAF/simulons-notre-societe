        valeur: 9.2
        sources: [jo-loi-2025-1403-lfss-2026, sp-f2329-prelevements-sociaux]
        article: "Code de la sécurité sociale, art. L. 136-8, IV (rétabli par la loi n° 2025-1403, art. 12)"
    tags: [capital, csg, prelevements_sociaux]
    a_verifier: false
  - id: fiscalite.capital.prelevement_solidarite_taux
    titre: "Prélèvement de solidarité sur les revenus du capital : taux"
    explication: "Composante des prélèvements sociaux sur les revenus du patrimoine et des placements, au profit de l'État."
    type: nombre
    unite: pourcent
    bornes: [0, 20]
    valeurs:
      - depuis: "2026-01-01"
