    note: "Date d'entrée en vigueur non établie ; valeur attestée pour l'élection du 9 juin 2024 et par service-public (vérifié le 14 août 2026). Le seuil de 5 % des suffrages exprimés pour obtenir des sièges et le nombre de sièges attribués à la France (81 en 2024) n'ont pas pu être lus sur une source officielle accessible (vie-publique.fr, interieur.gouv.fr et europarl bloqués) et ne sont pas modélisés."

  - id: institutions.europeennes.seuil_remboursement_suffrages
    titre: "Européennes : score minimal pour le remboursement des frais de campagne"
    explication: "Aux européennes, une liste doit obtenir au moins 3 % des suffrages exprimés pour que l'État lui rembourse une partie de ses dépenses de campagne (contre 5 % pour les autres élections)."
    type: nombre
    unite: pourcent
    bornes: [0, 10]
    valeurs:
