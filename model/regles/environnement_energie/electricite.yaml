domaine: environnement_energie
theme: "Électricité : tarif réglementé de vente (TRVE)"
regles:
  - id: environnement_energie.trve.base_6kva_prix_kwh_ttc
    titre: "Tarif réglementé d'électricité, option Base 6 kVA : prix du kWh TTC"
    explication: "Prix de chaque kilowattheure consommé pour un client résidentiel au tarif bleu d'EDF (option Base, 6 kVA), toutes taxes comprises."
    type: nombre
    unite: centimes_euro_par_kwh
    bornes: [5, 50]
    valeurs:
      - depuis: "2026-02-01"
        valeur: 19.40
        sources: [cre-trve-comprendre]
        article: "Délibération de la CRE n° 2026-06 du 14 janvier 2026 ; code de l'énergie, art. L337-6"
    tags: [electricite, tarif_reglemente, prix_energie, menages]
    a_verifier: true
    note: "Valeur du mouvement tarifaire du 1er février 2026 (grille TTC publiée par la CRE, page mise à jour le 20/01/2026). Les TRVE évoluent en février et en août ; le médiateur national de l'énergie mentionne une « hausse des tarifs réglementés de vente de l'électricité au 1er août » 2026 (source mne-energie-info-hausse-prix-2026, 24/09/2026) dont le montant n'a pas pu être lu. La valeur en vigueur au 13/10/2026 est donc probablement différente. Options 9 à 15 kVA au 1er février 2026 : 19,27 c€/kWh."

  - id: environnement_energie.trve.base_6kva_abonnement_annuel_ttc
    titre: "Tarif réglementé d'électricité, option Base 6 kVA : abonnement annuel TTC"
    explication: "Part fixe annuelle (abonnement) du tarif bleu résidentiel en option Base, puissance 6 kVA, toutes taxes comprises."
    type: nombre
    unite: euros
    bornes: [50, 500]
    valeurs:
      - depuis: "2026-02-01"
        valeur: 188.24
        sources: [cre-trve-comprendre]
        article: "Délibération de la CRE n° 2026-06 du 14 janvier 2026"
    tags: [electricite, tarif_reglemente, prix_energie, menages]
    a_verifier: true
    note: "Grille du 1er février 2026 ; un mouvement tarifaire est intervenu au 1er août 2026 (voir règle du prix du kWh), montant non vérifié."

  - id: environnement_energie.trve.periodicite_evolution
    titre: "Tarif réglementé d'électricité : calendrier d'évolution"
    explication: "Moments de l'année où les tarifs réglementés de vente d'électricité sont révisés, sur proposition de la Commission de régulation de l'énergie (méthode d'empilement des coûts)."
    type: texte
    unite: ""
    valeurs:
      - depuis: "2026-01-20"
        valeur: "Deux fois par an, en février et en août"
        sources: [cre-trve-comprendre]
        article: "Code de l'énergie, art. L337-6"
    tags: [electricite, tarif_reglemente]
    a_verifier: false
    note: "Date « depuis » = date de mise à jour de la page CRE ; date d'origine non vérifiée."
