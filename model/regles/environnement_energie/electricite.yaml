        sources: [verif-cre-opendata-trve-residentiels, verif-cre-delib-2026-147, verif-legi-decision-trve-residentiels-2026-07-29]
        article: "Décision du 29 juillet 2026 relative aux TRVE des consommateurs résidentiels (sur proposition de la CRE, délibération n° 2026-147 du 15 juillet 2026)"
