regles:
  - id: environnement_energie.trve.base_6kva_prix_kwh_ttc
    titre: "Tarif réglementé d'électricité, option Base 6 kVA : prix du kWh TTC"
    explication: "Prix de chaque kilowattheure consommé pour un client résidentiel au tarif bleu d'EDF (option Base, 6 kVA), toutes taxes comprises."
    type: nombre
    unite: centimes_euro_par_kwh
    bornes: [5, 50]
    valeurs:
      - depuis: "2026-02-01"
        valeur: 19.40
        sources: [cre-trve-comprendre]
        article: "Délibération de la CRE n° 2026-06 du 14 janvier 2026 ; code de l'énergie, art. L337-6"
      - depuis: "2026-08-01"
        valeur: 20.01
        sources: [verif-cre-opendata-trve-residentiels, verif-cre-delib-2026-147, verif-legi-decision-trve-residentiels-2026-07-29]
        article: "Décision du 29 juillet 2026 relative aux TRVE des consommateurs résidentiels (sur proposition de la CRE, délibération n° 2026-147 du 15 juillet 2026) ; code de l'énergie, art. L337-6"
    tags: [electricite, tarif_reglemente, prix_energie, menages]
    a_verifier: false
    note: "Vérifié le 2026-10-13 : depuis le 1er août 2026, 0,2001 €/kWh TTC (0,1361 € HT) selon le fichier open data de la CRE (page mise à jour le 26/08/2026), soit +3,1 % par rapport au 1er février 2026 (19,40 c€). Hausse moyenne des tarifs bleus résidentiels proposée par la CRE : +2,51 % TTC. Options 9 à 15 kVA au 1er août 2026 : 19,85 c€/kWh TTC (19,27 c€ au 1er février 2026)."

  - id: environnement_energie.trve.base_6kva_abonnement_annuel_ttc
    titre: "Tarif réglementé d'électricité, option Base 6 kVA : abonnement annuel TTC"
