    unite: mt_co2e
    bornes: [250, 400]
    valeurs:
      - depuis: "2026-07-18"
        valeur: 348
        sources: [eco-mte-snbc3-partie1]
        article: "SNBC 3, partie II.C, tableau 7"
    tags: [climat, budget_carbone, snbc, trajectoire]
    a_verifier: false
    note: "Tranches indicatives (arrondies à 1 Mt) : 2024 : 367 ; 2025 : 359 (égales aux émissions observées, la trajectoire ayant été alignée sur elles d'après le HCC) ; 2026 : 348 ; 2027 : 328 ; 2028 : 308. Seul le plafond moyen de la période est contraignant ; les tranches annuelles sont indicatives."

