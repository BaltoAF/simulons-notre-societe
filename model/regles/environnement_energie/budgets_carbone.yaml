    titre: "Objectif de réduction de la consommation d'espaces naturels, agricoles et forestiers sur 2021-2031 (par rapport à 2011-2021)"
    explication: "Première étape vers le zéro artificialisation nette : sur la décennie 2021-2031, la France doit consommer deux fois moins d'espaces naturels, agricoles et forestiers que sur la décennie 2011-2021."
    type: nombre
    unite: pourcent
    bornes: [0, 100]
    valeurs:
      - depuis: "2021-08-22"
        valeur: 50
        sources: [legi-loi-2021-1104-art-191, eco-mte-artificialisation-sols, eco-portail-artificialisation]
        article: "Loi « Climat et résilience » d'août 2021, art. 194 (première tranche de dix années)"
    tags: [artificialisation, zan, sols, objectif_intermediaire]
    a_verifier: false
    note: "Objectif national territorialisé dans les schémas régionaux (avant le 22/11/2024), les SCoT (avant le 22/02/2027) et les PLU(i) (avant le 22/02/2028) ; une surface minimale d'un hectare est garantie aux communes couvertes par un document d'urbanisme, et les projets d'envergure nationale sont décomptés au niveau national (modalités présentées par le ministère ; la loi ZAN du 20 juillet 2023 a renforcé l'accompagnement des élus). Ordre de grandeur (Cerema, Fichiers fonciers) : 226 734 ha consommés entre le 1/1/2011 et le 1/1/2021, d'où une enveloppe nationale d'environ 113 000 ha pour 2021-2031 ; 72 658 ha consommés entre le 1/1/2021 et le 1/1/2025. Risque législatif (selon la presse spécialisée, non vérifié sur le site du Parlement) : la PPL « TRACE » (Sénat, 18/03/2025) supprimerait cet objectif chiffré au profit de trajectoires régionales avec un premier jalon en 2034 ; non adoptée définitivement à notre connaissance au 13/10/2026 (dernières informations trouvées : mars 2026)."
