        sources: [legi-decret-2026-636, eco-mte-snbc3-partie1, eco-mte-snbc-feuille-route, eco-bdt-snbc3-jo-2026]
        article: "Décret n° 2026-636 du 16 juillet 2026 (JO du 18 juillet 2026, texte n° 8), art. 2"
    tags: [climat, budget_carbone, snbc, contrainte]
    a_verifier: false
    note: "194 Mt/an selon le document de la SNBC 3, la page « feuille de route » et la Banque des Territoires ; la page ministérielle « Suivi des émissions » affiche 193 Mt/an. Texte du décret non consulté. Rythme de baisse visé : environ -5 % par an."

