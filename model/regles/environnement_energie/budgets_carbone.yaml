  - id: environnement_energie.artificialisation.annee_objectif_zan
    titre: "Année d'atteinte de l'objectif « zéro artificialisation nette » des sols"
    explication: "Année à partir de laquelle la France ne doit plus artificialiser de sols sans en rendre autant à la nature (renaturation) : chaque hectare bétonné devra être compensé."
    type: nombre
    unite: annee
    bornes: [2035, 2070]
    valeurs:
      - depuis: "2021-08-22"
        valeur: 2050
        sources: [legi-loi-2021-1104-art-191, eco-mte-artificialisation-sols, eco-portail-artificialisation]
        article: "Loi « Climat et résilience » d'août 2021"
    tags: [artificialisation, zan, sols, biodiversite]
    a_verifier: false
    note: "Objectif confirmé par la page ministérielle (mise à jour 27/10/2025) et le portail de l'artificialisation (consulté le 13/10/2026). Date « depuis » = date usuelle de la loi (22 août 2021) ; texte et date d'entrée en vigueur non lus sur Légifrance (inaccessible). Selon la presse spécialisée (Banque des Territoires, Weka ; non vérifié sur le site du Parlement), la proposition de loi « TRACE », adoptée en 1re lecture par le Sénat le 18/03/2025, maintient l'horizon 2050 mais supprimerait l'objectif intermédiaire chiffré ; aucune adoption définitive trouvée au 13/10/2026."

