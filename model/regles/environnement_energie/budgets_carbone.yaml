domaine: environnement_energie
theme: "Budgets carbone et sobriété foncière"
regles:
  # ---------------------------------------------------------------------------
  # BUDGETS CARBONE NATIONAUX (plafonds légaux d'émissions, SNBC 3)
  # Convention : moyenne annuelle sur la période, en Mt CO2e, émissions
  # territoriales brutes HORS puits de carbone (hors UTCATF et puits technologiques).
  # ---------------------------------------------------------------------------
  - id: environnement_energie.budget_carbone.periode_2019_2023
    titre: "Budget carbone 2019-2023 (plafond annuel moyen d'émissions, hors puits de carbone) – période close"
    explication: "Plafond d'émissions de gaz à effet de serre que la France ne devait pas dépasser, en moyenne par an, entre 2019 et 2023. Il a été respecté : 406 Mt par an en moyenne, soit une marge cumulée de 91 Mt."
    type: nombre
    unite: mt_co2e_par_an
    bornes: [300, 500]
    valeurs:
      - depuis: "2020-04-21"
        valeur: 422
        sources: [eco-mte-snbc3-partie1]
        article: "Décret n° 2020-457 du 21 avril 2020 (SNBC 2)"
      - depuis: "2025-01-01"
        valeur: 425
        sources: [eco-mte-snbc3-partie1, eco-mte-suivi-emissions-ges]
        article: "Code de l'environnement, art. D. 222-1-B (ajustement technique à la clôture du budget)"
    tags: [climat, budget_carbone, snbc, contrainte]
    a_verifier: false
    note: "Valeur initiale déduite du document SNBC 3 (budget ajusté de 425 Mt/an = « écart de + 3 MtCO2e / an par rapport au budget initial »). L'ajustement technique « a été opéré en 2025 » : jour exact non précisé, 1er janvier 2025 retenu par convention. Budget avec puits : 380 Mt/an (respecté avec 48 Mt de marge) ; le budget du secteur UTCATF (-45 Mt/an) n'a pas été tenu (-36 Mt/an observés). Le 1er budget (2015-2018, 442 Mt/an ajusté) avait été dépassé de 61 Mt."

  - id: environnement_energie.budget_carbone.periode_2024_2028
    titre: "Budget carbone 2024-2028 (plafond annuel moyen d'émissions, hors puits de carbone)"
    explication: "Plafond légal des émissions de gaz à effet de serre de la France, en moyenne par an sur 2024-2028, hors absorptions des forêts et des sols. C'est la contrainte climatique en cours : une réforme qui ajoute des émissions doit être compensée pour rester sous ce plafond."
    type: nombre
    unite: mt_co2e_par_an
    bornes: [250, 450]
    valeurs:
      - depuis: "2020-04-21"
        valeur: 359
        sources: [eco-bdt-snbc3-jo-2026]
        article: "Décret n° 2020-457 du 21 avril 2020 relatif aux budgets carbone nationaux et à la stratégie nationale bas-carbone (SNBC 2)"
      - depuis: "2026-07-18"
        valeur: 342
        sources: [eco-mte-snbc3-partie1, eco-mte-snbc-feuille-route, eco-mte-suivi-emissions-ges, eco-bdt-snbc3-jo-2026]
        article: "Décret n° 2026-636 du 16 juillet 2026 relatif aux budgets carbone nationaux et à la stratégie nationale bas-carbone (JO du 18 juillet 2026, texte n° 8), art. 2"
    tags: [climat, budget_carbone, snbc, contrainte]
    a_verifier: false
    note: "3e budget carbone, révisé par la SNBC 3 (« fixé à 342 Mt CO2e/an hors puits de carbone (puits technologiques et secteur UTCATF) »). Les quatre sources concordent. Date « depuis » = publication au JO ; l'entrée en vigueur exacte et le texte même de l'article 2 n'ont pas pu être lus (Légifrance inaccessible, HTTP 403). Date « depuis » de la SNBC 2 = date du décret (publication au JO non vérifiée). Émissions observées : 367 Mt en 2024, 359 Mt en 2025 (pré-estimation)."

  - id: environnement_energie.budget_carbone.periode_2029_2033
    titre: "Budget carbone 2029-2033 (plafond annuel moyen d'émissions, hors puits de carbone)"
    explication: "Plafond légal des émissions de gaz à effet de serre de la France, en moyenne par an sur 2029-2033, hors puits de carbone. Il correspond à la baisse de moitié des émissions entre 1990 et 2030."
    type: nombre
    unite: mt_co2e_par_an
    bornes: [150, 400]
    valeurs:
      - depuis: "2020-04-21"
        valeur: 300
        sources: [eco-bdt-snbc3-jo-2026]
        article: "Décret n° 2020-457 du 21 avril 2020 (SNBC 2)"
      - depuis: "2026-07-18"
        valeur: 262
        sources: [legi-decret-2026-636, eco-mte-snbc3-partie1, eco-mte-snbc-feuille-route, eco-bdt-snbc3-jo-2026]
        article: "Décret n° 2026-636 du 16 juillet 2026 (JO du 18 juillet 2026, texte n° 8), art. 2"
    tags: [climat, budget_carbone, snbc, contrainte]
    a_verifier: false
    note: "262 Mt/an selon le document de la SNBC 3, la page « feuille de route » du ministère et la Banque des Territoires (qui rend compte du décret) ; mais la page ministérielle « Suivi des émissions » affiche 261 Mt/an. Le texte du décret n'a pas pu être consulté pour trancher. Date « depuis » = publication au JO."

  - id: environnement_energie.budget_carbone.periode_2034_2038
    titre: "Budget carbone 2034-2038 (plafond annuel moyen d'émissions, hors puits de carbone)"
    explication: "Nouveau plafond fixé pour la première fois par la SNBC 3 : émissions moyennes annuelles à ne pas dépasser sur 2034-2038, hors puits de carbone."
