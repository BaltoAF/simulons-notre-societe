    titre: "Part annuelle indicative du budget carbone pour 2026 (hors puits de carbone)"
    explication: "Niveau d'émissions que la France devrait viser en 2026 pour respecter le budget carbone 2024-2028. Les émissions de 2025 étaient estimées à 359 Mt, il faut donc une baisse d'environ 3 % en un an."
