  - id: travail.smic.seuil_revalorisation_automatique
    titre: "Hausse des prix déclenchant une revalorisation automatique du SMIC en cours d'année"
    explication: "Si les prix ont augmenté d'au moins 2 % depuis la dernière fixation du SMIC, celui-ci est relevé automatiquement dans la même proportion le mois suivant."
    type: nombre
    unite: pourcent
    bornes: [0, 10]
    valeurs:
      - depuis: "2008-05-01"
        valeur: 2
        sources: [legi-ct-l3231-5]
        article: "Code du travail, art. L3231-5"
    tags: [smic, indexation]
    a_verifier: false
    note: "Ce mécanisme a joué en octobre 2021, mai 2022, août 2022, mai 2023 et juin 2026."

