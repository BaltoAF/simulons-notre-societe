# Salaire minimum et règles de rémunération en vigueur au 13 octobre 2026.
# L'id travail.smic.horaire_brut est aussi un levier du moteur (model/moteur/openfisca_leviers.yaml) :
# le Système rattache le lien moteur à cette règle et vérifie la concordance des valeurs.
domaine: travail
theme: "Salaires et SMIC"
regles:
  - id: travail.smic.horaire_brut
    titre: "SMIC horaire brut (métropole et outre-mer hors Mayotte)"
    explication: "Salaire minimum par heure de travail, avant cotisations. Aucun salarié majeur et expérimenté ne peut être payé moins. Il est revalorisé chaque 1er janvier, et en cours d'année si l'inflation dépasse 2 %."
    type: nombre
    unite: euros
    bornes: [5, 30]
    valeurs:
      - depuis: "2020-01-01"
        valeur: 10.15
        sources: [insee-smic-historique]
        article: "Décret n° 2019-1387 du 18 décembre 2019 (JO du 19/12/2019)"
      - depuis: "2021-01-01"
        valeur: 10.25
        sources: [insee-smic-historique]
        article: "Décret n° 2020-1598 du 16 décembre 2020 (JO du 17/12/2020)"
      - depuis: "2021-10-01"
        valeur: 10.48
        sources: [insee-smic-historique]
        article: "Arrêté du 27 septembre 2021, relèvement automatique (JO du 30/09/2021)"
      - depuis: "2022-01-01"
        valeur: 10.57
        sources: [insee-smic-historique]
        article: "Décret n° 2021-1741 du 22 décembre 2021 (JO du 22/12/2021 selon l'INSEE)"
      - depuis: "2022-05-01"
        valeur: 10.85
        sources: [insee-smic-historique]
        article: "Arrêté de relèvement automatique publié au JO du 19/04/2022 (date INSEE)"
      - depuis: "2022-08-01"
        valeur: 11.07
        sources: [insee-smic-historique]
        article: "Arrêté du 29 juillet 2022, relèvement automatique (JO du 29/07/2022)"
      - depuis: "2023-01-01"
        valeur: 11.27
        sources: [insee-smic-historique]
        article: "Décret n° 2022-1608 du 22 décembre 2022 (JO du 23/12/2022)"
      - depuis: "2023-05-01"
        valeur: 11.52
        sources: [insee-smic-historique]
        article: "Arrêté du 26 avril 2023, relèvement automatique (JO du 27/04/2023)"
      - depuis: "2024-01-01"
        valeur: 11.65
        sources: [insee-smic-historique]
        article: "Décret n° 2023-1216 du 20 décembre 2023 (JO du 21/12/2023)"
      - depuis: "2024-11-01"
        valeur: 11.88
        sources: [insee-smic-historique]
        article: "Décret n° 2024-951 du 23 octobre 2024, relèvement anticipé (JO du 24/10/2024)"
      - depuis: "2026-01-01"
        valeur: 12.02
        sources: [insee-smic-historique, cnav-circ-2025-33]
        article: "Décret n° 2025-1228 du 17 décembre 2025 (JO du 18/12/2025)"
      - depuis: "2026-06-01"
        valeur: 12.31
        sources: [jorf-arrete-smic-2026-05-22, cnav-circ-2026-16, sp-f2300, insee-smic-historique]
        article: "Arrêté du 22 mai 2026 relatif au relèvement du SMIC"
    tags: [smic, salaire_minimum]
    a_verifier: false
    note: "Arrêté du 22 mai 2026 publié au Journal officiel du 24/05/2026 selon la Cnav, du 22/05/2026 selon l'INSEE. Aucune revalorisation au 1er janvier 2025 (11,88 € maintenu). Hausse de 2,41 % au 1er juin 2026 par le mécanisme automatique (inflation ≥ 2 %). Montants lus sur la page INSEE et, pour 2026, dans les circulaires Cnav ; les numéros des textes de 2020 à 2024 viennent de la presse juridique et n'ont pas été relus sur Légifrance, qui bloque l'accès automatisé."

  - id: travail.smic.mensuel_brut_35h
