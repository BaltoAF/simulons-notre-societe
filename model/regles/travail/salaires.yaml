  - id: travail.age_minimum_travail
    titre: "Âge minimum pour être employé"
    explication: "Il est interdit d'employer des jeunes de moins de 16 ans, sauf exceptions (apprentis d'au moins 15 ans, stages d'observation des élèves…)."
    type: nombre
    unite: ans
    bornes: [14, 18]
    valeurs:
      - depuis: "2019-01-01"
        valeur: 16
        sources: [legi-ct-l4153-1]
        article: "Code du travail, art. L4153-1"
    tags: [jeunes, travail_des_mineurs]
    a_verifier: false
    note: "Les apprentis peuvent être employés dès 15 ans."

  - id: travail.smic.abattement_moins_17_ans
    titre: "Abattement sur le SMIC pour un salarié de moins de 17 ans"
    explication: "Un jeune de moins de 17 ans sans 6 mois d'expérience dans sa branche peut être payé 20 % de moins que le SMIC."
    type: nombre
    unite: pourcent
    bornes: [0, 50]
    valeurs:
      - depuis: "2008-05-01"
        valeur: 20
        sources: [legi-ct-d3231-3, sp-f2300]
        article: "Code du travail, art. D3231-3"
    tags: [smic, jeunes]
    a_verifier: false
    note: "Soit 9,85 € brut de l'heure pour les 16 ans et moins depuis le 1er juin 2026 (service-public.gouv.fr). Abattement supprimé après 6 mois de pratique professionnelle dans la branche."

  - id: travail.smic.abattement_17_18_ans
