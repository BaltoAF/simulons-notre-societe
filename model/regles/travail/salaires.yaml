      - depuis: "2026-06-01"
        valeur: 1867.02
        sources: [cnav-circ-2026-16, sp-f2300]
        article: "Arrêté du 22 mai 2026"
    tags: [smic, salaire_minimum]
    a_verifier: false
    note: "Égal au SMIC horaire × 151,67 ; à garder cohérent avec travail.smic.horaire_brut dans un fork."

  - id: travail.smic.mensuel_net_indicatif
