  - id: travail.chomage.cumul_part_salaire_deduite
    titre: "Cumul allocation chômage et salaire : part du nouveau salaire déduite de l'allocation"
    explication: "Une personne qui reprend un emploi en restant inscrite comme demandeur d'emploi garde une partie de son allocation : chaque mois, on retire de l'allocation 70 % du salaire de la nouvelle activité. Les jours non payés reculent d'autant la fin des droits, et l'allocation plus le salaire ne peuvent pas dépasser le salaire de référence."
