# Dispositifs qui N'EXISTENT PAS dans la loi actuelle (valeur neutre), exposés comme leviers
# pour que les forks puissent les créer et en mesurer l'effet. Marqués `virtuel: true`.
domaine: prestations
theme: Dispositifs proposés (inexistants aujourd'hui)
regles:
  - id: prestations.revenu_universel.montant
    titre: "Revenu universel : montant mensuel par personne"
    explication: "Somme versée chaque mois à chaque personne, sans condition de ressources ni contrepartie. Ce dispositif n'existe pas aujourd'hui en France (montant 0 €)."
    type: nombre
    unite: euros
    bornes: [0, 2000]
    virtuel: true
    valeurs:
      - depuis: "1945-01-01"
        valeur: 0
        sources: []
    tags: [proposition, minima_sociaux]
    note: "Aucun texte ne prévoit de revenu universel ; plusieurs départements ont demandé à l'expérimenter (proposition de loi rejetée en 2019)."

  - id: prestations.revenu_universel.age_minimum
    titre: "Revenu universel : âge à partir duquel il est versé"
    explication: "Âge minimal pour recevoir le revenu universel, s'il est créé."
    type: nombre
    unite: ans
    bornes: [0, 30]
    virtuel: true
    valeurs:
      - depuis: "1945-01-01"
        valeur: 18
        sources: []
    tags: [proposition]

  - id: prestations.revenu_universel.remplace_rsa_prime_activite
    titre: "Revenu universel : remplace le RSA et la prime d'activité"
    explication: "Si oui, le revenu universel se substitue au RSA et à la prime d'activité ; si non, il s'y ajoute."
    type: booleen
    unite: ""
    virtuel: true
    valeurs:
      - depuis: "1945-01-01"
        valeur: false
        sources: []
    tags: [proposition]

  - id: prestations.famille.af_premier_enfant_montant
    titre: "Allocations familiales dès le premier enfant : montant mensuel par famille"
    explication: "Somme versée chaque mois à toute famille qui a au moins un enfant à charge de moins de 20 ans, en plus des allocations actuelles (qui commencent au deuxième enfant). Ce dispositif n'existe pas aujourd'hui en métropole (montant 0 €). Simulation simplifiée : versée sans condition de revenus, elle ne réduit pas ici la prime d'activité ni le RSA, alors qu'en réalité ces aides comptent les allocations familiales dans les ressources."
    type: nombre
    unite: euros
    bornes: [0, 500]
    virtuel: true
    valeurs:
      - depuis: "1945-01-01"
        valeur: 0
        sources: []
    tags: [proposition, famille]
    note: "En métropole, les allocations familiales ne sont versées qu'à partir du 2e enfant ; dans les départements d'outre-mer, un montant existe pour un enfant seul."
