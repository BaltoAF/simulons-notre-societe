# Garde des jeunes enfants chez une assistante maternelle agréée (emploi direct) : complément de libre choix du mode de
# garde (CMG) tel que réformé au 1er septembre 2025, et crédit d'impôt pour frais de garde. Fichier écrit à la main :
# OpenFisca-France 176 ne connaît que l'ancien CMG (formule de 2017). Ces règles servent à l'estimation « Coût de la
# garde » de Mes droits (frontend/src/lib/garde.ts) : CMG = heures × tarif retenu × (1 − ressources × taux d'effort ÷ coût
# horaire de référence).
domaine: prestations
theme: "Garde des jeunes enfants"
