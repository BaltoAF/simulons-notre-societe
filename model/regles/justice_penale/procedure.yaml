    tags: [amenagement, prison, execution_des_peines]
    a_verifier: false
    note: "Date d'entrée en vigueur non établie ; valeur attestée au 2026-09-11 (service-public)."

  # ------------------------------------------------------------------ Réductions de peine
  - id: justice_penale.reduction_peine.plafond_annuel
    titre: "Réductions de peine : maximum par année de détention"
    explication: "Le juge de l'application des peines peut réduire la peine d'un détenu qui se conduit bien et fait des efforts de réinsertion, au maximum de 6 mois par année de détention."
    type: nombre
    unite: mois
    bornes: [0, 12]
    valeurs:
      - depuis: "2023-01-01"
        valeur: 6
        sources: [sp-f34157, senat-rapport-l25-601, legi-cpp-721]
        article: "Code de procédure pénale, art. 721 à 721-3"
    tags: [reduction_peine, execution_des_peines, prison]
    a_verifier: false
    note: "Régime applicable aux personnes écrouées depuis le 1er janvier 2023. Plafond réduit à 3 mois par an pour le terrorisme, certains crimes contre les forces de l'ordre, le refus de soins pour les auteurs d'infractions sexuelles et la criminalité organisée (peine ≥ 5 ans). Aucune réduction pour la perpétuité."

  - id: justice_penale.reduction_peine.plafond_mensuel_courte_peine
    titre: "Réductions de peine : maximum par mois pour une peine de moins d'un an"
    explication: "Pour une peine de moins d'un an (ou s'il reste moins d'un an à faire), la réduction maximale est de 14 jours par mois de détention."
    type: nombre
    unite: jours
    bornes: [0, 31]
    valeurs:
      - depuis: "2023-01-01"
        valeur: 14
        sources: [sp-f34157, senat-rapport-l25-601, legi-cpp-721]
        article: "Code de procédure pénale, art. 721 à 721-3"
    tags: [reduction_peine, execution_des_peines, prison]
    a_verifier: false
    note: "Régime applicable aux personnes écrouées depuis le 1er janvier 2023. 7 jours par mois dans les cas aggravés (terrorisme, criminalité organisée…)."

  - id: justice_penale.reduction_peine.credit_automatique
    titre: "Les réductions de peine sont-elles accordées automatiquement ?"
    explication: "Pour les personnes écrouées depuis le 1er janvier 2023, il n'y a plus de « crédit de peine » automatique : chaque réduction est décidée par le juge, au moins une fois par an, selon la conduite et les efforts du détenu."
    type: booleen
    valeurs:
      - depuis: "2023-01-01"
        valeur: false
        sources: [sp-f34157, legi-cpp-721]
        article: "Code de procédure pénale, art. 721 à 721-3"
    tags: [reduction_peine, execution_des_peines, prison, reforme_2023]
    a_verifier: false
    note: "Avant le 1er janvier 2023, un crédit de peine était accordé automatiquement, sans condition, dès que la condamnation devenait définitive (sauf terrorisme et certaines infractions contre les forces de l'ordre) ; la date de création de ce crédit n'a pas été établie sur une source lue, l'entrée antérieure n'est donc pas modélisée."

  # ------------------------------------------------------------------ Libération sous contrainte
  - id: justice_penale.liberation_sous_contrainte.plein_droit_seuil_peine
    titre: "Libération sous contrainte automatique : durée de peine en dessous de laquelle elle s'applique"
    explication: "Les condamnés à moins de 2 ans de prison sortent en principe automatiquement sous contrainte (bracelet, semi-liberté…) quand il leur reste 3 mois à faire, sauf exceptions (crime, terrorisme, violences conjugales, violences en détention…)."
    type: nombre
