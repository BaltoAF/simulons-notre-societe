    tags: [liberation_sous_contrainte, execution_des_peines, prison]
    a_verifier: false
    note: "Date d'entrée en vigueur non établie ; valeur attestée au 2026-04-27 (service-public). Pour les peines de moins de 5 ans, une libération sous contrainte peut aussi être décidée par le juge aux 2/3 de la peine."

  - id: justice_penale.liberation_sous_contrainte.plein_droit_reliquat
    titre: "Libération sous contrainte automatique : reliquat de peine à partir duquel elle s'applique"
    explication: "Pour les peines de moins de 2 ans, la libération sous contrainte s'applique automatiquement lorsqu'il ne reste plus que 3 mois de prison à effectuer, même si le condamné s'y oppose."
    type: nombre
    unite: mois
