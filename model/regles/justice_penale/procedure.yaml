  # ------------------------------------------------------------------ Aménagement des peines
  - id: justice_penale.amenagement_peine.seuil_obligatoire
    titre: "Prison ferme : durée jusqu'à laquelle la peine doit être aménagée"
    explication: "Une peine de prison ferme de 1 à 6 mois doit en principe être exécutée hors de prison (bracelet électronique, semi-liberté, placement à l'extérieur), sauf décision motivée du tribunal."
    type: nombre
    unite: mois
    bornes: [0, 24]
    valeurs:
      - depuis: "2026-09-11"
        valeur: 6
        sources: [sp-f35705]
    tags: [amenagement, prison, execution_des_peines]
    a_verifier: false
    note: "Date d'entrée en vigueur non établie ; valeur attestée au 2026-09-11 (service-public). L'interdiction des peines de prison ferme d'un mois ou moins n'a pas été retrouvée sur une source officielle lue et n'est pas modélisée."

  - id: justice_penale.amenagement_peine.seuil_principe
    titre: "Prison ferme : durée jusqu'à laquelle l'aménagement est le principe"
    explication: "Pour une peine de prison ferme jusqu'à 1 an, le tribunal doit en principe décider d'un aménagement, sauf si la personnalité ou la situation du condamné ne le permet pas (décision motivée)."
    type: nombre
    unite: mois
    bornes: [0, 36]
