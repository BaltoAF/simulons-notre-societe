  # ------------------------------------------------------------------ Juridictions criminelles
  - id: justice_penale.cour_criminelle.generalisee
    titre: "La cour criminelle départementale (sans jury) est-elle généralisée ?"
    explication: "Depuis le 1er janvier 2023, les crimes punis de 15 à 20 ans (comme la plupart des viols) commis par des majeurs non récidivistes sont jugés en première instance par une cour criminelle composée uniquement de juges, et non plus par une cour d'assises avec jury, dans toute la France sauf Mayotte."
    type: booleen
    valeurs:
      - depuis: "2023-01-01"
        valeur: true
        sources: [sp-f1487, sp-f2189]
    tags: [juridictions, cour_criminelle, jury, reforme_2023]
    a_verifier: false
    note: "Généralisation après une expérimentation dans certains départements à partir de 2019 (arrêtés cités par service-public). Exception : Mayotte."

  - id: justice_penale.cour_criminelle.peine_max_crimes_juges
    titre: "Cour criminelle départementale : peine maximale des crimes qu'elle juge"
    explication: "La cour criminelle juge les crimes punis de 15 à 20 ans de réclusion, commis par des majeurs hors récidive ; les crimes punis de 30 ans ou de la perpétuité restent jugés par la cour d'assises."
    type: nombre
