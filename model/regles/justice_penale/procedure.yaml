        valeur: 1
        sources: [sp-f1042, legi-cpp-137]
    tags: [detention_provisoire, procedure, libertes]
    a_verifier: false
    note: "Date d'entrée en vigueur non établie ; valeur attestée au 2026-07-28 (service-public)."

  - id: justice_penale.detention_provisoire.crime_duree_max
    titre: "Détention provisoire pour un crime puni de moins de 20 ans : durée maximale"
    explication: "Pour un crime puni de moins de 20 ans de réclusion, la détention provisoire ne peut pas dépasser 2 ans au total (3 ans si une partie des faits a eu lieu à l'étranger)."
    type: nombre
    unite: ans
    bornes: [0, 6]
    valeurs:
      - depuis: "2026-07-28"
        valeur: 2
        sources: [sp-f1042, legi-cpp-137]
    tags: [detention_provisoire, procedure, libertes]
    a_verifier: false
    note: "Date d'entrée en vigueur non établie ; valeur attestée au 2026-07-28 (service-public). Prolongation exceptionnelle de 4 mois, une ou deux fois, par la chambre de l'instruction."

  - id: justice_penale.detention_provisoire.crime_grave_duree_max
    titre: "Détention provisoire pour les crimes les plus graves : durée maximale"
    explication: "Pour un trafic de stupéfiants, un acte terroriste, du proxénétisme, une extorsion ou plusieurs crimes graves, la détention provisoire peut atteindre 4 ans."
