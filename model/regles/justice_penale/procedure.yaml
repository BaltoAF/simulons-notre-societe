domaine: justice_penale
theme: "Procédure pénale et exécution des peines"
regles:
  # ------------------------------------------------------------------ Mineurs
  - id: justice_penale.majorite_penale.age
    titre: "Âge de la majorité pénale"
    explication: "À partir de 18 ans, une personne est jugée comme un adulte. Avant cet âge, elle relève de la justice des mineurs, avec une responsabilité atténuée."
    type: nombre
    unite: ans
    bornes: [13, 21]
    valeurs:
      - depuis: "2025-10-31"
        valeur: 18
        sources: [sp-f1837]
    tags: [mineurs, responsabilite_penale, age]
    a_verifier: false
    note: "Date d'entrée en vigueur non établie ; valeur attestée au 2025-10-31 (service-public)."

  - id: justice_penale.mineurs.age_presomption_non_discernement
    titre: "Mineurs : âge en dessous duquel l'enfant est présumé ne pas comprendre ses actes"
    explication: "Un enfant de moins de 13 ans est présumé incapable de discernement : il ne peut pas être condamné à une peine, sauf s'il est prouvé qu'il comprenait ce qu'il faisait. Des mesures éducatives restent possibles."
    type: nombre
    unite: ans
    bornes: [10, 16]
    valeurs:
      - depuis: "2025-10-31"
        valeur: 13
        sources: [sp-f1837]
    tags: [mineurs, responsabilite_penale, age, cjpm]
    a_verifier: false
    note: "Présomption simple prévue par le code de la justice pénale des mineurs (CJPM). Date d'entrée en vigueur du CJPM non établie sur une source lue ; valeur attestée au 2025-10-31 (service-public). Aucune peine ne peut être prononcée contre un mineur de moins de 13 ans."

  - id: justice_penale.mineurs.excuse_minorite_part_peine
    titre: "Excuse de minorité : part maximale de la peine prévue pour un adulte"
    explication: "Grâce à « l'excuse de minorité », un mineur de 13 ans ou plus ne peut pas être condamné à plus de la moitié de la peine de prison ou d'amende prévue pour un adulte (amende plafonnée à 7 500 €)."
    type: nombre
    unite: pourcent
    bornes: [0, 100]
    valeurs:
      - depuis: "2025-10-31"
        valeur: 50
        sources: [sp-f1837]
    tags: [mineurs, peine, excuse_minorite]
    a_verifier: false
    note: "Date d'entrée en vigueur non établie ; valeur attestée au 2025-10-31 (service-public)."

  - id: justice_penale.mineurs.peine_max_si_perpetuite_encourue
    titre: "Mineurs : peine maximale quand un adulte risquerait la perpétuité"
    explication: "Si l'infraction est punie de la prison à vie pour un adulte, un mineur bénéficiant de l'excuse de minorité ne peut pas être condamné à plus de 20 ans de prison (30 ans si l'excuse est écartée pour un mineur de 16 ans ou plus)."
    type: nombre
    unite: ans
    bornes: [0, 30]
    valeurs:
      - depuis: "2025-10-31"
        valeur: 20
        sources: [sp-f1837]
    tags: [mineurs, peine, excuse_minorite, perpetuite]
    a_verifier: false
    note: "Date d'entrée en vigueur non établie ; valeur attestée au 2025-10-31 (service-public)."

  - id: justice_penale.mineurs.age_exclusion_excuse_minorite
    titre: "Mineurs : âge à partir duquel l'excuse de minorité peut être écartée"
    explication: "Pour un mineur de 16 à 18 ans, le tribunal peut exceptionnellement refuser l'excuse de minorité, par une décision motivée tenant aux circonstances et à la personnalité : le mineur encourt alors les mêmes peines qu'un adulte (au maximum 30 ans au lieu de la perpétuité)."
    type: nombre
    unite: ans
    bornes: [13, 18]
    valeurs:
      - depuis: "2025-10-31"
        valeur: 16
        sources: [sp-f1837]
    tags: [mineurs, peine, excuse_minorite]
    a_verifier: false
    note: "Date d'entrée en vigueur non établie ; valeur attestée au 2025-10-31 (service-public)."

  # ------------------------------------------------------------------ Garde à vue
  - id: justice_penale.garde_a_vue.duree_initiale
    titre: "Garde à vue : durée initiale"
    explication: "Une personne soupçonnée peut être retenue en garde à vue pendant 24 heures, à compter du moment où elle est retenue (interpellation, test d'alcoolémie, cellule de dégrisement…)."
    type: nombre
    unite: heures
    bornes: [0, 48]
    valeurs:
      - depuis: "2025-07-10"
        valeur: 24
        sources: [sp-f14837, cc-decision-2026-915-dc]
        article: "Code de procédure pénale, art. 63"
    tags: [garde_a_vue, procedure, libertes]
    a_verifier: false
    note: "Date d'entrée en vigueur non établie ; valeur attestée au 2025-07-10 (service-public), confirmée par le Conseil constitutionnel le 14/08/2026."

  - id: justice_penale.garde_a_vue.duree_max_droit_commun
    titre: "Garde à vue : durée maximale dans le cas général"
    explication: "La garde à vue peut être prolongée une fois de 24 heures par le procureur ou le juge d'instruction, si l'infraction est punie d'au moins 1 an de prison : 48 heures au total."
    type: nombre
    unite: heures
    bornes: [24, 96]
    valeurs:
      - depuis: "2025-07-10"
        valeur: 48
        sources: [sp-f14837, cc-decision-2026-915-dc]
        article: "Code de procédure pénale, art. 63"
    tags: [garde_a_vue, procedure, libertes]
    a_verifier: false
    note: "Date d'entrée en vigueur non établie ; valeur attestée au 2025-07-10 (service-public), confirmée par le Conseil constitutionnel le 14/08/2026."

  - id: justice_penale.garde_a_vue.duree_max_criminalite_organisee
    titre: "Garde à vue : durée maximale pour la criminalité organisée (trafic de drogue, meurtre en bande organisée…)"
    explication: "Pour les infractions les plus graves de la criminalité organisée, un juge peut prolonger la garde à vue jusqu'à 96 heures (4 jours) au total."
    type: nombre
    unite: heures
    bornes: [48, 144]
    valeurs:
      - depuis: "2025-01-22"
        valeur: 96
        sources: [senat-rapport-l24-253, sp-f14837, legi-cpp-706-88]
        article: "Code de procédure pénale, art. 706-88"
    tags: [garde_a_vue, procedure, criminalite_organisee, stupefiants]
    a_verifier: false
    note: "Date d'entrée en vigueur non établie ; valeur attestée au 2025-01-22 (rapport du Sénat n° 253), confirmée par service-public (10/07/2025). Pour les « mules » ayant ingéré de la drogue, une prolongation supplémentaire est possible jusqu'à 120 heures (service-public)."

  - id: justice_penale.garde_a_vue.duree_max_terrorisme
    titre: "Garde à vue : durée maximale en matière de terrorisme"
    explication: "En cas de risque sérieux d'action terroriste imminente ou pour les besoins de la coopération internationale, la garde à vue peut atteindre 144 heures (6 jours)."
    type: nombre
    unite: heures
    bornes: [48, 200]
    valeurs:
      - depuis: "2025-01-22"
        valeur: 144
        sources: [senat-rapport-l24-253, sp-f14837, legi-cpp-706-88]
        article: "Code de procédure pénale, art. 706-88-1"
    tags: [garde_a_vue, procedure, terrorisme]
    a_verifier: false
    note: "Date d'entrée en vigueur non établie ; valeur attestée au 2025-01-22 (rapport du Sénat n° 253 : « durée maximale prévue en l'état du droit français, fixée à 144 heures »), confirmée par service-public (10/07/2025). Le rapport du Sénat n° 601 (2026) mentionne « jusqu'à 120 heures » : divergence non retenue face aux deux autres sources officielles."

  - id: justice_penale.garde_a_vue.duree_max_delinquance_organisee_financiere
    titre: "Garde à vue : durée maximale pour la délinquance organisée « restreinte » (notamment économique et financière)"
    explication: "Depuis la loi RIPOST de 2026, pour les délits relevant du régime « restreint » de la délinquance organisée (fraudes et blanchiment en bande organisée, contrebande…), un juge peut ajouter 24 heures exceptionnelles : la garde à vue peut atteindre 72 heures."
    type: nombre
    unite: heures
    bornes: [48, 96]
    valeurs:
      - depuis: "2026-08-20"
        valeur: 72
        sources: [senat-tas25-164, cc-decision-2026-915-dc, senat-rapport-l25-601, legi-loi-2026-798]
        article: "Code de procédure pénale, art. 706-88-3 (créé par la loi n° 2026-798 du 18 août 2026)"
    tags: [garde_a_vue, procedure, criminalite_organisee, reforme_2026]
    a_verifier: true
    note: "Avant la réforme, la durée maximale pour ces infractions (art. 706-73-1 CPP) était de 48 heures (droit commun), selon le rapport du Sénat n° 601. Disposition déclarée conforme par la décision n° 2026-915 DC ; date du 20 août 2026 déduite de la publication de la loi au JO du 19 août 2026 (aucune entrée en vigueur différée dans le texte de la CMP), non confirmée par une fiche pratique officielle."

  # ------------------------------------------------------------------ Prescription de l'action publique
  - id: justice_penale.prescription.contraventions
    titre: "Délai pour poursuivre une contravention (prescription)"
    explication: "Passé 1 an après les faits, l'auteur d'une contravention ne peut plus être poursuivi."
    type: nombre
    unite: ans
    bornes: [0, 10]
    valeurs:
      - depuis: "2025-07-29"
        valeur: 1
        sources: [sp-f31982, legi-cpp-9]
        article: "Code de procédure pénale, art. 9"
    tags: [prescription, procedure, contravention]
    a_verifier: false
    note: "Date d'entrée en vigueur non établie ; valeur attestée au 2025-07-29 (service-public). Le délai peut être interrompu (actes d'enquête, du procureur, du juge) ou suspendu."

  - id: justice_penale.prescription.delits
    titre: "Délai pour poursuivre un délit (prescription)"
    explication: "En règle générale, l'auteur d'un délit (vol, violences, harcèlement…) ne peut plus être poursuivi 6 ans après les faits. Pour les infractions cachées, le délai part de leur découverte, sans pouvoir dépasser 12 ans après les faits."
    type: nombre
    unite: ans
    bornes: [0, 30]
    valeurs:
      - depuis: "2025-07-29"
        valeur: 6
        sources: [sp-f31982, legi-cpp-8]
        article: "Code de procédure pénale, art. 8"
    tags: [prescription, procedure, delit]
    a_verifier: false
    note: "Date d'entrée en vigueur non établie ; valeur attestée au 2025-07-29 (service-public). Délai butoir de 12 ans pour les délits occultes ou dissimulés ; diffamation et injure : 3 mois (1 an si discriminatoires)."

  - id: justice_penale.prescription.crimes
    titre: "Délai pour poursuivre un crime (prescription, cas général)"
    explication: "En règle générale, l'auteur d'un crime ne peut plus être poursuivi 20 ans après les faits. Pour les crimes cachés, le délai part de leur découverte, sans pouvoir dépasser 30 ans après les faits."
    type: nombre
    unite: ans
    bornes: [0, 50]
    valeurs:
      - depuis: "2025-07-29"
        valeur: 20
        sources: [sp-f31982, legi-cpp-7]
        article: "Code de procédure pénale, art. 7"
    tags: [prescription, procedure, crime]
    a_verifier: false
    note: "Date d'entrée en vigueur non établie ; valeur attestée au 2025-07-29 (service-public). Délai butoir de 30 ans pour les crimes occultes ou dissimulés."

  - id: justice_penale.prescription.crimes_graves
    titre: "Délai pour poursuivre certains crimes graves (terrorisme, trafic de drogue en bande organisée, crimes de guerre…)"
    explication: "Pour certains crimes particulièrement graves (terrorisme, trafic de stupéfiants en bande organisée, clonage, crimes de guerre, meurtre ou viol sur mineur…), le délai de prescription est porté à 30 ans."
    type: nombre
    unite: ans
    bornes: [0, 50]
    valeurs:
      - depuis: "2025-07-29"
        valeur: 30
        sources: [sp-f31982, legi-cpp-7]
        article: "Code de procédure pénale, art. 7"
    tags: [prescription, procedure, crime, terrorisme, stupefiants]
    a_verifier: false
    note: "Date d'entrée en vigueur non établie ; valeur attestée au 2025-07-29 (service-public)."

  - id: justice_penale.prescription.crimes_contre_humanite_imprescriptibles
    titre: "Les crimes contre l'humanité sont-ils imprescriptibles ?"
    explication: "Les crimes contre l'humanité peuvent être poursuivis sans limite de temps : ils ne se prescrivent jamais, et les peines prononcées non plus."
    type: booleen
    valeurs:
      - depuis: "2025-07-29"
        valeur: true
        sources: [sp-f31982, sp-f34645]
    tags: [prescription, procedure, crime, crimes_contre_humanite]
    a_verifier: false
    note: "Date d'entrée en vigueur non établie ; valeur attestée au 2025-07-29 (service-public)."

  - id: justice_penale.prescription.crimes_sexuels_mineurs
    titre: "Viol et autres crimes graves sur mineur : délai de prescription (compté à partir de la majorité)"
    explication: "Pour un viol (ou un meurtre, des tortures…) commis sur un mineur, la victime peut porter plainte pendant 30 ans à partir de ses 18 ans, donc jusqu'à ses 48 ans."
    type: nombre
    unite: ans
    bornes: [0, 50]
    valeurs:
      - depuis: "2025-07-29"
        valeur: 30
        sources: [sp-f31982, legi-cpp-7]
        article: "Code de procédure pénale, art. 7"
    tags: [prescription, mineurs, violences_sexuelles, victimes]
    a_verifier: false
    note: "Date d'entrée en vigueur non établie ; valeur attestée au 2025-07-29 (service-public). Le délai court à partir de la majorité de la victime."

  - id: justice_penale.prescription.delits_sexuels_mineurs
    titre: "Agression ou atteinte sexuelle sur mineur (délit) : délai de prescription (compté à partir de la majorité)"
    explication: "Pour une agression ou une atteinte sexuelle sur un mineur, la victime peut porter plainte pendant 10 ans à partir de ses 18 ans, donc jusqu'à ses 28 ans."
    type: nombre
    unite: ans
    bornes: [0, 30]
    valeurs:
      - depuis: "2025-07-29"
        valeur: 10
        sources: [sp-f31982, legi-cpp-8]
        article: "Code de procédure pénale, art. 8"
    tags: [prescription, mineurs, violences_sexuelles, victimes]
    a_verifier: false
    note: "Date d'entrée en vigueur non établie ; valeur attestée au 2025-07-29 (service-public). S'applique aussi à la corruption de mineur, la proposition sexuelle à un mineur par internet, la traite, etc."

  - id: justice_penale.prescription.delits_sexuels_mineurs_aggraves
    titre: "Délits sexuels aggravés sur mineur : délai de prescription (compté à partir de la majorité)"
    explication: "Pour les délits les plus graves commis sur un mineur (atteinte sexuelle aggravée, agression sexuelle avec violence, contrainte, menace ou surprise, violences aggravées avec plus de 8 jours d'incapacité), le délai est de 20 ans à partir de la majorité."
    type: nombre
    unite: ans
    bornes: [0, 30]
    valeurs:
      - depuis: "2025-07-29"
        valeur: 20
        sources: [sp-f31982, legi-cpp-8]
        article: "Code de procédure pénale, art. 8"
    tags: [prescription, mineurs, violences_sexuelles, victimes]
    a_verifier: false
    note: "Date d'entrée en vigueur non établie ; valeur attestée au 2025-07-29 (service-public)."

  - id: justice_penale.prescription.glissante_mineurs
    titre: "Prescription « glissante » pour les violences sexuelles sur mineurs"
    explication: "Si l'auteur d'un viol, d'une agression ou d'une atteinte sexuelle sur un mineur commet un nouveau fait de ce type sur un autre mineur avant la fin du délai, le délai de prescription du premier fait est prolongé jusqu'à celui du nouveau."
    type: booleen
    valeurs:
      - depuis: "2025-07-29"
        valeur: true
        sources: [sp-f31982]
    tags: [prescription, mineurs, violences_sexuelles, victimes]
    a_verifier: false
    note: "Date d'entrée en vigueur (loi de 2021) non établie sur une source lue ; mécanisme attesté au 2025-07-29 (service-public)."

  # ------------------------------------------------------------------ Prescription des peines
  - id: justice_penale.prescription_peine.contraventions
    titre: "Délai pour faire exécuter une peine de contravention"
    explication: "Une peine prononcée pour une contravention (amende par exemple) ne peut plus être exécutée 3 ans après que la condamnation est devenue définitive."
    type: nombre
    unite: ans
    bornes: [0, 10]
    valeurs:
      - depuis: "2025-11-28"
        valeur: 3
        sources: [sp-f32803, sp-f34645]
    tags: [prescription, execution_des_peines, contravention]
    a_verifier: false
    note: "Date d'entrée en vigueur non établie ; valeur attestée au 2025-11-28 pour les amendes (F32803), règle générale confirmée le 09/10/2026 (F34645). Le délai peut être interrompu par un acte d'exécution."

  - id: justice_penale.prescription_peine.delits
    titre: "Délai pour faire exécuter une peine pour délit"
    explication: "Une peine prononcée pour un délit ne peut plus être exécutée 6 ans après que la condamnation est devenue définitive (20 ans pour le terrorisme et le trafic de stupéfiants)."
    type: nombre
    unite: ans
    bornes: [0, 30]
    valeurs:
      - depuis: "2025-11-28"
        valeur: 6
        sources: [sp-f32803, sp-f34645]
    tags: [prescription, execution_des_peines, delit]
    a_verifier: false
    note: "Date d'entrée en vigueur non établie ; valeur attestée au 2025-11-28 pour les amendes (F32803), règle générale confirmée le 09/10/2026 (F34645). 20 ans pour les délits de terrorisme ou de trafic de stupéfiants."

  - id: justice_penale.prescription_peine.crimes
    titre: "Délai pour faire exécuter une peine pour crime"
    explication: "Une peine prononcée pour un crime ne peut plus être exécutée 20 ans après que la condamnation est devenue définitive (30 ans pour le terrorisme et le trafic de stupéfiants ; jamais de limite pour les crimes contre l'humanité)."
    type: nombre
    unite: ans
    bornes: [0, 50]
    valeurs:
      - depuis: "2025-11-28"
        valeur: 20
        sources: [sp-f32803, sp-f34645]
    tags: [prescription, execution_des_peines, crime]
    a_verifier: false
    note: "Date d'entrée en vigueur non établie ; valeur attestée au 2025-11-28 pour les amendes (F32803), règle générale confirmée le 09/10/2026 (F34645). 30 ans en matière de terrorisme ou de trafic de stupéfiants."

  # ------------------------------------------------------------------ Perpétuité et période de sûreté
  - id: justice_penale.periode_surete.perpetuite_max
    titre: "Période de sûreté maximale pour une condamnation à perpétuité (cas général)"
    explication: "Pendant la période de sûreté, le condamné ne peut obtenir ni libération conditionnelle ni aménagement. Pour une réclusion à perpétuité, elle peut aller jusqu'à 22 ans."
    type: nombre
    unite: ans
    bornes: [0, 30]
    valeurs:
      - depuis: "2026-09-11"
        valeur: 22
        sources: [sp-f35705]
    tags: [perpetuite, periode_surete, execution_des_peines]
    a_verifier: false
    note: "Date d'entrée en vigueur non établie ; valeur attestée au 2026-09-11 (service-public). Pour les peines à temps, la période de sûreté peut aller jusqu'à la moitié de la peine (2/3 dans les cas les plus graves). Elle peut être réduite par le tribunal de l'application des peines."

  - id: justice_penale.periode_surete.perpetuite_crimes_graves_max
    titre: "Période de sûreté maximale pour les crimes les plus graves punis de perpétuité"
    explication: "Pour les crimes les plus graves (par exemple un viol suivi de l'assassinat d'un enfant de moins de 15 ans), la période de sûreté d'une perpétuité peut être portée à 30 ans."
    type: nombre
    unite: ans
    bornes: [0, 40]
    valeurs:
      - depuis: "2026-09-11"
        valeur: 30
        sources: [sp-f35705]
    tags: [perpetuite, periode_surete, execution_des_peines]
    a_verifier: false
    note: "Date d'entrée en vigueur non établie ; valeur attestée au 2026-09-11 (service-public). La « perpétuité réelle » (période de sûreté illimitée) n'a pas été trouvée sur une source officielle lue et n'est pas modélisée ici."

  # ------------------------------------------------------------------ Amendes contraventionnelles
  - id: justice_penale.amende_contravention.classe_1_max
    titre: "Amende maximale pour une contravention de 1re classe"
    explication: "Les contraventions sont classées de la 1re (la moins grave) à la 5e classe. Une contravention de 1re classe est punie d'une amende de 38 € au maximum."
    type: nombre
    unite: euros
    bornes: [0, 200]
    valeurs:
      - depuis: "2025-09-03"
        valeur: 38
        sources: [justicefr-infractions-penales, legi-cp-131-13]
        article: "Code pénal, art. 131-13"
    tags: [amende, contravention, peine]
    a_verifier: false
    note: "Date d'entrée en vigueur non établie ; valeur attestée au 2025-09-03 (justice.fr)."

  - id: justice_penale.amende_contravention.classe_2_max
    titre: "Amende maximale pour une contravention de 2e classe"
    explication: "Une contravention de 2e classe est punie d'une amende de 150 € au maximum."
    type: nombre
    unite: euros
    bornes: [0, 500]
    valeurs:
      - depuis: "2025-09-03"
        valeur: 150
        sources: [justicefr-infractions-penales, legi-cp-131-13]
        article: "Code pénal, art. 131-13"
    tags: [amende, contravention, peine]
    a_verifier: false
    note: "Date d'entrée en vigueur non établie ; valeur attestée au 2025-09-03 (justice.fr)."

  - id: justice_penale.amende_contravention.classe_3_max
    titre: "Amende maximale pour une contravention de 3e classe"
    explication: "Une contravention de 3e classe (par exemple le tapage nocturne) est punie d'une amende de 450 € au maximum."
    type: nombre
    unite: euros
    bornes: [0, 1000]
    valeurs:
      - depuis: "2025-09-03"
        valeur: 450
        sources: [justicefr-infractions-penales, legi-cp-131-13]
        article: "Code pénal, art. 131-13"
    tags: [amende, contravention, peine]
    a_verifier: false
    note: "Date d'entrée en vigueur non établie ; valeur attestée au 2025-09-03 (justice.fr)."

  - id: justice_penale.amende_contravention.classe_4_max
    titre: "Amende maximale pour une contravention de 4e classe"
    explication: "Une contravention de 4e classe (par exemple jeter ses déchets sur la voie publique, la plupart des excès de vitesse) est punie d'une amende de 750 € au maximum."
    type: nombre
    unite: euros
    bornes: [0, 1500]
    valeurs:
      - depuis: "2025-09-03"
        valeur: 750
        sources: [justicefr-infractions-penales, legi-cp-131-13]
        article: "Code pénal, art. 131-13"
    tags: [amende, contravention, peine]
    a_verifier: false
