  - id: justice_penale.liberation_conditionnelle.perpetuite_primaire
    titre: "Libération conditionnelle d'un condamné à perpétuité (non récidiviste) : durée minimale de détention"
    explication: "Une personne condamnée à la prison à vie peut demander une libération conditionnelle après 18 ans de détention si elle n'était pas récidiviste (hors période de sûreté plus longue)."
