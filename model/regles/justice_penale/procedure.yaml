        article: "Code de procédure pénale, art. 720"
    tags: [liberation_sous_contrainte, execution_des_peines, prison]
    a_verifier: false
    note: "Date d'entrée en vigueur non établie ; valeur attestée au 2026-04-27 (service-public)."

  # ------------------------------------------------------------------ Travail d'intérêt général
  - id: justice_penale.tig.duree_min
    titre: "Travail d'intérêt général (TIG) : durée minimale"
    explication: "Le TIG est un travail non payé au service de la collectivité, accepté par le condamné. Sa durée minimale est de 20 heures."
    type: nombre
    unite: heures
    bornes: [0, 100]
    valeurs:
      - depuis: "2026-08-07"
