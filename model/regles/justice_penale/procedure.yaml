  - id: justice_penale.liberation_conditionnelle.perpetuite_recidive
    titre: "Libération conditionnelle d'un condamné à perpétuité récidiviste : durée minimale de détention"
    explication: "Un condamné à la prison à vie en état de récidive peut demander une libération conditionnelle après 22 ans de détention."
    type: nombre
