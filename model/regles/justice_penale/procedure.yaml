  # ------------------------------------------------------------------ Libération conditionnelle
  - id: justice_penale.liberation_conditionnelle.part_peine_executee
    titre: "Libération conditionnelle : part de la peine à effectuer avant de pouvoir la demander"
    explication: "Un détenu peut demander une libération conditionnelle après avoir effectué au moins la moitié de sa peine, s'il fait des efforts sérieux de réinsertion (travail, soins, indemnisation des victimes…)."
    type: nombre
