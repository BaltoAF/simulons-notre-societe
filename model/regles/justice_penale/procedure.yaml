        article: "Code pénal, art. 131-8"
    tags: [tig, peine_alternative]
    a_verifier: false
    note: "Date d'entrée en vigueur non établie ; valeur attestée au 2026-08-07 (service-public). Le TIG doit être effectué dans un délai de 18 mois au plus."

  - id: justice_penale.tig.duree_max_delit
    titre: "Travail d'intérêt général (TIG) : durée maximale pour un délit"
    explication: "Pour un délit, le TIG peut aller jusqu'à 400 heures (120 heures pour une contravention de 5e classe)."
    type: nombre
    unite: heures
    bornes: [0, 1000]
    valeurs:
