    a_verifier: false
    note: "Date d'entrée en vigueur non établie ; valeur attestée au 2026-08-07 (service-public). Contravention de 5e classe : 20 à 120 heures."

  # ------------------------------------------------------------------ Détention provisoire
  - id: justice_penale.detention_provisoire.delit_duree_initiale
    titre: "Détention provisoire pour un délit : durée initiale"
    explication: "Une personne mise en examen pour un délit puni d'au moins 3 ans de prison peut être placée en détention avant son procès pour 4 mois, renouvelables (6 mois pour le terrorisme et le narcotrafic)."
    type: nombre
    unite: mois
    bornes: [0, 24]
    valeurs:
      - depuis: "2026-07-28"
        valeur: 4
        sources: [sp-f1042, legi-cpp-137]
    tags: [detention_provisoire, procedure, libertes]
    a_verifier: false
    note: "Date d'entrée en vigueur non établie ; valeur attestée au 2026-07-28 (service-public)."

  - id: justice_penale.detention_provisoire.delit_duree_max
    titre: "Détention provisoire pour un délit : durée maximale (cas général)"
    explication: "Pour un délit, la détention provisoire ne peut en principe pas dépasser 1 an au total ; jusqu'à 2 ans pour les affaires les plus graves (trafic de stupéfiants, bande organisée, faits commis à l'étranger, terrorisme)."
    type: nombre
    unite: ans
    bornes: [0, 5]
    valeurs:
      - depuis: "2026-07-28"
        valeur: 1
        sources: [sp-f1042, legi-cpp-137]
    tags: [detention_provisoire, procedure, libertes]
    a_verifier: false
    note: "Date d'entrée en vigueur non établie ; valeur attestée au 2026-07-28 (service-public). 2 ans dans les cas aggravés (2 ans et 4 mois sur décision exceptionnelle de la chambre de l'instruction, sauf narcotrafic) ; 3 ans pour l'association de malfaiteurs terroriste."

  - id: justice_penale.detention_provisoire.crime_duree_initiale
    titre: "Détention provisoire pour un crime : durée initiale"
    explication: "Pour un crime, la détention provisoire est d'abord ordonnée pour 1 an, puis peut être prolongée par périodes de 6 mois."
    type: nombre
    unite: ans
    bornes: [0, 5]
    valeurs:
