  - id: justice_penale.corruption_privee.prison_max
    titre: "Corruption privée : peine maximale de prison"
    explication: "La corruption entre personnes privées (par exemple un salarié qui accepte un pot-de-vin d'un fournisseur) est punie de 5 ans de prison et 500 000 € d'amende."
    type: nombre
    unite: ans
