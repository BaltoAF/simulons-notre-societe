domaine: justice_penale
theme: "Délinquance économique et financière"
regles:
  # --- Fraude fiscale ---
  - id: justice_penale.fraude_fiscale.prison_max
    titre: "Fraude fiscale : peine maximale de prison"
    explication: "Se soustraire volontairement à l'impôt (ne pas déclarer, dissimuler des sommes…) est un délit. En plus des pénalités fiscales, le fraudeur risque jusqu'à 5 ans de prison."
    type: nombre
    unite: ans
    bornes: [0, 10]
    valeurs:
      - depuis: "2019-06-27"
        valeur: 5
        sources: [bofip-boi-cf-inf-40-10-10-50, sp-f31451, legi-cgi-1741]
        article: "Code général des impôts, art. 1741"
    tags: [peine, delit, fraude_fiscale, impots, economie]
    a_verifier: false
    note: "Les poursuites pénales sont engagées après avis de la Commission des infractions fiscales. Peine de prison réduite de moitié pour l'auteur qui aide à identifier les autres auteurs. Date d'entrée en vigueur non établie ; valeur attestée au 2019-06-27 (version du BOFiP)."

  - id: justice_penale.fraude_fiscale.amende_max
    titre: "Fraude fiscale : amende pénale maximale (montant fixe)"
    explication: "Le fraudeur risque une amende pénale de 500 000 € au maximum, en plus des majorations fiscales (jusqu'à 80 % en cas de manœuvres frauduleuses). Ce plafond peut être dépassé : voir l'amende proportionnelle au produit de la fraude."
    type: nombre
    unite: euros
    bornes: [0, 5000000]
    valeurs:
      - depuis: "2019-06-27"
        valeur: 500000
        sources: [bofip-boi-cf-inf-40-10-10-50, sp-f31451, legi-cgi-1741]
        article: "Code général des impôts, art. 1741"
    tags: [peine, amende, delit, fraude_fiscale, impots, economie]
    a_verifier: false
    note: "Date d'entrée en vigueur non établie ; valeur attestée au 2019-06-27 (version du BOFiP)."

  - id: justice_penale.fraude_fiscale.amende_multiple_du_produit
    titre: "Fraude fiscale : amende portée jusqu'à un multiple du produit de la fraude"
    explication: "Le juge peut porter l'amende jusqu'au double de ce que la fraude a rapporté, si ce montant dépasse le plafond fixe."
    type: nombre
    unite: ratio
    bornes: [0, 10]
    valeurs:
      - depuis: "2018-10-23"
        valeur: 2
        sources: [bofip-boi-cf-inf-40-10-10-50, legi-cgi-1741]
        article: "Code général des impôts, art. 1741 (loi n° 2018-898 du 23 octobre 2018, art. 23)"
    tags: [peine, amende, fraude_fiscale, impots, economie]
    a_verifier: false
    note: "Date retenue : celle de la loi n° 2018-898 du 23 octobre 2018 relative à la lutte contre la fraude ; date exacte d'entrée en vigueur non lue. Vaut aussi pour la fraude aggravée."

  - id: justice_penale.fraude_fiscale_aggravee.prison_max
    titre: "Fraude fiscale aggravée : peine maximale de prison"
    explication: "La fraude est aggravée si elle est commise en bande organisée ou grâce à des comptes ou sociétés écrans à l'étranger, une fausse identité, de faux documents ou une domiciliation fictive à l'étranger. La prison encourue monte alors à 7 ans."
    type: nombre
    unite: ans
    bornes: [0, 10]
    valeurs:
      - depuis: "2013-12-08"
        valeur: 7
        sources: [bofip-boi-cf-inf-40-10-10-50, sp-f31451, legi-cgi-1741]
        article: "Code général des impôts, art. 1741 (loi n° 2013-1117 du 6 décembre 2013)"
    tags: [peine, delit, fraude_fiscale, impots, economie]
    a_verifier: false
    note: "Le BOFiP indique que ces peines s'appliquent aux faits commis à compter du 8 décembre 2013, date d'entrée en vigueur de la loi n° 2013-1117. Avant, deux circonstances aggravantes distinctes existaient (fausse facturation : 5 ans et 750 000 € ; lien avec les paradis fiscaux : 7 ans et 1 000 000 €)."

  - id: justice_penale.fraude_fiscale_aggravee.amende_max
    titre: "Fraude fiscale aggravée : amende pénale maximale (montant fixe)"
    explication: "En cas de fraude fiscale aggravée, l'amende pénale peut atteindre 3 millions d'euros (ou le double du produit de la fraude s'il est plus élevé)."
    type: nombre
    unite: euros
    bornes: [0, 10000000]
    valeurs:
      - depuis: "2013-12-08"
        valeur: 2000000
        sources: [bofip-boi-cf-inf-40-10-10-50]
        article: "Code général des impôts, art. 1741 (loi n° 2013-1117 du 6 décembre 2013)"
      - depuis: "2018-01-01"
        valeur: 3000000
        sources: [bofip-boi-cf-inf-40-10-10-50, sp-f31451, legi-cgi-1741]
        article: "Code général des impôts, art. 1741 (loi n° 2017-1837 du 30 décembre 2017 de finances pour 2018)"
    tags: [peine, amende, delit, fraude_fiscale, impots, economie]
    a_verifier: false
    note: "Montant de 2013 écrit « 2 000 0000 € » (coquille) dans un paragraphe du BOFiP, mais confirmé à 2 000 000 € dans le paragraphe suivant (« de 2 000 000 € à 3 000 000 € »). Le passage à 3 000 000 € s'applique aux faits commis à compter du 1er janvier 2018."

  - id: justice_penale.fraude_fiscale.prescription_ans
    titre: "Fraude fiscale : délai de prescription des poursuites pénales"
    explication: "Les poursuites pénales pour fraude fiscale peuvent être engagées pendant 6 ans, à compter de l'année qui suit l'infraction."
    type: nombre
    unite: ans
    bornes: [0, 12]
    valeurs:
      - depuis: "2026-07-02"
        valeur: 6
        sources: [sp-f31451, legi-lpf-l227]
        article: "Livre des procédures fiscales, art. L227 à L233"
    tags: [prescription, fraude_fiscale, impots, economie]
    a_verifier: false
    note: "Date d'entrée en vigueur non établie ; valeur attestée au 2026-07-02. Le contrôle des documents comptables peut porter sur 10 ans."

  # --- Atteintes à la probité ---
  - id: justice_penale.corruption_agent_public.prison_max
    titre: "Corruption d'un agent public (active ou passive) : peine maximale de prison"
    explication: "Offrir un avantage à un agent public pour qu'il agisse ou s'abstienne (corruption active), ou l'accepter quand on est agent public (corruption passive), est puni de 10 ans de prison."
    type: nombre
    unite: ans
    bornes: [0, 10]
    valeurs:
      - depuis: "2026-10-13"
        valeur: 10
        sources: [afa-lexique]
        article: "Code pénal, art. 432-11 et s., 433-1 et s."
    tags: [peine, delit, corruption, probite, economie]
    a_verifier: false
    note: "Lu sur le lexique de l'AFA (page non datée, consultée via WebFetch). Date d'entrée en vigueur non établie ; valeur attestée au 2026-10-13."

