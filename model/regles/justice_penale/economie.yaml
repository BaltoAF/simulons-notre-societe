  - id: justice_penale.prise_illegale_interets.prison_max
    titre: "Prise illégale d'intérêts : peine maximale de prison"
    explication: "Un élu ou un agent public qui garde un intérêt personnel dans une affaire qu'il surveille ou gère, au point de compromettre son impartialité, risque 5 ans de prison."
    type: nombre
    unite: ans
    bornes: [0, 10]
    valeurs:
