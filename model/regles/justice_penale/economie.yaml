  # --- Justice négociée ---
  - id: justice_penale.cjip.amende_max_pourcent_ca
    titre: "Convention judiciaire d'intérêt public (CJIP) : plafond de l'amende en % du chiffre d'affaires"
    explication: "Une entreprise poursuivie pour corruption, trafic d'influence, fraude fiscale ou blanchiment peut éviter un procès en signant une CJIP. Elle paie alors une amende d'intérêt public, proportionnée aux avantages tirés des faits, qui peut aller jusqu'à 30 % de son chiffre d'affaires annuel."
    type: nombre
    unite: pourcent
    bornes: [0, 50]
    valeurs:
      - depuis: "2016-12-09"
        valeur: 30
        sources: [justice-cjip-ressources]
        article: "Code de procédure pénale, art. 41-1-2 (loi « Sapin II » du 9 décembre 2016)"
    tags: [cjip, entreprises, corruption, fraude_fiscale, procedure, economie]
    a_verifier: false
    note: "Date retenue : celle de la loi du 9 décembre 2016 dite « Sapin II » qui a créé la CJIP (entrée en vigueur exacte non lue). La CJIP peut aussi imposer un programme de mise en conformité de 3 ans maximum sous le contrôle de l'AFA. Un mécanisme similaire existe depuis la loi du 24 décembre 2020 pour les délits environnementaux (art. 41-1-3)."

  # --- Blanchiment, abus de biens sociaux (sources d'appoint) ---
  - id: justice_penale.blanchiment_aggrave.prison_max
    titre: "Blanchiment aggravé : peine maximale de prison"
    explication: "Le blanchiment consiste à faire entrer de l'argent issu d'une infraction dans l'économie légale pour en cacher l'origine. Dans sa forme aggravée (article 324-2 du code pénal), il est puni de 10 ans de prison et 750 000 € d'amende."
    type: nombre
    unite: ans
    bornes: [0, 10]
    valeurs:
      - depuis: "2025-06-18"
        valeur: 10
        sources: [verif-senat-rap-757-2025, wikipedia-blanchiment-argent]
        article: "Code pénal, art. 324-2"
    tags: [peine, delit, blanchiment, economie]
    a_verifier: false
    note: "Vérifié le 2026-10-13 : le rapport de la commission d'enquête du Sénat sur la délinquance financière (n° 757, juin 2025) indique pour le blanchiment (art. 324-1 et suivants) 5 ans d'emprisonnement « (10 ans si aggravé, notamment en bande organisée) » et 375 000 € d'amende. L'amende de 750 000 € du blanchiment aggravé n'est attestée que par Wikipédia. Rédaction consolidée non lue (Légifrance inaccessible). Date d'entrée en vigueur non établie ; valeur attestée au 2025-06-18."

  - id: justice_penale.abus_biens_sociaux.prison_max
    titre: "Abus de biens sociaux : peine maximale de prison"
    explication: "Un dirigeant de société qui utilise de mauvaise foi les biens ou le crédit de la société à des fins personnelles commet un abus de biens sociaux, puni de 5 ans de prison."
    type: nombre
    unite: ans
    bornes: [0, 10]
    valeurs:
      - depuis: "2026-06-14"
        valeur: 5
        sources: [wikipedia-abus-de-biens-sociaux, verif-senat-rap-722-2013, verif-justice-circ-2014-01-23]
        article: "Code de commerce, art. L241-3 et L242-6"
    tags: [peine, delit, abus_de_biens_sociaux, entreprises, economie]
    a_verifier: true
    note: "Valeur attestée par une source officielle ancienne : rapport du Sénat n° 722 (3 juillet 2013) : l'abus de biens sociaux « fait déjà encourir à son auteur une peine de cinq ans de prison et 375 000 euros d'amende ». La loi n° 2013-1117 du 6 décembre 2013 a créé une forme aggravée (7 ans et 500 000 €, montages à l'étranger) selon la circulaire Justice du 23 janvier 2014. Aucune source officielle postérieure à 2014 trouvée le 2026-10-13 (Légifrance inaccessible ; economie.gouv.fr bloqué ; recherches Sénat, Assemblée nationale, Conseil constitutionnel, justice.gouv.fr infructueuses). Date d'entrée en vigueur non établie ; valeur attestée au 2026-06-14 par Wikipédia."

  - id: justice_penale.abus_biens_sociaux.amende_max
    titre: "Abus de biens sociaux : amende maximale"
    explication: "L'abus de biens sociaux est puni d'une amende pouvant aller jusqu'à 375 000 €."
    type: nombre
    unite: euros
    bornes: [0, 1000000]
    valeurs:
      - depuis: "2026-06-14"
        valeur: 375000
        sources: [wikipedia-abus-de-biens-sociaux, verif-senat-rap-722-2013, verif-justice-circ-2014-01-23]
        article: "Code de commerce, art. L241-3 et L242-6"
    tags: [peine, amende, delit, abus_de_biens_sociaux, entreprises, economie]
    a_verifier: true
    note: "Valeur attestée par une source officielle ancienne : rapport du Sénat n° 722 (3 juillet 2013) : cinq ans de prison et 375 000 euros d'amende. Forme aggravée créée par la loi n° 2013-1117 du 6 décembre 2013 (7 ans et 500 000 €). Aucune source officielle postérieure à 2014 trouvée le 2026-10-13 (Légifrance inaccessible ; economie.gouv.fr bloqué ; recherches Sénat, Assemblée nationale, Conseil constitutionnel, justice.gouv.fr infructueuses). Date d'entrée en vigueur non établie ; valeur attestée au 2026-06-14 par Wikipédia."
