    tags: [peine, delit, prise_illegale_interets, probite, elus, economie]
    a_verifier: false
    note: "Selon le lexique de l'AFA, la loi n° 2025-1249 du 22 décembre 2025 a modifié la définition de l'intérêt pris en compte (exclusion notamment de l'intérêt public et de cas d'« impérieux motif d'intérêt général ») ; aucun changement de peine n'y est signalé. Lu via WebFetch. Date d'entrée en vigueur non établie ; valeur attestée au 2026-10-13."

