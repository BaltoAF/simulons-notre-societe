domaine: droit_civil
theme: "Successions et libéralités"
regles:
  # ---------------------------------------------------------------- réserve héréditaire
  - id: droit_civil.reserve_hereditaire.un_enfant
    titre: "Réserve héréditaire avec 1 enfant (part minimale revenant à l'enfant)"
    explication: "Avec un enfant, la moitié du patrimoine lui revient obligatoirement ; on ne peut donner ou léguer librement que l'autre moitié (la « quotité disponible »)."
    type: nombre
    unite: pourcent
    bornes: [0, 100]
    valeurs:
      - depuis: "2026-09-15"
        valeur: 50
        sources: [sp-f606, legi-cc-912]
        article: "Code civil, art. 912 à 917"
    tags: [succession, heritage, enfants, reserve_hereditaire]
    a_verifier: false
    note: "Fraction légale : 1/2 ; quotité disponible : 1/2. Règle applicable quand la loi française régit la succession. Date d'entrée en vigueur non établie ; valeur attestée au 2026-09-15."

  - id: droit_civil.reserve_hereditaire.deux_enfants
    titre: "Réserve héréditaire avec 2 enfants (part minimale revenant aux enfants)"
    explication: "Avec deux enfants, les deux tiers du patrimoine leur reviennent obligatoirement ; le tiers restant peut être donné ou légué librement."
    type: nombre
    unite: pourcent
    bornes: [0, 100]
    valeurs:
      - depuis: "2026-09-15"
        valeur: 66.67
        sources: [sp-f606, legi-cc-912]
        article: "Code civil, art. 912 à 917"
    tags: [succession, heritage, enfants, reserve_hereditaire]
    a_verifier: false
    note: "Fraction légale exacte : 2/3 (66,67 % arrondi) ; quotité disponible : 1/3. Date d'entrée en vigueur non établie ; valeur attestée au 2026-09-15."

  - id: droit_civil.reserve_hereditaire.trois_enfants_et_plus
    titre: "Réserve héréditaire avec 3 enfants ou plus (part minimale revenant aux enfants)"
    explication: "À partir de trois enfants, les trois quarts du patrimoine leur reviennent obligatoirement, à parts égales ; seul le quart restant peut être donné ou légué librement."
    type: nombre
    unite: pourcent
    bornes: [0, 100]
    valeurs:
      - depuis: "2026-09-15"
        valeur: 75
        sources: [sp-f606, sp-f1270, legi-cc-912]
        article: "Code civil, art. 912 à 917"
    tags: [succession, heritage, enfants, reserve_hereditaire]
    a_verifier: false
    note: "Fraction légale : 3/4 ; quotité disponible : 1/4 (exemple service-public : 200 000 € et 3 enfants → 50 000 € par enfant, 50 000 € librement attribuables). Date d'entrée en vigueur non établie ; valeur attestée au 2026-09-15."

  - id: droit_civil.reserve_hereditaire.conjoint_sans_descendant
    titre: "Réserve du conjoint survivant quand le défunt n'a pas d'enfant"
    explication: "Si le défunt marié n'a ni enfant ni descendant, son époux ou épouse a droit au minimum à un quart du patrimoine, même en présence d'un testament contraire."
    type: nombre
    unite: pourcent
    bornes: [0, 100]
    valeurs:
      - depuis: "2026-09-15"
        valeur: 25
        sources: [sp-f606, legi-cc-912]
        article: "Code civil, art. 912 à 917"
    tags: [succession, conjoint, reserve_hereditaire]
    a_verifier: false
    note: "Tableau sp-f606 : « Aucun enfant – défunt marié : réserve 1/4 (conjoint), quotité disponible 3/4 » ; défunt non marié sans enfant : aucune réserve. Le partenaire de Pacs et le concubin n'ont aucun droit légal dans la succession. Date d'entrée en vigueur non établie ; valeur attestée au 2026-09-15."

  # ---------------------------------------------------------------- conjoint survivant
  - id: droit_civil.conjoint_survivant.part_pleine_propriete_avec_enfants
    titre: "Part du conjoint survivant en présence d'enfants (en pleine propriété)"
    explication: "Quand le défunt laisse des enfants, son époux ou épouse hérite d'un quart de la succession en pleine propriété. Si tous les enfants sont communs au couple, il peut à la place choisir l'usufruit de la totalité."
    type: nombre
    unite: pourcent
    bornes: [0, 100]
    valeurs:
      - depuis: "2026-10-05"
        valeur: 25
        sources: [sp-f1270, legi-cc-756]
        article: "Code civil, art. 756 à 758-6"
    tags: [succession, conjoint, heritage]
    a_verifier: false
    note: "Hors donation au dernier vivant ou testament. En présence d'enfants non communs : 1/4 en pleine propriété obligatoirement. Date d'entrée en vigueur non établie ; valeur attestée au 2026-10-05."

  - id: droit_civil.conjoint_survivant.option_usufruit_total_enfants_communs
    titre: "Conjoint survivant : option pour l'usufruit de toute la succession si tous les enfants sont communs"
    explication: "Si le défunt ne laisse que des enfants du couple, l'époux survivant peut choisir de garder l'usage et les revenus de tous les biens (usufruit) au lieu d'un quart en pleine propriété."
    type: booleen
    valeurs:
      - depuis: "2026-10-05"
        valeur: true
        sources: [sp-f1270, legi-cc-756]
        article: "Code civil, art. 756 à 758-6"
    tags: [succession, conjoint, usufruit]
    a_verifier: false
    note: "Les enfants reçoivent alors la nue-propriété de toute la succession. Date d'entrée en vigueur non établie ; valeur attestée au 2026-10-05."

  - id: droit_civil.conjoint_survivant.delai_option
    titre: "Conjoint survivant : délai pour choisir entre usufruit total et quart en propriété"
    explication: "Si un héritier le lui demande par écrit, l'époux survivant doit faire son choix dans ce délai ; à défaut, il est réputé avoir choisi l'usufruit de la totalité."
    type: nombre
    unite: mois
    bornes: [1, 12]
    valeurs:
      - depuis: "2026-10-05"
        valeur: 3
        sources: [sp-f1270, legi-cc-756]
        article: "Code civil, art. 756 à 758-6"
    tags: [succession, conjoint, delai]
    a_verifier: false
    note: "S'il décède sans avoir choisi, il est réputé avoir opté pour l'usufruit. Date d'entrée en vigueur non établie ; valeur attestée au 2026-10-05."

  # ---------------------------------------------------------------- testament
  - id: droit_civil.testament.age_minimum
    titre: "Âge minimal pour faire un testament"
    explication: "On peut rédiger un testament à partir de 16 ans, mais un mineur non émancipé ne peut alors léguer qu'une partie de ses biens."
    type: nombre
    unite: ans
    bornes: [14, 18]
    valeurs:
      - depuis: "2026-10-05"
        valeur: 16
        sources: [sp-f770, legi-cc-901]
        article: "Code civil, art. 901 à 911"
    tags: [testament, mineurs, succession]
    a_verifier: false
    note: "Condition formulée : « être majeur ou mineur de plus de 16 ans ». Date d'entrée en vigueur non établie ; valeur attestée au 2026-10-05."

  - id: droit_civil.testament.part_leguable_mineur
    titre: "Part maximale du patrimoine qu'un mineur de 16 à 18 ans peut léguer"
    explication: "Entre 16 et 18 ans, un mineur non émancipé ne peut léguer par testament que la moitié de ses biens."
    type: nombre
    unite: pourcent
    bornes: [0, 100]
    valeurs:
      - depuis: "2026-10-05"
        valeur: 50
        sources: [sp-f770, legi-cc-901]
        article: "Code civil, art. 901 à 911"
    tags: [testament, mineurs, succession]
    a_verifier: false
    note: "Ne s'applique pas au mineur émancipé. Date d'entrée en vigueur non établie ; valeur attestée au 2026-10-05."
