# Retraite des salariés du privé (régime général de base + Agirc-Arrco) : règles en vigueur au 13 octobre 2026.
#
# ÉTAT DE LA RÉFORME DE 2023 AU 13/10/2026
# - La réforme de 2023 (loi n° 2023-270 du 14 avril 2023, art. 10) relève l'âge légal de 62 à 64 ans et accélère
#   la hausse de la durée d'assurance (172 trimestres), pour les pensions prenant effet depuis le 1er septembre 2023.
# - La LFSS 2026 (loi n° 2025-1403 du 30 décembre 2025, art. 105) « suspend » sa montée en charge : la génération 1964
#   et les assurés nés du 1er janvier au 31 mars 1965 restent à 62 ans et 9 mois / 170 trimestres, puis la hausse reprend
#   (3 mois par génération) avec un trimestre de décalage. L'âge de 64 ans est atteint pour la génération 1969 (au lieu
#   de 1968) et la durée de 172 trimestres pour la génération 1966 (au lieu de 1965).
# - Applicable aux pensions prenant effet à compter du 1er septembre 2026 (décrets n° 2026-344 et 2026-345 du 7 mai 2026,
#   JO du 8 mai 2026). Les pensions liquidées avant cette date restent aux paramètres de 2023.
# - Les âges sont exprimés en années décimales : 62,25 = 62 ans et 3 mois ; 62,75 = 62 ans et 9 mois.
#
# Convention : pour les générations dont les paramètres n'ont pas changé en 2023, « depuis » = 1er septembre 2023
# lorsque la seule source lue est la circulaire Cnav 2024-25 (qui confirme la valeur pour les pensions prenant effet
# depuis cette date) ; la règle est plus ancienne (réformes de 2010 et 2014). C'est signalé dans la note.
domaine: retraites
theme: "Régime général et retraite complémentaire des salariés"
regles:
  # ───────── Réforme 2023 : état de la suspension ─────────
  - id: retraites.reforme_2023.suspension_en_vigueur
    titre: "Suspension de la montée en charge de la réforme des retraites de 2023"
    explication: "Depuis le 1er septembre 2026, la hausse de l'âge légal et de la durée de cotisation prévue en 2023 est décalée d'un trimestre : les personnes nées en 1964 et début 1965 peuvent partir à 62 ans et 9 mois avec 170 trimestres."
    type: booleen
    unite: ""
    valeurs:
      - depuis: "2026-09-01"
        valeur: true
        sources: [cor-ra-2026-ch2, an-qe-15271, sp-f35063, lar-age-depart]
        article: "Loi n° 2025-1403 du 30 décembre 2025 (LFSS 2026), art. 105 ; décrets n° 2026-344 et 2026-345 du 7 mai 2026"
    tags: [reforme_2023, age_legal, duree_assurance]
    a_verifier: false
    note: "La suspension ne supprime pas la réforme : elle décale son calendrier. Elle concerne aussi les fonctionnaires (catégories sédentaires et actives) et les départs anticipés pour incapacité permanente, et aménage la carrière longue. Selon la Cnav (circulaire de mars 2026 citée par la presse), un nouveau texte doit fixer les règles applicables après 2027 ; non vérifié ici."

