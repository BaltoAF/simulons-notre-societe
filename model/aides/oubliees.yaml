# « Avez-vous pensé à… ? » : des aides que beaucoup de gens ne demandent pas, proposées selon le profil saisi dans « Mes droits ».
# Fiches établies par l'agent de recherche du Système le 30/10/2026 à partir des fiches Service-Public (sources dans
# model/sources/aides_oubliees.yaml). Ce sont des pistes : le site ne calcule pas lui-même les aides marquées sans « calculee ».
#
# criteres : quand proposer l'aide (tous les critères d'un bloc doivent être remplis ; « ou » liste des blocs alternatifs).
#   calculee: <id>          le moteur a calculé un montant positif pour cette prestation
#   activite: [..]          un adulte du foyer a l'une de ces situations (les critères d'âge et de salaire portent sur lui)
#   age_min / age_max       âge de cet adulte : au moins age_min, moins de age_max
#   salaire_max             revenu net mensuel de cet adulte au plus
#   seul: true              un seul adulte dans le foyer
#   enfant_age: [min, max]  au moins un enfant de min à max ans
#   logement: [..]          type de logement du foyer
#   ressources_c2s_max      ressources mensuelles du foyer sous ce plafond (personne seule), multiplié selon la taille du foyer
#   rfr_par_uc_max          revenu fiscal de référence annuel estimé, par unité de consommation, sous ce plafond
#   hors_rattaches: true    pas pour un étudiant seul rattaché à la déclaration de ses parents (ses revenus ne disent rien du foyer)
# rappel : une phrase de plus quand ses propres critères sont remplis (ex. un enfant de 16 à 18 ans pour l'ARS) ;
#   ton: rassurant pour lever une crainte (affiché en vert).
# versement: annuel        le montant calculé est affiché par an (l'ARS est versée une fois, à la rentrée).
aides:
  - id: prime_activite
    nom: "Prime d'activité"
    en_bref: "Un complément de revenu, chaque mois, pour les personnes qui travaillent avec un salaire modeste."
    pourquoi_vous: "Le site a calculé que votre foyer y a droit."
    pour_qui: "Personnes de 18 ans ou plus qui travaillent (salariés, fonctionnaires, indépendants) avec des revenus modestes : elle n'est plus versée au-delà d'environ 2 000 € nets par mois pour une personne seule. Les étudiants et apprentis y ont droit s'ils gagnent plus de 1 144 € par mois."
    ce_que_ca_apporte: "Un versement chaque mois, calculé à partir d'un montant de base de 638,28 € pour une personne seule depuis le 1er avril 2026."
    ou_la_demander: "En ligne sur caf.fr (ou msa.fr pour les agriculteurs), après le simulateur. Ensuite, une déclaration tous les trois mois, déjà préremplie, à valider."
    url_officielle: "https://www.service-public.gouv.fr/particuliers/vosdroits/F2882"
    non_recours: "Un foyer sur deux qui y a droit ne la touche pas (fin 2021)."
    non_recours_source: drees-er1379-non-recours-prime-activite-2021
    source_id: sp-f2882
    sources_complementaires: [sp-a18815, cnaf-it-2026-157]
    criteres: { calculee: prime_activite }

  - id: aspa
    nom: "Minimum vieillesse (Aspa)"
    en_bref: "Un complément pour que les personnes âgées aux faibles ressources atteignent 1 043,59 € par mois (personne seule)."
    pourquoi_vous: "Le site a calculé que votre foyer y a droit."
    pour_qui: "Personnes de 65 ans ou plus (62 ans en cas d'inaptitude, de handicap ou de carrière longue) qui vivent en France avec de faibles ressources, retraitées ou non."
    ce_que_ca_apporte: "Un complément qui porte les ressources jusqu'à 1 043,59 € par mois pour une personne seule (1 620,18 € pour un couple). Beaucoup y renoncent par peur pour leurs héritiers : les sommes versées ne sont reprises sur la succession qu'au-delà de 108 586 € (métropole)."
    ou_la_demander: "Auprès de la caisse qui verse votre retraite (Carsat, MSA…). Sans retraite : à la mairie. Téléphone : 39 60."
    url_officielle: "https://www.service-public.gouv.fr/particuliers/vosdroits/F16871"
    non_recours: "Une personne seule sur deux qui y a droit ne la demande pas ; près de trois sur quatre chez les propriétaires (2016)."
    non_recours_source: drees-dd97-non-recours-minimum-vieillesse
    source_id: sp-f16871
    criteres: { calculee: aspa }
    rappel:
      criteres: { logement: [proprietaire] }
      ton: rassurant
      texte: "Vous êtes propriétaire : votre logement ne vous sera pas repris. Ce qui est versé n'est récupéré qu'après le décès, et seulement sur la part de l'héritage qui dépasse 108 586 € (métropole)."

  - id: asf
    nom: "Allocation de soutien familial (ASF)"
    en_bref: "200,78 € par mois et par enfant quand l'autre parent ne paie pas, ou pas assez, la pension alimentaire."
    pourquoi_vous: "Le site l'a calculée d'après la pension alimentaire que vous avez indiquée : elle complète ce que l'autre parent ne verse pas."
    pour_qui: "Parent qui élève seul son enfant quand l'autre parent ne verse pas de pension alimentaire, ne peut pas la payer, ou verse moins de 200,78 € par mois et par enfant. Il n'y a pas de condition de revenus."
    ce_que_ca_apporte: "200,78 € par mois et par enfant en 2026 (ou la différence avec une pension plus faible). La Caf peut aussi réclamer à l'autre parent jusqu'à deux ans de pensions impayées."
    ou_la_demander: "À la Caf (ou à la MSA), avec deux formulaires papier (cerfa n° 12038 et n° 11423) à télécharger sur caf.fr ou à demander à l'accueil. Sans pension fixée par un juge, elle est versée 4 mois : il faut ensuite saisir le juge aux affaires familiales."
    url_officielle: "https://www.service-public.gouv.fr/particuliers/vosdroits/F815"
    source_id: sp-f815
    criteres: { calculee: asf }

  - id: ars
    nom: "Allocation de rentrée scolaire (ARS)"
    en_bref: "De 427 € à 466 € par enfant de 6 à 18 ans, versés une fois par an, à la rentrée."
    pourquoi_vous: "Le site l'a calculée pour vos enfants de 6 à 18 ans."
    pour_qui: "Familles aux revenus modestes avec un enfant de 6 à 18 ans scolarisé ou apprenti."
    ce_que_ca_apporte: "Par enfant, à la rentrée 2026 : 426,87 € de 6 à 10 ans, 450,41 € de 11 à 14 ans, 466,02 € de 15 à 18 ans."
    ou_la_demander: "Elle est versée automatiquement aux familles qui touchent déjà une aide de la Caf, pour les enfants de 6 à 16 ans. Les autres familles remplissent une déclaration de situation et de ressources auprès de la Caf."
    url_officielle: "https://www.service-public.gouv.fr/particuliers/vosdroits/F1878"
    source_id: sp-f1878
    versement: annuel
    criteres: { calculee: ars }
    rappel:
      criteres: { enfant_age: [16, 18] }
      texte: "Pour votre enfant de 16 ans ou plus, elle n'est pas automatique : déclarez sur caf.fr qu'il est toujours scolarisé (à partir de mi-juillet), sinon rien n'est versé."

  - id: apl_etudiant
    nom: "Aide au logement des étudiants"
    en_bref: "Une aide pour payer le loyer : ce sont les revenus de l'étudiant qui comptent, pas ceux de ses parents."
    pourquoi_vous: "Le site a calculé que vous y avez droit pour votre loyer."
    pour_qui: "Étudiants locataires (ou colocataires) d'un logement décent, avec de faibles ressources personnelles. Le propriétaire ne doit pas être un parent proche. Depuis le 1er juillet 2026, les étudiants venus d'un pays extérieur à l'Union européenne (sauf Islande, Liechtenstein, Norvège et Suisse) doivent être boursiers, travailler ou être en alternance."
    ce_que_ca_apporte: "Une aide chaque mois qui réduit le loyer. Attention : l'étudiant n'est alors plus à la charge de ses parents pour les prestations familiales, qui peuvent baisser."
    ou_la_demander: "En ligne sur caf.fr (« Aide au logement étudiant : demande en ligne »), dès l'entrée dans le logement. Premier versement environ deux mois après la demande. Téléphone : 09 69 32 52 52."
    url_officielle: "https://www.service-public.gouv.fr/particuliers/vosdroits/F1563"
    source_id: sp-f1563
    criteres: { calculee: aides_logement, activite: [etudiant], logement: [locataire_prive, locataire_social] }

  - id: bourse_crous
    nom: "Bourse étudiante sur critères sociaux (Crous)"
    en_bref: "De 1 454 € à 6 335 € par an pour les étudiants, selon les revenus de leurs parents."
    pourquoi_vous: "Vous êtes étudiant(e) et avez moins de 28 ans."
    pour_qui: "Étudiants de moins de 28 ans à la première demande, inscrits à plein temps, dont la famille a des revenus sous un plafond. Le plafond augmente avec l'éloignement du domicile et le nombre de frères et sœurs."
    ce_que_ca_apporte: "De 1 454 € à 6 335 € par an en 2026-2027, versés en 10 mois."
    ou_la_demander: "Avec le « dossier social étudiant » (DSE), le formulaire en ligne unique pour la bourse et le logement du Crous, sur messervices.etudiant.gouv.fr. Il se remplit au printemps pour l'année suivante : pour 2026-2027, c'était du 1er mars au 31 mai 2026 ; les dates du printemps 2027 ne sont pas encore publiées. Après un changement important de situation (perte d'emploi d'un parent, séparation…), une demande en cours d'année est possible auprès du Crous."
    url_officielle: "https://www.service-public.gouv.fr/particuliers/vosdroits/F12214"
    source_id: sp-f12214-bourse-criteres-sociaux
    criteres: { activite: [etudiant], age_max: 28 }

  - id: repas_crous_1_euro
    nom: "Repas à 1 € au restaurant universitaire"
    en_bref: "Un repas complet à 1 € dans les restaurants du Crous, pour tous les étudiants depuis le 4 mai 2026."
    pourquoi_vous: "Vous êtes étudiant(e) : boursier ou non, vous y avez droit."
    pour_qui: "Tous les étudiants, boursiers ou non, ainsi que les apprentis et alternants, les doctorants et les volontaires en service civique."
    ce_que_ca_apporte: "Un plat et deux à-côtés pour 1 €, le midi et, dans les restaurants ouverts le soir, le soir. Avant mai 2026, les étudiants non boursiers payaient 3,30 €."
    ou_la_demander: "Aucune démarche : activez Izly, le porte-monnaie du Crous (une application et votre carte d'étudiant), et payez avec lui au restaurant universitaire. Sans Izly, c'est le tarif normal."
    url_officielle: "https://www.etudiant.gouv.fr/fr/comment-beneficier-du-repas-crous-1-eu-3123"
    source_id: etudiant-gouv-repas-1-euro
    sources_complementaires: [sp-a18811]
    criteres: { activite: [etudiant] }

  - id: c2s
    nom: "Complémentaire santé solidaire (C2S)"
    en_bref: "Une mutuelle gratuite, ou à moins de 1 € par jour, pour les foyers aux revenus modestes."
    pourquoi_vous: "Les ressources de votre foyer semblent sous le plafond : {plafond_c2s} par mois pour un foyer comme le vôtre."
    pour_qui: "Personnes qui vivent en France depuis plus de 3 mois avec des revenus modestes. Elle est gratuite sous un premier plafond (868 € par mois pour une personne seule) et coûte au plus 1 € par jour sous un second (1 172 €). Elle est attribuée d'office avec le RSA."
    ce_que_ca_apporte: "Une complémentaire santé qui ne coûte rien, ou de 8 € à 30 € par mois et par personne selon l'âge (8 € jusqu'à 29 ans, 30 € à partir de 70 ans)."
    ou_la_demander: "À l'Assurance maladie : en ligne sur votre compte ameli (« Mes démarches »), ou avec le formulaire papier (cerfa n° 12504) que votre caisse peut vous envoyer. Sans réponse sous deux mois, la demande est acceptée."
    url_officielle: "https://www.service-public.gouv.fr/particuliers/vosdroits/F10027"
    non_recours: "Près d'une personne sur deux qui y a droit ne la demande pas (44 % en 2021)."
    non_recours_source: drees-cp-css-non-recours-2022
    source_id: sp-f10027
    sources_complementaires: [ameli-c2s-beneficiaires, ameli-c2s-demande]
    criteres: { ressources_c2s_max: 1172.40, hors_rattaches: true }
    rappel:
      criteres: { logement: [proprietaire, heberge] }
      texte: "Propriétaire ou logé gratuitement : un forfait logement s'ajoute à vos ressources pour la C2S, ce qui peut vous faire dépasser le plafond. Le simulateur d'ameli.fr le vérifie."

  - id: cheque_energie
    nom: "Chèque énergie"
    en_bref: "De 48 € à 277 € par an pour payer l'électricité, le gaz, le fioul ou le bois de votre logement."
    pourquoi_vous: "D'après vos revenus, le revenu fiscal de référence de votre foyer semble sous le plafond : {plafond_cheque} par an pour un foyer comme le vôtre. Le site l'estime : le chiffre exact figure sur votre avis d'impôt."
    pour_qui: "Foyers modestes qui ont un contrat d'électricité, locataires ou propriétaires, dont le revenu fiscal de référence 2024 est inférieur à 11 000 € par an pour une personne seule (16 500 € pour deux, puis + 3 300 € par personne en plus)."
    ce_que_ca_apporte: "De 48 € à 277 € par an (153 € en moyenne en 2026) pour payer les factures d'énergie du logement."
    ou_la_demander: "Il est envoyé automatiquement à une partie des foyers depuis le 1er avril 2026. Si vous ne l'avez pas reçu : demande en ligne sur chequeenergie.gouv.fr (« Vérifier mon éligibilité ») ou par courrier, jusqu'au 31 décembre 2026."
    url_officielle: "https://www.service-public.gouv.fr/particuliers/vosdroits/F33667"
    non_recours: "Il n'est plus envoyé automatiquement à tous : en 2024, environ 1 million de foyers devaient le demander eux-mêmes, et 176 000 l'ont fait."
    non_recours_source: senat-rapport-l25-139-cheque-energie
    source_id: sp-f33667
    sources_complementaires: [sp-a17885, mefsin-cp-526-cheque-energie-2026]
    criteres: { rfr_par_uc_max: 11000, hors_rattaches: true }

  - id: pension_reversion
    nom: "Pension de réversion"
    en_bref: "Si votre époux ou épouse est décédé(e), une partie de sa retraite peut vous revenir. Rien n'est versé sans demande."
    pourquoi_vous: "Vous vivez seul(e) et avez 55 ans ou plus : si vous avez été marié(e) à une personne aujourd'hui décédée, vous y avez peut-être droit."
    pour_qui: "Veuves et veufs, ou ex-époux divorcés, qui ont été mariés avec la personne décédée, à partir de 55 ans. Le Pacs et l'union libre n'y donnent pas droit."
    ce_que_ca_apporte: "54 % de la retraite de base du défunt, si vos ressources sont sous un plafond (environ 2 083 € bruts par mois pour une personne seule), et 60 % de sa retraite complémentaire Agirc-Arrco, sans condition de ressources tant que vous ne vous remariez pas."
    ou_la_demander: "Une seule demande en ligne pour toutes les caisses sur info-retraite.fr (« Demander ma réversion »). Téléphone : 39 60 (Assurance retraite) ou 0 970 660 660 (Agirc-Arrco)."
    url_officielle: "https://www.service-public.gouv.fr/particuliers/vosdroits/F13104"
    source_id: sp-f13104
    sources_complementaires: [info-retraite-reversion, agirc-arrco-demande-reversion]
    criteres: { seul: true, age_min: 55 }

  - id: visale
    nom: "Garantie Visale"
    en_bref: "Une caution gratuite pour louer un logement quand on n'a personne pour se porter garant."
    pourquoi_vous: "Vous avez moins de 30 ans, ou un salaire modeste : si vous cherchez un logement à louer, Action Logement peut se porter garant pour vous."
    pour_qui: "Jeunes de moins de 30 ans (étudiants, alternants, salariés, sans emploi) et salariés plus âgés qui viennent d'être embauchés ou qui gagnent au plus 1 710 € nets par mois. Loyer charges comprises au plus 1 575 € (1 940 € en Île-de-France)."
    ce_que_ca_apporte: "Action Logement garantit gratuitement jusqu'à 36 mois de loyers impayés dans le parc privé (9 mois en HLM). Le propriétaire n'a plus besoin d'un garant dans votre famille."
    ou_la_demander: "Sur visale.fr, avant de signer le bail : vous obtenez un visa en quelques jours, puis le propriétaire l'enregistre en ligne."
    url_officielle: "https://www.service-public.gouv.fr/particuliers/vosdroits/F33453"
    source_id: sp-f33453
    criteres:
      ou:
        - { age_max: 30, logement: [locataire_prive, locataire_social, heberge] }
        - { activite: [salarie], salaire_max: 1710, logement: [heberge] }

  - id: exoneration_taxe_fonciere
    nom: "Exonération de taxe foncière (plus de 75 ans, Aspa, AAH)"
    en_bref: "Plus de taxe foncière sur votre résidence principale si vous avez plus de 75 ans et des revenus modestes, ou si vous touchez le minimum vieillesse ou l'AAH."
    pourquoi_vous: "Vous êtes propriétaire et, d'après votre âge et vos revenus (ou votre droit au minimum vieillesse ou à l'AAH), vous remplissez peut-être les conditions. Le site estime vos revenus : le revenu fiscal de référence exact figure sur votre avis d'impôt."
    pour_qui: "Propriétaires de leur résidence principale qui avaient plus de 75 ans au 1er janvier 2026 et un revenu fiscal de référence 2025 d'au plus 12 793 € pour une part (16 209 € pour une part et demie, 19 625 € pour deux parts, puis 3 416 € de plus par demi-part ; plafonds plus élevés outre-mer). Quel que soit l'âge : les personnes qui touchent le minimum vieillesse (Aspa) ou l'allocation supplémentaire d'invalidité (ASI), sans condition de revenus, et celles qui touchent l'AAH, sous les mêmes plafonds. Depuis 2023, vivre avec d'autres personnes n'empêche plus l'exonération."
    ce_que_ca_apporte: "Vous ne payez plus la taxe foncière de votre résidence principale. La taxe d'enlèvement des ordures ménagères, sur le même avis, reste à payer. Si vous perdez le droit, l'exonération continue 2 ans, puis la taxe revient en deux étapes."
    ou_la_demander: "En principe, rien à faire : elle est accordée de plein droit d'après votre déclaration de revenus et apparaît sur votre avis de taxe foncière. Si elle n'y figure pas alors que vous remplissez les conditions, contactez le centre des Finances publiques indiqué sur l'avis (cadre « Vos démarches »). En maison de retraite, votre ancien logement peut rester exonéré s'il n'est ni loué ni prêté : demandez-le à ce même centre."
    url_officielle: "https://www.service-public.gouv.fr/particuliers/vosdroits/F59"
    source_id: sp-f59
    sources_complementaires: [impots-exonerations-degrevements, impots-faq-age-taxe-fonciere, bofip-boi-if-tfb-10-55-10, bofip-boi-if-tfb-10-55-20]
    criteres:
      logement: [proprietaire]
      ou:
        - { age_min: 75, rfr_par_uc_max: 12793 }
        - { calculee: aspa }
        - { calculee: aah, rfr_par_uc_max: 12793 }
    rappel:
      criteres: { calculee: aspa, age_max: 75 }
      texte: "Avant 75 ans, c'est le fait de toucher le minimum vieillesse qui donne droit à l'exonération : si vous ne le touchez pas encore, demandez-le d'abord (voir « Minimum vieillesse »)."

  - id: reduction_taxe_fonciere_65_75
    nom: "Réduction de 100 € de taxe foncière (65 à 75 ans)"
    en_bref: "100 € de moins chaque année sur la taxe foncière de votre résidence principale, entre 65 et 75 ans, si vos revenus sont modestes."
    pourquoi_vous: "Vous êtes propriétaire, vous avez entre 65 et 75 ans et vos revenus semblent sous le plafond (12 793 € de revenu fiscal de référence pour une part). Le site l'estime : le chiffre exact figure sur votre avis d'impôt."
    pour_qui: "Propriétaires de leur résidence principale qui avaient entre 65 et 75 ans au 1er janvier 2026, avec un revenu fiscal de référence 2025 d'au plus 12 793 € pour une part (19 625 € pour deux parts, puis 3 416 € de plus par demi-part ; plafonds plus élevés outre-mer). Pour un couple marié ou pacsé, il faut que le logement soit commun, ou qu'il appartienne à celui des deux qui a l'âge requis."
    ce_que_ca_apporte: "100 € de moins sur la taxe foncière, chaque année (toute la taxe si elle fait moins de 100 €). Une seule réduction par logement, même à plusieurs propriétaires."
    ou_la_demander: "Rien à faire : la réduction est accordée d'office et figure sur votre avis de taxe foncière. Si elle manque alors que vous remplissez les conditions, contactez le centre des Finances publiques indiqué sur l'avis (cadre « Vos démarches »)."
    url_officielle: "https://www.service-public.gouv.fr/particuliers/vosdroits/F59"
    source_id: sp-f59
    sources_complementaires: [impots-exonerations-degrevements, bofip-boi-if-tfb-10-55-40]
    criteres: { age_min: 65, age_max: 75, logement: [proprietaire], rfr_par_uc_max: 12793 }
    rappel:
      criteres: { calculee: aspa }
      texte: "Si vous touchez le minimum vieillesse (Aspa), ce ne sont pas 100 € de moins : vous ne payez plus du tout la taxe foncière de votre résidence principale."

  - id: maprimeadapt
    nom: "MaPrimeAdapt' (adapter son logement à l'âge)"
    en_bref: "L'Anah paie 50 % ou 70 % des travaux pour adapter votre logement à l'âge ou au handicap : douche à la place de la baignoire, monte-escalier, rampe d'accès…"
    pourquoi_vous: "Vous (ou une personne de votre foyer) avez 70 ans ou plus et les revenus du foyer semblent sous le plafond (22 259 € de revenu fiscal de référence par an pour une personne seule hors Île-de-France). Le site l'estime : le chiffre exact figure sur votre avis d'impôt."
    pour_qui: "Propriétaires qui habitent leur logement, et locataires du parc privé avec l'accord du propriétaire, quand une personne du foyer a 70 ans ou plus, ou de 60 à 69 ans avec une perte d'autonomie évaluée par un professionnel, ou un taux d'incapacité d'au moins 50 %, ou la prestation de compensation du handicap. Les revenus de tout le foyer s'additionnent : en 2026, au plus 22 259 € par an pour une personne seule hors Île-de-France (32 553 € pour deux), 29 253 € en Île-de-France. Le logement doit être la résidence principale, occupée au moins 8 mois par an."
    ce_que_ca_apporte: "70 % du coût des travaux pour les revenus « très modestes » (jusqu'à 17 363 € par an pour une personne seule hors Île-de-France), 50 % pour les revenus « modestes », sur 22 000 € HT de travaux au plus. L'Anah paie aussi au moins 600 € de l'accompagnateur obligatoire, et une avance allant jusqu'à 30 % de l'aide est possible."
    ou_la_demander: "Commencez par un conseiller France Rénov', gratuit : 0 808 800 700. Il vous oriente vers un accompagnateur (« assistant à maîtrise d'ouvrage »), obligatoire : celui-ci vient chez vous faire le diagnostic et dépose la demande sur monprojet.anah.gouv.fr. Ne commencez pas les travaux avant l'accord de l'Anah : l'aide est versée sur factures, une fois les travaux faits."
    url_officielle: "https://www.service-public.gouv.fr/particuliers/vosdroits/F37501"
    source_id: sp-f37501
    sources_complementaires: [anah-guide-maprimeadapt-2026]
    criteres: { age_min: 70, logement: [proprietaire, locataire_prive], rfr_par_uc_max: 22259 }
    rappel:
      criteres: { logement: [locataire_prive] }
      texte: "Locataire : prévenez votre propriétaire et obtenez son accord avant les travaux. C'est vous qui les payez et qui recevez l'aide."
