  - id: bien_etre.nir.sorties_precoces_scolaires
    titre: "NIR 8 - Sorties précoces du système scolaire (% des 18-24 ans)"
    explication: "Part des 18-24 ans sans diplôme du second cycle du secondaire (ni CAP, ni BEP, ni plus) qui ne sont ni en études ni en formation. 2024 : 7,9 % (9,5 % des jeunes hommes, 6,3 % des jeunes femmes ; UE-27 : 9,4 %, cible européenne 2030 : 9 %). Selon l'Insee, le taux était de 11,1 % en moyenne en 2003-2011 et se situe entre 7,8 % et 8,0 % depuis 2019. L'édition 2025 a révisé la série (extrapolation au champ France y compris Mayotte depuis 2011) : les valeurs des éditions antérieures ne sont pas reprises ici."
    unite: pourcent
    serie:
      - date: "2024-12-31"
        valeur: 7.9
        source: be-insee-nir-2025
        statut: provisoire

