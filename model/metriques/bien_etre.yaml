    explication: "Part des 15-64 ans qui ont un emploi (enquête Emploi de l'Insee). En 2024 : 68,8 %, plus haut niveau depuis 1975 (71,5 % pour les hommes, 66,2 % pour les femmes) ; moyenne de l'UE : 70,8 %. Champ : France hors Mayotte jusqu'en 2023 (fichier de l'édition 2024), France en 2024 (édition 2025). Séries trimestrielles plus récentes : travail.taux_emploi_15_64."
