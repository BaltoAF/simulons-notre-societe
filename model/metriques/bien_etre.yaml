# Indicateurs de bien-être et « nouvelles richesses » : les 10 nouveaux indicateurs de richesse (loi n° 2015-411),
# satisfaction dans la vie (Insee, enquête SRCV), santé-environnement, sécurité ressentie, lien social, OCDE « Comment va la vie ? ».
# Conventions de date : grandeur annuelle datée du 31 décembre de l'année de référence ; enquête SRCV (satisfaction, privation),
# collectée « en début d'année » selon l'Insee, datée du 1er janvier de l'année d'enquête ; moyennes pluriannuelles (Gallup, OCDE)
# et estimations sur une période datées du 31 décembre de la dernière année de la période.
# Non dupliqués ici : espérance de vie à la naissance (sante.esperance_vie_naissance_femmes / _hommes) et durée annuelle effective
# du travail (travail.duree_annuelle_effective).
metriques:
  - id: bien_etre.nir.explication
    titre: "Nouveaux indicateurs de richesse (loi n° 2015-411) : nombre d'indicateurs du tableau de bord"
    explication: "La loi n° 2015-411 du 13 avril 2015 (dite « loi Sas ») demande au Gouvernement de remettre chaque année au Parlement un rapport sur l'évolution de nouveaux indicateurs de richesse et une évaluation qualitative ou quantitative de l'impact des principales réformes engagées (texte cité dans une question écrite au Sénat publiée le 7 juillet 2022). Dix indicateurs complètent le PIB : taux d'emploi, effort de recherche, endettement, espérance de vie en bonne santé, satisfaction dans la vie, inégalités de revenus, privation matérielle et sociale, sorties précoces du système scolaire, empreinte carbone et artificialisation des sols. L'Insee en publie la synthèse annuelle (édition 2025 parue le 17 juillet 2026). Selon la réponse du Gouvernement au Sénat (6 octobre 2022), la dernière édition datait alors du 7 décembre 2021 ; aucun rapport du Gouvernement au Parlement plus récent n'a été trouvé. Les métriques bien_etre.nir.* reprennent ces indicateurs."
    unite: indicateurs
    serie:
      - date: "2026-07-17"
        valeur: 10
        source: be-insee-nir-2025
        statut: definitif

