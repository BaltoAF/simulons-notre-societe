    explication: "Nombre de personnes qui touchent une pension de retraite acquise par leur propre carrière (hors personnes ne touchant qu'une pension de réversion), tous régimes français confondus, sans double compte. Fin 2024, 16,4 millions d'entre eux résident en France ; en ajoutant les bénéficiaires d'une seule réversion, un peu moins de 18,2 millions de personnes touchent une pension."
