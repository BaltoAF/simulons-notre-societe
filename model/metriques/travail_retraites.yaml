  # ---------------------------------------------------------------------------
  - id: travail.demandeurs_emploi_cat_a
    titre: "Demandeurs d'emploi inscrits à France Travail en catégorie A (France hors Mayotte, moyenne trimestrielle, CVS-CJO)"
    explication: "Personnes inscrites à France Travail, tenues de chercher un emploi et sans aucune activité dans le mois. Attention, rupture de série en 2025 : la loi « pour le plein emploi » inscrit automatiquement depuis janvier 2025 les allocataires du RSA et les jeunes suivis par les missions locales, et les règles d'actualisation et le décret « sanctions » (juin 2025) ont aussi modifié les effectifs ; les niveaux avant et après 2025 ne sont donc pas directement comparables. Sur un champ constant (hors RSA et jeunes en parcours), la catégorie A est quasi stable au 2e trimestre 2026 (-0,1 %) et augmente de 1,3 % sur un an."
