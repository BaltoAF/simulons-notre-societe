  - id: menages.niveau_vie_avant_redistribution_decile_1
    titre: "Niveau de vie moyen avant redistribution : 10 % des personnes les plus modestes (sous le 1er décile) (euros par unité de consommation et par an)"
    explication: "Revenu annuel moyen par unité de consommation avant impôts directs et prestations sociales non contributives (revenus d'activité, du patrimoine, pensions de retraite et allocations chômage). Insee, France, portrait social 2025, fiche « Redistribution monétaire » : estimation 2024 par le modèle Ines (enquête Revenus fiscaux et sociaux 2022 actualisée en 2024). Les personnes sont classées selon leur niveau de vie AVANT redistribution. Champ : France métropolitaine, logements ordinaires, ménages au revenu positif ou nul dont la personne de référence n'est pas étudiante. Concept Insee de redistribution monétaire : les systèmes de retraite et d'assurance chômage sont exclus du champ (pensions et allocations chômage sont donc comprises dans le niveau de vie avant redistribution) ; les prélèvements retenus sont les prélèvements directs non contributifs (cotisations patronales famille, contributions sociales hors part de la CSG affectée à la maladie, impôt sur le revenu, IFI), sans la TVA ni la taxe foncière. L'Insee ne publie pas ce tableau pour les déciles 2 à 9 : seuls le 1er décile, le 10e décile et les cinq quintiles sont disponibles (ids *_quintile_1 à *_quintile_5)."
