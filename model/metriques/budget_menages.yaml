# Non dupliqués ici : ratios COFOG au PIB et recettes par impôt (finances_publiques.yaml), niveau de vie moyen par
# décile après redistribution (revenus.niveau_vie_moyen.*, population.yaml), reste à charge santé (social_env.yaml).
# Convention : date = 31 décembre de l'année pour les données annuelles.
