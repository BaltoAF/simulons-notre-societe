  - id: ecologie.emissions_par_secteur.utcatf
    titre: "Bilan net du secteur des terres et forêts (UTCATF) : absorption nette"
    explication: "Solde des émissions et absorptions des forêts, prairies, cultures, zones humides, zones artificialisées et produits bois. Valeur négative = la nature absorbe plus qu'elle n'émet. Non compté dans les émissions hors puits."
