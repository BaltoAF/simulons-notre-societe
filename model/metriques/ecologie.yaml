    titre: "Émissions de gaz à effet de serre de l'agriculture et de la sylviculture"
    explication: "Élevage (méthane), engrais (protoxyde d'azote), engins et chaudières agricoles. Le HCC indique que 2024 est la dernière année estimée pour ce secteur : la valeur 2025 est à prendre avec prudence."
