  - id: ecologie.evaluation_hcc.rythme_baisse_necessaire
    titre: "Baisse annuelle moyenne des émissions nécessaire en 2026-2028 pour respecter le budget carbone 2024-2028 (HCC)"
    explication: "Selon le Haut Conseil pour le climat, le rythme de baisse doit « au moins doubler » par rapport à 2025 et dépasser 4 % par an en moyenne en 2026, 2027 et 2028 pour tenir le 3e budget carbone (342 Mt/an). La valeur -4 est donc un minimum. Le ministère indique pour sa part qu'une baisse de 5 % par an entre 2024 et 2030 est nécessaire pour l'objectif 2030."
    unite: pourcent
    serie:
      - date: "2028-12-31"
