  - id: ecologie.part_emissions_routieres_voitures
    titre: "Part des voitures particulières dans les émissions du transport routier"
    explication: "Proportion des émissions de gaz à effet de serre de la route due aux voitures particulières (diesel, essence, GPL, gaz naturel). Le reste vient des poids lourds (27,8 Mt en 2024), des utilitaires légers (17,1 Mt), des bus et cars (3,0 Mt) et des deux-roues (1,6 Mt). Calcul du Système : voitures 67,84 Mt sur 117,35 Mt en 2024 ; 67,25 Mt sur 114,92 Mt en 2025."
