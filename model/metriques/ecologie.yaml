  - id: ecologie.emissions_par_secteur.transports
    titre: "Émissions de gaz à effet de serre du secteur des transports (tous modes intérieurs)"
    explication: "Route, aérien intérieur, ferroviaire, fluvial et maritime intérieur. Premier secteur émetteur (34 % du total en 2025 selon le HCC). Le transport routier seul (115 Mt en 2025) est suivi dans environnement.emissions_co2_transport_routier."
