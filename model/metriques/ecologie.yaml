  - id: ecologie.facteur_emission_gazole
    titre: "Facteur d'émission du gazole routier (B7), amont compris"
    explication: "Gaz à effet de serre émis par litre de gazole routier vendu en France continentale : 2,49 kg à la combustion dans le moteur et 0,609 kg en amont (production et acheminement du carburant). Multiplier un volume de gazole (en litres) par ce facteur donne les émissions associées."
    unite: kg_co2e_par_litre
    serie:
      - date: "2025-07-03"
        valeur: 3.1
        source: eco-ademe-base-carbone-v23-6
        statut: definitif

  - id: ecologie.facteur_emission_essence
    titre: "Facteur d'émission de l'essence (SP95, SP95-E10, SP98), amont compris"
    explication: "Gaz à effet de serre émis par litre de supercarburant sans plomb vendu en France continentale : 2,2 kg à la combustion et 0,491 kg en amont. Valeur identique (2,69) pour le seul SP95-E10. Attention : pour estimer un effet sur les émissions du secteur des transports de l'inventaire national, utiliser plutôt la part « combustion » (2,2 kg pour l'essence, 2,49 kg pour le gazole), la part « amont » n'étant pas comptée dans ce secteur."
    unite: kg_co2e_par_litre
    serie:
      - date: "2025-07-03"
        valeur: 2.69
        source: eco-ademe-base-carbone-v23-6
        statut: definitif

  - id: ecologie.prix_moyen_gazole
    titre: "Prix moyen du gazole à la pompe (TTC, en métropole)"
    explication: "Prix moyen de vente au détail d'un litre de gazole, toutes taxes comprises. L'entrée datée du 31/12/2025 est la moyenne annuelle 2025 ; celle du 31/08/2026 est la moyenne du mois d'août 2026 (dernier mois publié). Forte hausse en 2026 : 1,65 € en janvier, 2,26 € en avril, 2,21 € en août. Le SDES publie pour 2025 une moyenne légèrement différente (1,62 €, métropole hors Corse)."
    unite: euros_par_litre
