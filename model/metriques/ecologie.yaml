  # --- Empreinte selon le niveau de vie (par ménage, décile de niveau de vie) ---
  # Source unique cohérente : Malliet (OFCE, 2020), données 2011 (Budget de famille
  # 2011 + EXIOBASE 3), émissions des administrations publiques réparties à parts
  # égales (3,5 t par ménage). Aucune série officielle récente par décile n'a été
  # trouvée (comptes Insee par catégorie de ménages annoncés pour novembre 2026).
  - id: ecologie.empreinte_carbone_menages_decile_1
    titre: "Empreinte carbone moyenne d'un ménage du 1er décile de niveau de vie (10 % les plus modestes)"
    explication: "Gaz à effet de serre liés à la consommation d'un ménage parmi les 10 % les plus modestes, par ménage (pas par personne ni par unité de consommation), année 2011. Une étude Insee plus récente (Semet, 2024, données 2017, champ et méthode différents) trouve 12 t par ménage pour le premier dixième de revenu."
    unite: t_co2e_par_menage
    serie:
      - date: "2011-12-31"
        valeur: 15.235
        source: eco-ofce-malliet-2020
        statut: estimation

  - id: ecologie.empreinte_carbone_menages_decile_2
    titre: "Empreinte carbone moyenne d'un ménage du 2e décile de niveau de vie"
    explication: "Par ménage, année 2011 (Budget de famille 2011, EXIOBASE 3)."
