  - id: ecologie.emissions_territoriales_totales
    titre: "Émissions territoriales de gaz à effet de serre, hors puits de carbone (série annuelle)"
    explication: "Gaz à effet de serre émis chaque année sur le territoire français (hors absorptions des forêts et des sols), selon l'inventaire officiel du Citepa. C'est la grandeur comparée aux budgets carbone légaux. Série annuelle complète depuis 2015 (l'indicateur environnement_energie.emissions_ges_hors_utcatf en donne quelques points). 2025 : pré-estimation."
