  - id: retraites.nouveaux_retraites_par_an
    titre: "Nouveaux retraités de droit direct dans l'année (tous régimes)"
    explication: "Nombre de personnes qui ont pris leur retraite (pension de droit direct) dans l'année et sont en vie au 31 décembre, tous régimes confondus, y compris les retraités vivant à l'étranger (830 500 en 2024 pour les seuls résidents en France). Estimation de la DREES à partir de l'enquête auprès des caisses de retraite et du modèle Ancêtre."
