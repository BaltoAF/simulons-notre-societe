  - id: environnement.emissions_co2_transport_routier
    titre: "Émissions de gaz à effet de serre du transport routier"
    explication: "Émissions de gaz à effet de serre des voitures, camions, utilitaires, bus et deux-roues, en millions de tonnes équivalent CO2 (inventaire Citepa, France hexagonale et outre-mer de l'UE). Premier secteur émetteur, soit près d'un tiers des émissions françaises. La valeur 2025 est une estimation préliminaire (baisse de 2,1 %)."
