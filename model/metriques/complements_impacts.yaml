# Métriques complémentaires utilisées par les modèles d'impact des réformes.
# Sources : model/sources/complements_impacts.yaml (ids « cpl- »). Consultées le 13 octobre 2026.
# Convention de date : 31 décembre pour une valeur annuelle, date de référence exacte sinon.
metriques:
  # ---------------------------------------------------------------------------
  # TRAVAIL
  # ---------------------------------------------------------------------------
  - id: travail.salaries_concernes_revalorisation_smic_part
    titre: "Part des salariés du privé directement concernés par la dernière revalorisation mesurée du Smic"
    explication: "Proportion de salariés dont la paie a dû être relevée quand le Smic a augmenté. La dernière mesure publiée (enquête Acemo de la Dares, reprise par le Groupe d'experts sur le Smic) porte sur la hausse anticipée du 1er novembre 2024 (Smic à 11,88 € bruts de l'heure) : 12,4 % des salariés, contre une part plus élevée en début d'année 2024. Champ : secteur privé hors agriculture, hors apprentis, stagiaires et intérimaires, France hors Mayotte. Ce n'est pas exactement la part des salariés payés au Smic."
    unite: pourcent
    serie:
      - date: "2024-11-01"
        valeur: 12.4
        source: cpl-groupe-experts-smic-2025
        statut: definitif

  - id: travail.salaries_concernes_revalorisation_smic_nombre
    titre: "Nombre de salariés du privé directement concernés par la dernière revalorisation mesurée du Smic"
    explication: "Nombre de salariés dont la paie a dû être relevée lors de la hausse anticipée du Smic au 1er novembre 2024 : environ 2,2 millions (valeur arrondie publiée). Même champ que la part correspondante (privé hors agriculture, France hors Mayotte)."
    unite: personnes
    serie:
      - date: "2024-11-01"
        valeur: 2200000
        source: cpl-groupe-experts-smic-2025
        statut: definitif

  - id: travail.duree_moyenne_indemnisation_chomage
    titre: "Durée moyenne d'indemnisation chômage réellement consommée (droits interrompus dans l'année)"
    explication: "Pour les 2,6 millions de droits au chômage qui se sont arrêtés en 2023, l'Unédic compte en moyenne 327 jours indemnisés, soit environ 11 mois, alors que la durée de droit disponible était en moyenne de 19 mois (564 jours) : les allocataires consomment en moyenne 60 % de leur droit. La plupart de ces droits avaient été ouverts avant la réforme de 2023."
    unite: mois
    serie:
      - date: "2023-12-31"
        valeur: 11
        source: cpl-unedic-durees-indemnisation-2025
        statut: definitif

  - id: travail.allocation_chomage_moyenne_nette
    titre: "Allocation chômage moyenne nette versée par mois (allocataires indemnisés)"
    explication: "Montant moyen réellement versé chaque mois aux personnes indemnisées par l'Assurance chômage, en tenant compte des mois incomplets (arrêt maladie, cumul avec un salaire…). Au 1er trimestre 2026 : 1 055 € nets par mois en moyenne (1 152 € pour ceux qui n'ont pas travaillé, 820 € pour ceux qui cumulent avec un emploi) ; 54 % des indemnisés touchent moins de 1 000 €."
    unite: euros
    serie:
      - date: "2026-03-31"
        valeur: 1055
        source: cpl-unedic-montant-t1-2026
        statut: provisoire

  # ---------------------------------------------------------------------------
  # FISCALITÉ - TVA
  # ---------------------------------------------------------------------------
  - id: fiscalite.tva.recettes_brutes_totales
    titre: "Recettes totales de TVA, toutes administrations publiques (comptabilité nationale)"
    explication: "Produit total de la TVA, quel que soit le bénéficiaire (État, Sécurité sociale, collectivités), mesuré par l'Insee dans les comptes nationaux. Pour 2025, la DGFiP publie des ordres de grandeur proches : 211 Md€ de « TVA économique » et 212 Md€ de TVA budgétaire collectée. Statuts Insee : 2023 définitif, 2024 semi-définitif (codé provisoire), 2025 provisoire."
    unite: milliards_euros
    serie:
      - date: "2023-12-31"
        valeur: 206.312
        source: cpl-insee-cn2025-t3217
        statut: definitif
      - date: "2024-12-31"
        valeur: 207.753
        source: cpl-insee-cn2025-t3217
        statut: provisoire
      - date: "2025-12-31"
        valeur: 208.821
        source: cpl-insee-cn2025-t3217
        statut: provisoire

  - id: fiscalite.tva.part_recettes_taux_normal
    titre: "Part du taux normal (20 %) dans la TVA brute collectée par les entreprises"
    explication: "Part de la TVA facturée au taux de 20 % (ventes en métropole, produits pétroliers et importations) dans le total de la TVA brute collectée en 2025 (943 Md€, avant déduction de la TVA payée par les entreprises sur leurs achats). Calcul Société 2.0 à partir des montants DGFiP : (798 841 + 13 431,2 + 30 311,5) / 943 322 M€. Attention : cette part surestime le poids du taux normal dans les recettes nettes, car la TVA collectée entre entreprises est surtout au taux normal puis déduite. Les recettes nettes par taux ne sont pas observables dans les déclarations (CPO, 2023) ; pour simuler une réforme, la DG Trésor estime qu'un point de TVA rapporte en 2025 : 8,9 Md€ au taux de 20 %, 1,9 Md€ à 10 %, 2,4 Md€ à 5,5 % et 0,4 Md€ à 2,1 % (13,7 Md€ au total, Trésor-Éco n° 371)."
    unite: pourcent
    serie:
      - date: "2025-12-31"
        valeur: 89.3
        source: cpl-dgfip-tva-secteurs-taux-2025
        statut: estimation

  - id: fiscalite.tva.part_recettes_taux_intermediaire
    titre: "Part du taux intermédiaire (10 %) dans la TVA brute collectée par les entreprises"
    explication: "Part de la TVA facturée au taux de 10 % (restauration, travaux dans les logements, transport de voyageurs…), importations comprises, dans le total de la TVA brute collectée en 2025. Calcul Société 2.0 à partir des montants DGFiP : (32 417,4 + 131,5) / 943 322 M€. Même limite que pour le taux normal : il s'agit de TVA collectée avant déductions, pas des recettes nettes. Repère DG Trésor : un point de TVA au taux de 10 % rapporte 1,9 Md€ bruts en 2025."
    unite: pourcent
    serie:
      - date: "2025-12-31"
        valeur: 3.5
        source: cpl-dgfip-tva-secteurs-taux-2025
        statut: estimation

  - id: fiscalite.tva.part_recettes_taux_reduit
    titre: "Part du taux réduit (5,5 %) dans la TVA brute collectée par les entreprises"
    explication: "Part de la TVA facturée au taux de 5,5 % (alimentation, énergie, travaux de rénovation énergétique…), importations comprises, dans le total de la TVA brute collectée en 2025. Calcul Société 2.0 à partir des montants DGFiP : (48 201,1 + 840,5) / 943 322 M€. Même limite que pour le taux normal. Le reste (environ 2 %) correspond aux taux des DOM, de la Corse, au 2,1 % et aux « autres taux » que la DGFiP ne détaille pas. Repère DG Trésor : un point de TVA au taux de 5,5 % rapporte 2,4 Md€ bruts en 2025."
    unite: pourcent
    serie:
      - date: "2025-12-31"
        valeur: 5.2
        source: cpl-dgfip-tva-secteurs-taux-2025
        statut: estimation

  - id: fiscalite.tva.rendement_net_point_taux_normal
    titre: "Rendement net d'un point de TVA au taux de 20 % (2025)"
    explication: "Recettes supplémentaires pour les finances publiques d'une hausse d'un point du taux de 20 %, à consommation inchangée, une fois déduite la TVA que les administrations publiques paient elles-mêmes sur leurs achats (rendement brut : 8,9 Md€). Tableaux 1 et 2 du Trésor-Éco n° 371."
    unite: milliards_euros
    serie:
      - date: "2025-12-31"
        valeur: 7.5
        source: cpl-tresor-eco-371
        statut: estimation

  - id: fiscalite.tva.rendement_net_point_taux_intermediaire
    titre: "Rendement net d'un point de TVA au taux de 10 % (2025)"
    explication: "Recettes supplémentaires pour les finances publiques d'une hausse d'un point du taux de 10 %, à consommation inchangée, une fois déduite la TVA que les administrations publiques paient elles-mêmes sur leurs achats (rendement brut : 1,9 Md€). Tableaux 1 et 2 du Trésor-Éco n° 371."
    unite: milliards_euros
    serie:
      - date: "2025-12-31"
        valeur: 1.6
        source: cpl-tresor-eco-371
        statut: estimation

  - id: fiscalite.tva.rendement_net_point_taux_reduit
    titre: "Rendement net d'un point de TVA au taux de 5,5 % (2025)"
    explication: "Recettes supplémentaires pour les finances publiques d'une hausse d'un point du taux de 5,5 %, à consommation inchangée, une fois déduite la TVA que les administrations publiques paient elles-mêmes sur leurs achats (rendement brut : 2,4 Md€). Tableaux 1 et 2 du Trésor-Éco n° 371."
    unite: milliards_euros
    serie:
      - date: "2025-12-31"
        valeur: 2.0
        source: cpl-tresor-eco-371
        statut: estimation

  - id: fiscalite.tva.rendement_net_point_taux_particulier
    titre: "Rendement net d'un point de TVA au taux de 2,1 % (2025)"
    explication: "Recettes supplémentaires pour les finances publiques d'une hausse d'un point du taux de 2,1 %, à consommation inchangée, une fois déduite la TVA que les administrations publiques paient elles-mêmes sur leurs achats (rendement brut : 0,4 Md€). Tableaux 1 et 2 du Trésor-Éco n° 371."
    unite: milliards_euros
    serie:
      - date: "2025-12-31"
        valeur: 0.4
        source: cpl-tresor-eco-371
        statut: estimation

  - id: fiscalite.csg.recettes_capital
    titre: "Recettes de CSG sur les revenus du capital (patrimoine et placements)"
    explication: "CSG prélevée sur les revenus du patrimoine (revenus fonciers, plus-values…) et des placements (intérêts, dividendes, assurance-vie), tous affectataires. En 2025, le taux était de 9,2 % sur toutes ces assiettes."
    unite: milliards_euros
    serie:
      - date: "2025-12-31"
        valeur: 17.59
        source: ccss_oct2026
        statut: provisoire

  - id: fiscalite.csg.rendement_point_capital_droit_commun
    titre: "Rendement d'un point de CSG sur les revenus du capital au taux de droit commun"
    explication: "Recettes d'un point de CSG sur les revenus du capital soumis au taux de droit commun (dividendes, intérêts, plus-values mobilières…), déduites du chiffrage de la hausse de 1,4 point de la LFSS 2026 (1,5 Md€ dans la version votée, soit environ 1,07 Md€ par point)."
    unite: milliards_euros
    serie:
      - date: "2026-12-31"
        valeur: 1.07
        source: senat_plfss2026_nl_205
        statut: estimation

  # ---------------------------------------------------------------------------
  # CONSOMMATION - poids de la TVA selon le niveau de vie
  # ---------------------------------------------------------------------------
  - id: consommation.tva_part_revenu_disponible_decile_1
    titre: "TVA payée en % du revenu disponible – 10 % de ménages les plus modestes (1er décile de niveau de vie)"
    explication: "Part du revenu des ménages les plus modestes qui part en TVA : 12,5 %, contre 4,7 % pour les 10 % les plus aisés, parce que les ménages modestes consomment presque tout leur revenu. Estimation la plus récente publiée par le Conseil des prélèvements obligatoires (2023), qui reprend un calcul de 2015 (modèle Ines, enquête Budget de famille 2011, législation 2014), jugé toujours valable. Les déciles 3 à 8 ne sont publiés que sous forme de graphique."
    unite: pourcent
    serie:
      - date: "2014-12-31"
        valeur: 12.5
        source: cpl-cpo-2023-tva-rp5
        statut: estimation

  - id: consommation.tva_part_revenu_disponible_decile_2
    titre: "TVA payée en % du revenu disponible – 2e décile de niveau de vie"
    explication: "Selon le CPO, entre le 2e et le 9e décile le poids de la TVA « décroît de 9,5 % à 7,5 % » du revenu disponible ; 9,5 % correspond donc au 2e décile. Même estimation que pour le 1er décile (législation 2014, enquête Budget de famille 2011)."
    unite: pourcent
    serie:
      - date: "2014-12-31"
        valeur: 9.5
        source: cpl-cpo-2023-tva-rp5
        statut: estimation

  - id: consommation.tva_part_revenu_disponible_decile_9
    titre: "TVA payée en % du revenu disponible – 9e décile de niveau de vie"
    explication: "Selon le CPO, entre le 2e et le 9e décile le poids de la TVA « décroît de 9,5 % à 7,5 % » du revenu disponible ; 7,5 % correspond donc au 9e décile. Même estimation que pour le 1er décile (législation 2014, enquête Budget de famille 2011)."
    unite: pourcent
    serie:
      - date: "2014-12-31"
        valeur: 7.5
        source: cpl-cpo-2023-tva-rp5
        statut: estimation

  - id: consommation.tva_part_revenu_disponible_decile_10
    titre: "TVA payée en % du revenu disponible – 10 % de ménages les plus aisés (10e décile de niveau de vie)"
    explication: "Les 10 % de ménages les plus aisés consacrent 4,7 % de leur revenu disponible à la TVA, car ils épargnent une part importante de leur revenu. Rapporté à la seule consommation, le taux de TVA payé est en revanche à peu près le même pour tous (écart de 0,8 point entre le 1er et le dernier décile). Même estimation que pour le 1er décile."
    unite: pourcent
    serie:
      - date: "2014-12-31"
        valeur: 4.7
        source: cpl-cpo-2023-tva-rp5
        statut: estimation

