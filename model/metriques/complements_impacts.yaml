  - id: retraites.part_departs_age_legal
    titre: "Part des nouveaux retraités du régime général partis exactement à l'âge légal avec le taux plein"
    explication: "Parmi les 658 481 nouveaux retraités du régime général en 2024, 12,1 % sont partis le mois même où ils ont atteint l'âge légal, avec une retraite à taux plein. À titre de comparaison, 34,9 % sont partis à taux plein avant l'âge légal (carrières longues notamment), 24,2 % à taux plein après l'âge légal mais avant l'âge du taux plein automatique, 15,3 % à partir de cet âge, et 13,5 % avec une décote. Les départs à l'âge légal avec décote ne sont pas comptés dans les 12,1 %."
    unite: pourcent
    serie:
      - date: "2024-12-31"
        valeur: 12.1
        source: cpl-cnav-abrege-2025
        statut: definitif

