  - id: quotient_familial_plafond_moins_25_pourcent
    domaine: fiscalite
    reforme: "Plafond de l'avantage par demi-part du quotient familial abaissé d'un quart (comme en 2014 : 2 000 € → 1 500 €)"
    overrides:
      fiscalite.impot_revenu.quotient_familial.plafond_demi_part: {fois: 0.75}
    valeur_md: 1.0
    fourchette_md: [1.0, 1.03]
    perimetre: statique
    annee: 2014
    comparabilite: moyenne
    source_id: senat_rg_plf2014_t2
    citation: "permettre un gain budgétaire d'environ 1 milliard d'euros"
    note: "Réforme de 2014 (revenus 2013), 1,26 million de foyers plafonnés. Rejouée sur le plafond de 2026 (1 807 € → 1 355 €) : la législation et les revenus ont changé depuis. Le site trouve environ 3,5 millions de foyers touchés : sa population simulée compte sans doute trop de familles aisées avec enfants (elle est calée sur l'impôt payé par tranche de revenu, pas encore sur la composition des foyers aisés)."

