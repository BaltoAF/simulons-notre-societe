    type: nombre
    unite: pourcent
    facteur: 100
    bornes: [0, 35]

  - id: fiscalite.tva.taux_reduit
    domaine: fiscalite
    fichier: tva
    theme: TVA
    titre: "TVA : taux réduit"
    explication: "Taux appliqué aux produits de première nécessité : alimentation, énergie (abonnements), livres, équipements pour personnes handicapées…"
    lecture: taxation_indirecte.tva.taux_reduit
    type: nombre
    unite: pourcent
    facteur: 100
    bornes: [0, 35]

  # ───────────── Minima sociaux et prime d'activité ─────────────
  - id: prestations.rsa.montant_forfaitaire
    domaine: prestations
    fichier: minima_sociaux
    theme: RSA
    titre: "RSA : montant forfaitaire pour une personne seule (par mois)"
    explication: "Revenu minimum garanti à une personne seule sans ressources. Il est majoré selon la composition du foyer et diminue quand les autres revenus augmentent."
    lecture: prestations_sociales.solidarite_insertion.minima_sociaux.rsa.rsa_m.montant_de_base_du_rsa
    type: nombre
    unite: euros
    bornes: [0, 2000]
    tags: [minima_sociaux, pauvrete]

  - id: prestations.prime_activite.montant_forfaitaire
    domaine: prestations
    fichier: minima_sociaux
    theme: Prime d'activité
    titre: "Prime d'activité : montant forfaitaire (par mois)"
    explication: "Base de calcul de la prime d'activité, l'aide versée aux travailleurs modestes pour compléter leurs revenus."
    lecture: prestations_sociales.solidarite_insertion.minima_sociaux.ppa.pa_m.montant_de_base
    type: nombre
    unite: euros
    bornes: [0, 2000]
    tags: [travail, incitation]

  - id: prestations.prime_activite.part_revenus_activite
    domaine: prestations
    fichier: minima_sociaux
    theme: Prime d'activité
    titre: "Prime d'activité : part des revenus du travail prise en compte"
    explication: "Pour 100 € gagnés en travaillant, cette part s'ajoute au droit. Plus elle est élevée, plus travailler davantage est récompensé."
    lecture: prestations_sociales.solidarite_insertion.minima_sociaux.ppa.pa_m.majoration_ressources_revenus_activite
    type: nombre
    unite: pourcent
    facteur: 100
    bornes: [0, 100]

  - id: prestations.prime_activite.bonification_max
    domaine: prestations
    fichier: minima_sociaux
    theme: Prime d'activité
    titre: "Prime d'activité : bonification individuelle maximale (en % du montant forfaitaire)"
    explication: "Supplément versé à chaque travailleur dont les revenus approchent ou dépassent le SMIC."
    lecture: prestations_sociales.solidarite_insertion.minima_sociaux.ppa.pa_m.bonification.taux_bonification_max
    type: nombre
    unite: pourcent
    facteur: 100
    bornes: [0, 100]

  - id: prestations.aah.montant
    domaine: prestations
    fichier: minima_sociaux
    theme: Handicap
    titre: "Allocation aux adultes handicapés (AAH) : montant maximal (par mois)"
    explication: "Revenu minimum versé aux personnes en situation de handicap qui ont peu ou pas de ressources."
    lecture: prestations_sociales.prestations_etat_de_sante.invalidite.aah.montant
    type: nombre
    unite: euros
    bornes: [0, 3000]

  - id: prestations.aspa.montant_personne_seule
    domaine: prestations
    fichier: minima_sociaux
    theme: Minimum vieillesse
    titre: "Minimum vieillesse (ASPA) : montant maximal pour une personne seule (par an)"
    explication: "Revenu minimum garanti aux personnes âgées. Le plafond de ressources évolue avec le montant."
    lecture: prestations_sociales.solidarite_insertion.minimum_vieillesse.aspa.montant_maximum_annuel.personnes_seules
    ecriture:
      - chemin: prestations_sociales.solidarite_insertion.minimum_vieillesse.aspa.montant_maximum_annuel.personnes_seules
        formule: "v"
      - chemin: prestations_sociales.solidarite_insertion.minimum_vieillesse.aspa.plafond_ressources.personnes_seules
        formule: "v"
    type: nombre
    unite: euros
    bornes: [0, 30000]

  # ───────────── Famille ─────────────
  - id: prestations.famille.bmaf
    domaine: prestations
    fichier: famille
    theme: Prestations familiales
    titre: "Base mensuelle de calcul des allocations familiales (BMAF)"
    explication: "Montant de référence : la plupart des prestations familiales sont exprimées en pourcentage de cette base."
    lecture: prestations_sociales.prestations_familiales.bmaf.bmaf
    sources_officielles: [bo-instr-dss-2b-2026-46]
    article: "Code de la sécurité sociale, art. L551-1 ; instruction n° DSS/2B/2026/46 du 20 mars 2026"
    type: nombre
    unite: euros
    bornes: [0, 1500]

  - id: prestations.famille.af_nombre_enfants_minimum
    domaine: prestations
    fichier: famille
    theme: Allocations familiales
    titre: "Allocations familiales : nombre d'enfants minimum pour y avoir droit"
    explication: "Aujourd'hui, les allocations familiales ne sont versées qu'à partir du deuxième enfant à charge (hors outre-mer)."
    lecture: prestations_sociales.prestations_familiales.prestations_generales.af.af_cm.nb_enfants_min_pour_allocation
    type: nombre
    unite: enfants
    bornes: [1, 4]

  - id: prestations.famille.af_taux_deux_enfants
    domaine: prestations
    fichier: famille
    theme: Allocations familiales
    titre: "Allocations familiales : montant pour 2 enfants (en % de la BMAF)"
    explication: "Pour deux enfants à charge, les allocations familiales valent ce pourcentage de la base mensuelle (avant modulation selon les revenus)."
    lecture: prestations_sociales.prestations_familiales.prestations_generales.af.af_cm.taux.enf2
    type: nombre
    unite: pourcent
    facteur: 100
    bornes: [0, 100]

  - id: prestations.famille.af_taux_enfant_supplementaire
    domaine: prestations
    fichier: famille
    theme: Allocations familiales
    titre: "Allocations familiales : supplément par enfant à partir du 3e (en % de la BMAF)"
    explication: "Montant ajouté pour chaque enfant à partir du troisième."
    lecture: prestations_sociales.prestations_familiales.prestations_generales.af.af_cm.taux.enf3
    type: nombre
    unite: pourcent
    facteur: 100
    bornes: [0, 100]

  - id: prestations.famille.af_plafond_modulation
    domaine: prestations
    fichier: famille
    theme: Allocations familiales
    titre: "Allocations familiales : plafond de revenus de base avant division par deux"
    explication: "Au-delà de ce revenu annuel, augmenté de 6 664 € par enfant à charge (soit 79 980 € pour deux enfants), les allocations familiales sont divisées par deux (puis par quatre au-delà d'un second plafond)."
    lecture: prestations_sociales.prestations_familiales.prestations_generales.af.af_cond_ress.plafond_tranche_1_base
    sources_officielles: [bo-instr-dss-2b-2025-177]
    article: "Code de la sécurité sociale, art. D521-3 ; instruction n° DSS/2B/2025/177 du 18 décembre 2025, annexe, I-1"
    type: nombre
    unite: euros
    bornes: [0, 300000]

  # ───────────── Logement ─────────────
  - id: prestations.aides_logement.forfait_charges
    domaine: prestations
    fichier: logement
    theme: Aides au logement
    titre: "Aides au logement : forfait de charges (cas général, par mois)"
    explication: "Montant forfaitaire ajouté au loyer pour tenir compte des charges dans le calcul de l'aide au logement."
    lecture: prestations_sociales.aides_logement.allocations_logement.locatif.formule.c_forfait_charges.cas_general.cas_general
    type: nombre
    unite: euros
    bornes: [0, 500]

  # ───────────── Travail (moteur) ─────────────
  # Si une autre fiche de règles définit déjà le même id (ex. fiche « travail » sourcée par décret),
  # le Système n'en génère pas de doublon : il rattache simplement le lien moteur à cette règle
  # et vérifie que les deux valeurs concordent.
  - id: travail.smic.horaire_brut
    domaine: travail
    fichier: smic_moteur
    theme: Salaire minimum
    titre: "SMIC horaire brut"
    explication: "Salaire minimum par heure de travail, avant cotisations. Le SMIC mensuel correspond à 151,67 heures."
    lecture: marche_travail.salaire_minimum.smic.smic_b_horaire
    ecriture:
      - chemin: marche_travail.salaire_minimum.smic.smic_b_horaire
        formule: "v"
      - chemin: marche_travail.salaire_minimum.smic.smic_b_mensuel
        formule: "v * 151.67"
      # Les allègements de cotisations patronales se calculent sur le SMIC du 1er janvier (gelé à 12,02 € pour 2026,
      # décret n° 2026-509) : une hausse durable du SMIC les relève d'autant, en gardant l'écart de 2026.
      - chemin: prelevements_sociaux.reductions_cotisations_sociales.allegement_general.ensemble_des_entreprises.smic_reference
        formule: "base * v / v0"
    type: nombre
    unite: euros
    bornes: [5, 30]

  - id: travail.chomage.taux_remplacement
    domaine: travail
    fichier: chomage_moteur
    theme: Assurance chômage
    titre: "Allocation chômage : pourcentage du salaire journalier de référence"
    explication: "L'allocation chômage vaut le plus favorable de deux calculs : ce pourcentage du salaire journalier de référence, ou 40,4 % plus une partie fixe."
    lecture: chomage.allocations_assurance_chomage.alloc_base_taux.pourcentage_sjr
    type: nombre
    unite: pourcent
    facteur: 100
    bornes: [0, 100]
