# Leviers de la loi actuelle adossés au moteur OpenFisca-France.
#
# Ce fichier décrit QUELS paramètres du moteur sont exposés au grand public et COMMENT les présenter.
# Les valeurs, l'historique et les références légales ne sont PAS saisis ici : le Système
# (system/sync_openfisca.py) les extrait d'OpenFisca-France et génère model/regles/<domaine>/<fichier>.yaml.
#
# Champs :
#   lecture   : chemin OpenFisca dont on lit la valeur (unité OpenFisca)
#   ecriture  : liste des paramètres OpenFisca modifiés quand le levier change ; `formule` exprime la
#               nouvelle valeur OpenFisca en fonction de v (= nouvelle valeur du levier, en unité OpenFisca).
#               Par défaut : [{chemin: lecture, formule: "v"}]
#   facteur   : multiplicateur d'affichage (ex. 100 pour présenter un taux 0.2 en 20 %)
#   type      : nombre | bareme | booleen

leviers:
  # ───────────── Impôt sur le revenu ─────────────
  - id: fiscalite.impot_revenu.bareme
    domaine: fiscalite
    fichier: impot_revenu
    theme: Impôt sur le revenu
    titre: "Barème de l'impôt sur le revenu (tranches et taux)"
    explication: "Le revenu imposable, divisé par le nombre de parts, est découpé en tranches. Chaque tranche est taxée à son propre taux : on ne paie le taux le plus élevé que sur la partie du revenu qui dépasse le seuil."
    lecture: impot_revenu.bareme_ir_depuis_1945.bareme
    type: bareme
    unite: euros
    tags: [impot, progressivite]

  - id: fiscalite.impot_revenu.decote.taux
    domaine: fiscalite
    fichier: impot_revenu
    theme: Impôt sur le revenu
    titre: "Décote (réduction des petits impôts) : pourcentage de l'impôt retranché"
    explication: "La décote réduit l'impôt des foyers modestes, pour éviter de passer brutalement de 0 à quelques centaines d'euros d'impôt. Elle vaut un montant de départ (règles suivantes) moins ce pourcentage de l'impôt calculé : plus il est élevé, plus la décote s'éteint vite quand l'impôt augmente."
    lecture: impot_revenu.calcul_impot_revenu.plaf_qf.decote.taux
    type: nombre
    unite: pourcent
    facteur: 100
    bornes: [0, 100]

  - id: fiscalite.impot_revenu.decote.plafond_celibataire
    domaine: fiscalite
    fichier: impot_revenu
    theme: Impôt sur le revenu
    titre: "Décote (réduction des petits impôts) : montant de départ pour une personne seule"
    explication: "La décote d'une personne seule vaut ce montant moins un pourcentage de son impôt calculé. Elle disparaît quand ce calcul devient nul : plus le montant est élevé, plus la réduction est forte et plus elle touche de foyers."
    lecture: impot_revenu.calcul_impot_revenu.plaf_qf.decote.seuil_celib
    type: nombre
    unite: euros
    bornes: [0, 3000]

  - id: fiscalite.impot_revenu.decote.plafond_couple
    domaine: fiscalite
    fichier: impot_revenu
    theme: Impôt sur le revenu
    titre: "Décote (réduction des petits impôts) : montant de départ pour un couple"
    explication: "La décote d'un couple marié ou pacsé vaut ce montant moins un pourcentage de son impôt calculé. Elle disparaît quand ce calcul devient nul : plus le montant est élevé, plus la réduction est forte et plus elle touche de foyers."
    lecture: impot_revenu.calcul_impot_revenu.plaf_qf.decote.seuil_couple
    type: nombre
    unite: euros
    bornes: [0, 5000]

  - id: fiscalite.impot_revenu.quotient_familial.plafond_demi_part
    domaine: fiscalite
    fichier: impot_revenu
    theme: Impôt sur le revenu
    titre: "Plafond de l'avantage par demi-part (quotient familial)"
    explication: "Chaque demi-part supplémentaire (par exemple pour un enfant) réduit l'impôt, mais cette réduction est plafonnée à ce montant par an."
    lecture: impot_revenu.calcul_impot_revenu.plaf_qf.plafond_avantages_procures_par_demi_part.general
    type: nombre
    unite: euros
    bornes: [0, 6000]

  - id: fiscalite.impot_revenu.quotient_familial.parts_premier_enfant
    domaine: fiscalite
    fichier: impot_revenu
    theme: Impôt sur le revenu
    titre: "Parts fiscales pour le 1er enfant (et le 2e)"
    explication: "Nombre de parts de quotient familial ajoutées pour le premier enfant à charge (le deuxième enfant donne le même nombre de parts)."
    lecture: impot_revenu.calcul_impot_revenu.plaf_qf.quotient_familial.cas_general.enf1
    ecriture:
      - chemin: impot_revenu.calcul_impot_revenu.plaf_qf.quotient_familial.cas_general.enf1
        formule: "v"
      - chemin: impot_revenu.calcul_impot_revenu.plaf_qf.quotient_familial.cas_general.enf2
        formule: "v"
    type: nombre
    unite: parts
    bornes: [0, 2]

  - id: fiscalite.impot_revenu.quotient_familial.parts_enfant_3_et_plus
    domaine: fiscalite
    fichier: impot_revenu
    theme: Impôt sur le revenu
    titre: "Parts fiscales à partir du 3e enfant"
    explication: "Nombre de parts de quotient familial ajoutées pour chaque enfant à partir du troisième."
    lecture: impot_revenu.calcul_impot_revenu.plaf_qf.quotient_familial.cas_general.enf3_et_sup
    type: nombre
    unite: parts
    bornes: [0, 2]

  - id: fiscalite.impot_revenu.abattement_salaires.taux
    domaine: fiscalite
    fichier: impot_revenu
    theme: Impôt sur le revenu
    titre: "Abattement forfaitaire pour frais professionnels (taux)"
    explication: "Avant de calculer l'impôt, les salaires sont réduits de ce pourcentage pour tenir compte des frais liés au travail (transport, repas…)."
    lecture: impot_revenu.calcul_revenus_imposables.deductions.abatpro.taux
    type: nombre
    unite: pourcent
    facteur: 100
    bornes: [0, 30]

  - id: fiscalite.impot_revenu.abattement_salaires.plafond
    domaine: fiscalite
    fichier: impot_revenu
    theme: Impôt sur le revenu
    titre: "Abattement forfaitaire pour frais professionnels (plafond annuel)"
    explication: "Montant maximal de l'abattement de 10 % sur les salaires, par personne et par an."
    lecture: impot_revenu.calcul_revenus_imposables.deductions.abatpro.max
    type: nombre
    unite: euros
    bornes: [0, 40000]

  - id: fiscalite.impot_revenu.abattement_pensions.plafond
    domaine: fiscalite
    fichier: impot_revenu
    theme: Impôt sur le revenu
    titre: "Abattement de 10 % sur les pensions de retraite (plafond annuel par foyer)"
    explication: "Les pensions de retraite sont réduites de 10 % avant le calcul de l'impôt, dans la limite de ce plafond par foyer."
    lecture: impot_revenu.calcul_revenus_imposables.deductions.abatpen.max
    type: nombre
    unite: euros
    bornes: [0, 15000]

  - id: fiscalite.capital.pfu_taux_ir
    domaine: fiscalite
    fichier: impot_revenu
    theme: Revenus du capital
    titre: "Prélèvement forfaitaire unique (« flat tax ») : part impôt sur le revenu"
    explication: "Les intérêts et dividendes sont taxés à ce taux fixe au titre de l'impôt sur le revenu, auquel s'ajoutent les prélèvements sociaux."
    lecture: taxation_capital.prelevement_forfaitaire.partir_2018.taux_prelevement_forfaitaire_rev_capital_eligibles_pfu_interets_dividendes_etc
    type: nombre
    unite: pourcent
    facteur: 100
    bornes: [0, 60]

  # ───────────── CSG / CRDS / cotisations ─────────────
  - id: fiscalite.csg.salaires_taux
    domaine: fiscalite
    fichier: prelevements_sociaux
    theme: CSG et CRDS
    titre: "CSG sur les revenus d'activité (taux total)"
    explication: "La contribution sociale généralisée est prélevée sur les salaires (sur 98,25 % du salaire brut) pour financer la Sécurité sociale."
    lecture: prelevements_sociaux.contributions_sociales.csg.activite.taux_global
    ecriture:
      - chemin: prelevements_sociaux.contributions_sociales.csg.activite.deductible
        formule: "v - 0.024"
      - chemin: prelevements_sociaux.contributions_sociales.csg.activite.taux_global
        formule: "v"
    type: nombre
    unite: pourcent
    facteur: 100
    bornes: [2.4, 20]

  - id: fiscalite.csg.retraites_taux_plein
    domaine: fiscalite
    fichier: prelevements_sociaux
    theme: CSG et CRDS
    titre: "CSG sur les pensions de retraite (taux plein)"
    explication: "Taux de CSG appliqué aux retraités dont le revenu fiscal dépasse un certain seuil (des taux réduits existent pour les plus modestes)."
    lecture: prelevements_sociaux.contributions_sociales.csg.remplacement.pensions_retraite_invalidite.taux_plein
    ecriture:
      - chemin: prelevements_sociaux.contributions_sociales.csg.remplacement.pensions_retraite_invalidite.deductible.taux_plein
        formule: "v - 0.024"
      - chemin: prelevements_sociaux.contributions_sociales.csg.remplacement.pensions_retraite_invalidite.taux_plein
        formule: "v"
    type: nombre
    unite: pourcent
    facteur: 100
    bornes: [2.4, 20]

  - id: fiscalite.crds.taux
    domaine: fiscalite
    fichier: prelevements_sociaux
    theme: CSG et CRDS
    titre: "CRDS (taux)"
    explication: "La contribution au remboursement de la dette sociale finance le remboursement de la dette de la Sécurité sociale."
    lecture: prelevements_sociaux.contributions_sociales.crds
    type: nombre
    unite: pourcent
    facteur: 100
    bornes: [0, 5]

  - id: fiscalite.cotisations.allegement_general
    domaine: fiscalite
    fichier: prelevements_sociaux
    theme: Cotisations sociales
    titre: "Réduction générale des cotisations patronales : plafond (en SMIC)"
    explication: "Les employeurs paient moins de cotisations sur les bas et moyens salaires. La réduction est maximale au SMIC et s'annule à ce multiple du SMIC."
    lecture: prelevements_sociaux.reductions_cotisations_sociales.allegement_general.ensemble_des_entreprises.plafond
    type: nombre
    unite: smic
