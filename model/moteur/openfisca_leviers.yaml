  - id: fiscalite.tva.taux_normal
    domaine: fiscalite
    fichier: tva
    theme: TVA
    titre: "TVA : taux normal"
    explication: "Taxe incluse dans le prix de la plupart des biens et services (vêtements, électronique, carburant…)."
    lecture: taxation_indirecte.tva.taux_normal
    type: nombre
    unite: pourcent
    facteur: 100
    bornes: [0, 35]

  - id: fiscalite.tva.taux_intermediaire
    domaine: fiscalite
    fichier: tva
    theme: TVA
    titre: "TVA : taux intermédiaire"
    explication: "Taux appliqué notamment à la restauration, aux transports de voyageurs et à certains travaux dans les logements."
