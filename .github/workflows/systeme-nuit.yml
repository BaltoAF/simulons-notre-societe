# Le Système, chaque nuit : nouvelle version d'OpenFisca-France (validée sur des cas de contrôle), règles resynchronisées,
# population recalée, banc d'essai rejoué (system/maj_quotidienne.py). Si quelque chose a changé et que les tests passent,
# la nouvelle version est publiée sur main ; le serveur la met en ligne et publie la nouvelle « loi actuelle ».
name: systeme-nuit
on:
  schedule:
    - cron: "30 2 * * *"   # 3 h 30 à Paris l'hiver, 4 h 30 l'été
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency: fusion-main

jobs:
  systeme:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Mise à jour du Système
        env:
          SOCIETE_DATA_DIR: ${{ runner.temp }}/donnees
          PYTHONIOENCODING: utf-8
        # les liens des sources sont vérifiés par le serveur, au fil des jours
        run: python system/maj_quotidienne.py --sans-liens --epingler backend/requirements.txt
      - name: Quelque chose a changé ?
        id: diff
        run: echo "change=$([ -n "$(git status --porcelain -- model backend/requirements.txt)" ] && echo oui || echo non)" >> "$GITHUB_OUTPUT"
      - name: Tests avec la nouvelle version
        if: steps.diff.outputs.change == 'oui'
        working-directory: backend
        run: python -m pytest -q tests
      - name: Publier
        if: steps.diff.outputs.change == 'oui'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "Le Système"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add model backend/requirements.txt
          git commit -q -m "Système : mise à jour du $(date +%d/%m/%Y)" -m "$(git diff --cached --stat | tail -1)"
          git pull -q --rebase origin main
          git push origin main
          gh workflow run tests.yml --ref main
